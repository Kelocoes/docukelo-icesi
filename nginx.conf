# Configuracion de nginx solo para revisar el build de produccion en local (stage `serve`).
# La publicacion real la sirve GitHub Pages.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        # Docusaurus genera <ruta>/index.html para cada pagina.
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Los assets con hash en el nombre no cambian nunca.
    location ~* /assets/.+\.(js|css|woff2?|png|jpe?g|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
