name: Deploy to GitHub Pages

# - push a main: construye el sitio con Docker (multi-stage) y lo publica en GitHub Pages.
# - pull request hacia main: solo construye, para detectar enlaces rotos o errores de MDX
#   antes de mezclar (`onBrokenLinks: 'throw'`). No publica nada.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Una sola publicacion a la vez; si llega otra, espera en vez de cancelar la que va en curso.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo para "Ultima actualizacion")
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Ejecuta los stages deps -> build -> export del Dockerfile y deja el sitio estatico en ./build
      - name: Build site (Dockerfile multi-stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: export
          outputs: type=local,dest=./build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
