    return [

      {

  // ---------- 4. Construcción de la escena compuesta ----------
  DK.player({
    mount: document.getElementById('app'),
    ariaLabel: 'Flujo completo de archivos, puertos y transformación de datos entre Next.js (Clean Architecture) y NestJS (GraphQL)',
    phases: ['Frontend (Clean Arch)', 'Red + Backend (NestJS)', 'Retorno y Transformación'],
    wide: true,
    scene: function (svg, stage) {
      // Asegurar que `svg` está dentro del stage + agregar barra de transformación e IDE debajo
      var layersScene = DK.layers({ svg: svg, width: 1020, height: 428, nodes: nodes, labels: 'smart', trail: 'phase' });

      var xformBox = el('div', { class: 'dk-xform', 'aria-live': 'polite' });
      var treeLines = el('div', { class: 'dk-tree-lines' });
      var treeBox = el('div', { class: 'dk-treebox' },

        treeLines
      );

      var edTitle = el('span', { text: 'Archivo' });
      var edPill = el('span', { class: 'side-pill f', text: 'FRONT · :3001' });

      stage.append(xformBox, ide);

      var allSteps = [], activeFile = null, pinnedFile = null;

      function renderXform(list) {
        xformBox.replaceChildren(el('span', { class: 'xf-lbl', text: 'Transformación del dato:' }));
        (list || ['Selecciona «Siguiente» para recorrer el flujo']).forEach(function (item, idx) {
          if (idx > 0) xformBox.appendChild(el('span', { class: 'xf-arr', text: '→' }));
          xformBox.appendChild(el('code', { text: item }));
        });
      }

      function renderCode(fileId, hlLines) {
        var f = FILES[fileId];
        if (!f) return;
        edTitle.textContent = fileId;
        edPill.textContent = f.side === 'f' ? 'FRONT · :3001' : 'BACK · :4000';
        edPill.className = 'side-pill ' + f.side;
        edBody.replaceChildren();
        var firstOn = null;
        f.code.split('\n').forEach(function (line, idx) {
          var num = idx + 1;
          var isOn = hlLines && hlLines.indexOf(num) >= 0;
          var row = el('div', { class: 'l' + (isOn ? ' on' : '') },
            el('span', { class: 'ln', text: String(num) }),
            el('span', {})
          );
          row.lastChild.innerHTML = DK.highlight(line) || ' ';
          if (isOn && !firstOn) firstOn = row;
          edBody.appendChild(row);
        });
        if (firstOn) {
          edBody.scrollTop = Math.max(0, firstOn.offsetTop - 44);
        }
      }

      function renderTree(currentId) {
        treeLines.replaceChildren();
        TREE_ITEMS.forEach(function (it) {
          if (it.dir) {
            treeLines.appendChild(el('div', { class: 'dk-tln dir' + (it.side === 'b' ? ' back' : '') },
              el('span', { class: 'art', text: it.art }),
              el('span', { class: 'nm', text: it.label })
            ));
            return;
          }
          var isOn = it.id === currentId;
          var row = el('button', {
            type: 'button',
            class: 'dk-tln file' + (isOn ? ' on' : '') + (it.side === 'b' ? ' back' : ''),
            style: 'width:100%;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left;',
            onclick: function () {
              pinnedFile = it.id;
              renderTree(it.id);
              var curStep = allSteps.find(function (s) { return s.file === activeFile; });
              renderCode(it.id, it.id === activeFile && curStep ? curStep.lines : []);
            }
          },
            el('span', { class: 'art', text: it.art }),
            el('span', { class: 'fb ' + it.side, text: it.side.toUpperCase() }),
            el('span', { class: 'nm', text: it.label }),
            it.isNew ? el('span', { class: 'tag-new', text: 'nuevo' }) : null
          );
          treeLines.appendChild(row);
          if (isOn) {
            var top = row.offsetTop - treeLines.clientHeight / 2;
            if (top > 0) treeLines.scrollTop = top;
          }
        });
      }

      return {
        msgDuration: layersScene.msgDuration,
        setSteps: function (s) {
          allSteps = s;
          layersScene.setSteps(s);
        },
        render: function (i, animate) {
          var out = layersScene.render(i, animate);
          var st = i >= 0 ? allSteps[i] : null;
          pinnedFile = null;
          if (!st) {
            activeFile = 'front/src/features/routines/di/routine.container.ts';
            renderXform(['Pulsa «Siguiente» o abre «Pantalla completa» para inspeccionar todo el flujo']);
            renderTree(activeFile);
            renderCode(activeFile, [5, 6]);
          } else {
            activeFile = st.file;
            renderXform(st.xform);
            renderTree(st.file);
            renderCode(st.file, st.lines);
          }
          return out;
        }
      };

    intro: {
      kicker: 'Mapa integral · Clean Architecture ↔ NestJS GraphQL',
      title: 'Flujo completo de extremo a extremo (Front :3001 ↔ Back :4000)',
      text: 'Combina el mapa arquitectónico, la transformación exacta del dato en cada frontera y un explorador IDE con el árbol de archivos (tree -L) y las líneas activas. Usa «Pantalla completa» arriba a la derecha para verlo en grande.'
