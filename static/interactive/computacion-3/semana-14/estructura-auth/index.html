      codeTitle: 'auth-mock-datasource.ts (resumido)', code: 'import "server-only"\nimport { createHmac } from "node:crypto"\n\nconst USER_PERMISSIONS = ["view_routines"]\nconst ADMIN_PERMISSIONS = ["view_routines", "create_routines"]\n\nfunction signMockToken(payload: object) { /* cabecera.contenido.firma, HS256 */ }\n\nexport class AuthMockDatasource {\n  async login(dto) {\n    const found = this.users.find((u) => u.email === dto.email && u.password === dto.password)\n    if (!found) return null\n    const exp = Math.floor(Date.now() / 1000) + 3600\n    return { access_token: signMockToken({\n      sub: String(found.id), name: found.full_name,\n      role: found.role, permissions: found.permissions, exp,\n    }) }\n  }\n}' },

    { path: 'src/lib/dal.ts', isNew: true, hidden: true, edit: 'always', purpose: 'El Data Access Layer: lee la sesión en el servidor. getSession() la devuelve o null; con las guardias se suman requireSession() y requirePermission().',

      codeTitle: 'dal.ts', code: 'import "server-only"\n\nexport async function getSession() {\n  const token = (await cookies()).get(SESSION_COOKIE)?.value\n  const payload = decodeToken(token)\n  if (!payload || !token) return null\n  return { userId: payload.sub, name: payload.name,\n    role: payload.role, permissions: payload.permissions, accessToken: token }\n}\n\nexport async function requireSession() {\n  const session = await getSession()\n  if (!session) redirect("/login")\n  return session\n}\n\nexport async function requirePermission(permission: string) {\n  const session = await requireSession()\n  if (!session.permissions.includes(permission)) throw new Error("No tienes permiso")\n  return session\n}' },

  // ---- lo que aparece en cada paso (se acumula) ----
  var DOMAIN = [A + 'domain/', A + 'domain/entities/', A + 'domain/entities/auth-tokens.ts', A + 'domain/entities/user.ts', A + 'domain/repositories/', A + 'domain/repositories/auth.repository.ts', A + 'domain/usecases/', A + 'domain/usecases/login.usecase.ts', A + 'domain/usecases/register.usecase.ts'];
  var INFRA = [A + 'infrastructure/', A + 'infrastructure/dtos/', A + 'infrastructure/dtos/auth.dto.ts', A + 'infrastructure/mappers/', A + 'infrastructure/mappers/user.mapper.ts', A + 'infrastructure/mappers/auth-tokens.mapper.ts', A + 'infrastructure/datasources/', A + 'infrastructure/datasources/auth-datasource.interface.ts', A + 'infrastructure/datasources/auth-mock-datasource.ts', A + 'infrastructure/repositories/', A + 'infrastructure/repositories/auth.repository.impl.ts'];
  var DI = [A + 'di/', A + 'di/auth.container.ts'];
  var PRES = [A + 'presentation/actions/', A + 'presentation/actions/auth.actions.ts', A + 'presentation/hooks/', A + 'presentation/hooks/use-auth.ts', A + 'presentation/store/', A + 'presentation/store/auth.slice.ts', A + 'presentation/viewmodels/', A + 'presentation/viewmodels/auth.viewmodel.ts', A + 'presentation/components/AuthHydrator.tsx'];
  var LIB = ['src/lib/', 'src/lib/session.ts', 'src/lib/dal.ts'];
  var G_LIB = ['src/lib/token.ts'];
  var G_ROUT = [R + 'presentation/components/RoutinesView.tsx', R + 'presentation/actions/', R + 'presentation/actions/routines.actions.ts'];
  var G_ROOT = ['proxy.ts'];
  var s1 = DOMAIN, s2 = s1.concat(INFRA), s3 = s2.concat(DI), s4 = s3.concat(PRES), s5 = s4.concat(LIB);
  var g1 = s5.concat(G_LIB), g2 = g1, g3 = g2.concat(G_ROUT), g4 = g3.concat(G_ROOT);

  var steps = [
    // ---- Fase 1: lo que ya tienes ----
    { phase: 0, title: 'El proyecto de las semanas 12 y 13', depth: 3,
      caption: 'Esta es la forma del proyecto con Redux, Clean Architecture y las pantallas de login y registro. Pasa el mouse o toca cada línea para ver su función.' },
    { phase: 0, title: 'app/: solo lo que necesita Next.js', focus: 'app/', depth: 3,
      caption: 'Las rutas del App Router. Los route groups (auth) y (app) organizan los archivos, pero no aparecen en la URL ni protegen nada.' },
    { phase: 0, title: 'features/routines: la feature con capas', focus: R, depth: 3,
      caption: 'Dominio, infraestructura, DI y presentación. La sesión no modifica sus capas internas.' },
    { phase: 0, title: 'features/auth: solo la parte visual', focus: A + 'presentation/components/LoginForm.tsx', depth: 6,
      caption: 'De la semana 13 existen los formularios, sin lógica de autenticación. La feature va a seguir la misma forma que routines.' },

    // ---- Fase 2: lo que agrega la sesion ----
    { phase: 1, title: 'Dominio: ¿estas credenciales dan un token?', depth: 6, show: s1, focus: A + 'domain/',
      caption: 'Un tipo, un contrato y los casos de uso. Nada de cookies ni de JWT: la sesión no es una regla de negocio.' },
    { phase: 1, title: 'Infraestructura: el backend simulado', depth: 6, show: s2, focus: A + 'infrastructure/',
      caption: 'El mock simula al backend y firma el JWT con el rol y los permisos. Con un backend real, un datasource HTTP ocupa su lugar y el dominio no se entera.' },
    { phase: 1, title: 'DI: se arma la feature', depth: 6, show: s3, focus: A + 'di/',
      caption: 'El Composition Root crea los casos de uso con sus dependencias, igual que en routines. Lleva server-only: nunca debe llegar al navegador.' },
    { phase: 1, title: 'Presentación: formulario, hook, thunk y acción', depth: 6, show: s4, focus: A + 'presentation/hooks/use-auth.ts',
      caption: 'La misma cadena de la semana 12: el formulario llama al hook, el hook despacha el thunk (en el slice) y el thunk invoca la Server Action.' },
    { phase: 1, title: 'La Server Action: la frontera con el servidor', depth: 6, show: s4, focus: A + 'presentation/actions/auth.actions.ts',
      caption: 'El thunk corre en el navegador; la acción corre en el servidor: pide el token, lo guarda en la cookie httpOnly (que solo el servidor puede escribir) y devuelve el usuario con su rol y sus permisos.' },
    { phase: 1, title: 'lib/: la sesión es transversal', depth: 6, show: s5, focus: 'src/lib/',
      caption: 'session.ts guarda y borra la cookie; dal.ts lee la sesión en el servidor. Como src/store/, lo usan todas las features.' },
    { phase: 1, title: 'El layout hidrata la interfaz', depth: 6, show: s5, focus: 'app/layout.tsx',
      caption: 'Al recargar, Redux nace vacío y el navegador no puede leer la cookie. El layout (servidor) la lee con getSession() y AuthHydrator llena el store.' },

    // ---- Fase 3: lo que agregan las guardias ----
    { phase: 2, title: 'token.ts: lo que comparten la sesión y el proxy', depth: 6, show: g1, focus: 'src/lib/token.ts',
      caption: 'El proxy necesita decodificar el token y saber cómo se llama la cookie, pero session.ts depende del servidor. Lo común se separa en un archivo puro.' },
    { phase: 2, title: 'El DAL exige sesión y permiso', depth: 6, show: g2, focus: 'src/lib/dal.ts',
      caption: 'requireSession() redirige a /login; requirePermission() además comprueba que el permiso esté en el token. Es el chequeo junto a la página o al dato.' },
    { phase: 2, title: 'La página se divide en servidor y cliente', depth: 6, show: g3, focus: 'app/(app)/routines/page.tsx',
      caption: 'La página de servidor exige el permiso y renderiza RoutinesView, la vista de cliente con los hooks. Un componente de cliente no puede llamar al DAL.' },
    { phase: 2, title: 'Las rutinas pasan por Server Actions', depth: 6, show: g3, focus: R + 'presentation/actions/routines.actions.ts',
      caption: 'Leer y crear rutinas exigen view_routines y create_routines dentro de cada acción: una acción es un endpoint público, y la página no la protege.' },
    { phase: 2, title: 'proxy.ts: la primera barrera', depth: 6, show: g4, base: '', focus: 'proxy.ts',
      caption: 'Redirige antes de renderizar a quien no tiene sesión. Solo mira que haya un token vigente: ni verifica la firma ni decide permisos.' },
    { phase: 2, title: 'Quién protege qué', depth: 6, show: g4, focus: 'src/lib/dal.ts',
      caption: 'El proxy comprueba que haya sesión; la página y cada acción comprueban el permiso con el DAL; la interfaz oculta lo que no puedes usar. Ninguna reemplaza al backend, que es quien verifica la firma.' },
  ];

  DK.player({
    mount: document.getElementById('app'),
    ariaLabel: 'Estructura de carpetas del proyecto de rutinas con la feature auth, la sesión y las guardias: dominio, infraestructura, DI, presentación, lib/session.ts, lib/dal.ts, lib/token.ts, proxy.ts y las acciones de rutinas',
    phases: ['Lo que ya tienes', 'Lo que agrega la sesión', 'Lo que agregan las guardias'],
    wide: true,
    scene: function (svg, stage) { return DK.files({ stage: stage, items: items }); },
    build: function () { return steps; },
    intro: {
      kicker: 'Sesión, guardias y Clean Architecture',
      title: 'Dónde va cada archivo',
      text: 'Parte del proyecto de las semanas 12 y 13 y mira dónde se ubica cada pieza de la sesión y de la protección de rutas sin romper la regla de dependencia.'
    }
  });
})();
</script>
