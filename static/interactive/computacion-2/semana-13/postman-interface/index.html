<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anatomía de la Interfaz de Postman</title>
<link rel="stylesheet" href="../../../_shared/dk-base.css">
<style>
  .dk-stage { width: 100% !important; max-width: none !important; }
  .pm-ui-svg { width: 100% !important; max-width: none !important; height: auto !important; display: block; }
  .pm-box-part { transition: opacity 0.3s ease; }
  .pm-highlight-rect { fill: none; stroke: var(--dk-accent, #2563eb); stroke-width: 3.5; rx: 8; stroke-dasharray: 8 5; animation: pmPulse 2s infinite ease-in-out; pointer-events: none; }
  @keyframes pmPulse { 0%, 100% { stroke-opacity: 1; stroke-width: 4; } 50% { stroke-opacity: 0.35; stroke-width: 2.5; } }
  .dimmed { opacity: 0.22; }
  .focused { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>

<script>if (window.parent === window) document.documentElement.classList.add('solo');</script>
<script src="../../../_shared/dk-theme.js"></script>
<script src="../../../_shared/dk-kit.js"></script>
<script src="../../../_shared/dk-player.js"></script>
<script>
(function () {
  var el = DK.el, S = DK.svg;

  var parts = [
    {
      id: 'env',
      title: '1 · Gestor de Entornos y Variables',
      kicker: 'Configuración de Contexto',
      caption: 'Ubicado en la esquina superior derecha. Permite alternar entre entornos (por ejemplo, "Dev - Spring Boot" en localhost:8080 vs. servidores en la nube) con un solo clic. Al activarlo, cualquier expresión {{variable}} se resuelve automáticamente sin cambiar las rutas en tus peticiones.',
      box: { x: 555, y: 4, width: 310, height: 34 }
    },
    {
      id: 'url',
      title: '2 · Constructor de Petición (Request Builder)',
      kicker: 'Verbo HTTP y URL Parametrizada',
      caption: 'Define el verbo semántico (GET, POST, PUT, DELETE) y la URL destino. Permite combinar variables de entorno ({{base_url}}) con la ruta del recurso (/api/v1/courses) y presionar "Send" para disparar la solicitud a través de la red hacia el puerto 8080 de Tomcat.',
      box: { x: 12, y: 50, width: 856, height: 58 }
    },
    {
      id: 'body',
      title: '3 · Editor de Body (Payload JSON para DTOs)',
      kicker: 'Cuerpo de la Solicitud',
      caption: 'En peticiones POST y PUT, se selecciona el formato "raw" y "JSON". Aquí se redacta el objeto que Spring Boot deserializará automáticamente en tu clase o Record DTO mediante Jackson y validará con las anotaciones de Jakarta (@Valid).',
      box: { x: 12, y: 152, width: 856, height: 156 }
    },
    {
      id: 'prereq',
      title: '4 · Pestaña Pre-request Script',
      kicker: 'Ejecución Previa en Sandbox',
      caption: 'Lógica en JavaScript que se ejecuta antes de enviar el paquete HTTP. Ideal para generar marcas de tiempo dinámicas (Date.now()), calcular identificadores UUID únicos o calcular firmas criptográficas con CryptoJS.',
      box: { x: 385, y: 114, width: 175, height: 34 }
    },
    {
      id: 'tests',
      title: '5 · Pestaña Tests (Post-response Scripts)',
      kicker: 'Aserciones y Persistencia de Variables',
      caption: 'Scripts en JavaScript que se ejecutan automáticamente tan pronto como llega la respuesta del backend. Permiten evaluar aserciones con pm.test() y pm.expect(), y persistir datos clave como el token JWT con pm.environment.set("jwt_token", token).',
      box: { x: 565, y: 114, width: 125, height: 34 }
    },
    {
      id: 'response',
      title: '6 · Panel de Inspección de Respuesta y Aserciones',
      kicker: 'Códigos HTTP, Latencia y Resultados',
      caption: 'Muestra el código de estado retornado por Spring Boot (200 OK, 201 Created, 400 Bad Request, 401 Unauthorized), el tiempo transcurrido en milisegundos y el peso de la transferencia. En la subpestaña "Test Results", verifica visualmente las pruebas superadas (3/3 PASS).',
      box: { x: 12, y: 312, width: 856, height: 168 }
    }
  ];

  function createScene() {
    var svg = S('svg', { viewBox: '0 0 880 490', class: 'pm-ui-svg' });

    // Window Outline
    svg.appendChild(S('rect', { x: 2, y: 2, width: 876, height: 486, rx: 12, fill: '#ffffff', stroke: '#cbd5e1', 'stroke-width': 1.8 }));

    // App Header Bar
    svg.appendChild(S('rect', { x: 2, y: 2, width: 876, height: 40, rx: 12, fill: '#0f172a' }));
    svg.appendChild(S('rect', { x: 2, y: 28, width: 876, height: 14, fill: '#1e293b' }));
    // Window dots
    svg.appendChild(S('circle', { cx: 20, cy: 20, r: 5.5, fill: '#ef4444' }));
    svg.appendChild(S('circle', { cx: 36, cy: 20, r: 5.5, fill: '#f59e0b' }));
    svg.appendChild(S('circle', { cx: 52, cy: 20, r: 5.5, fill: '#10b981' }));

    // Tab in header
    svg.appendChild(S('rect', { x: 80, y: 7, width: 220, height: 33, rx: 6, fill: '#334155' }));
    svg.appendChild(S('rect', { x: 92, y: 15, width: 48, height: 17, rx: 4, fill: '#d97706' }));
    svg.appendChild(S('text', { x: 116, y: 28, fill: '#ffffff', 'font-size': 11, 'font-weight': 800, 'text-anchor': 'middle', 'font-family': 'sans-serif' }, 'POST'));
    svg.appendChild(S('text', { x: 150, y: 28, fill: '#f1f5f9', 'font-size': 13, 'font-family': 'sans-serif', 'font-weight': 600 }, '/api/v1/courses'));

    // PART: Environment Selector (Alto contraste, perfectamente legible)
    var gEnv = S('g', { id: 'part-env', class: 'pm-box-part' });
    gEnv.appendChild(S('rect', { x: 560, y: 6, width: 300, height: 30, rx: 6, fill: '#1e293b', stroke: '#38bdf8', 'stroke-width': 1.5 }));
    gEnv.appendChild(S('circle', { cx: 578, cy: 21, r: 4.5, fill: '#22c55e' }));
    gEnv.appendChild(S('text', { x: 594, y: 26, fill: '#ffffff', 'font-size': 12.5, 'font-family': 'sans-serif', 'font-weight': 700 }, 'Entorno:'));
    gEnv.appendChild(S('text', { x: 652, y: 26, fill: '#38bdf8', 'font-size': 13, 'font-weight': 800, 'font-family': 'sans-serif' }, 'Dev - Spring Boot (Local)'));
    svg.appendChild(gEnv);

    // PART: Request Bar
    var gUrl = S('g', { id: 'part-url', class: 'pm-box-part' });
    gUrl.appendChild(S('rect', { x: 15, y: 53, width: 850, height: 52, rx: 8, fill: '#f8fafc', stroke: '#cbd5e1', 'stroke-width': 1.4 }));
    gUrl.appendChild(S('rect', { x: 20, y: 58, width: 85, height: 42, rx: 5, fill: '#fef3c7', stroke: '#d97706', 'stroke-width': 1.2 }));
    gUrl.appendChild(S('text', { x: 62, y: 85, fill: '#b45309', 'font-size': 15, 'font-weight': 800, 'font-family': 'sans-serif', 'text-anchor': 'middle' }, 'POST'));
    gUrl.appendChild(S('text', { x: 120, y: 84, fill: '#0284c7', 'font-size': 15, 'font-family': 'monospace', 'font-weight': 700 }, '{{base_url}}'));
    gUrl.appendChild(S('text', { x: 230, y: 84, fill: '#0f172a', 'font-size': 15, 'font-family': 'monospace', 'font-weight': 600 }, '/api/v1/courses'));
    gUrl.appendChild(S('rect', { x: 745, y: 58, width: 110, height: 42, rx: 5, fill: '#2563eb' }));
    gUrl.appendChild(S('text', { x: 800, y: 85, fill: '#ffffff', 'font-size': 15, 'font-weight': 700, 'font-family': 'sans-serif', 'text-anchor': 'middle' }, 'Send'));
    svg.appendChild(gUrl);

    // Sub-bar tabs
    svg.appendChild(S('line', { x1: 15, y1: 148, x2: 865, y2: 148, stroke: '#e2e8f0', 'stroke-width': 1.2 }));
    svg.appendChild(S('text', { x: 30, y: 136, fill: '#64748b', 'font-size': 13.5, 'font-family': 'sans-serif' }, 'Params'));
    svg.appendChild(S('text', { x: 110, y: 136, fill: '#64748b', 'font-size': 13.5, 'font-family': 'sans-serif' }, 'Authorization (Bearer)'));
    svg.appendChild(S('text', { x: 285, y: 136, fill: '#64748b', 'font-size': 13.5, 'font-family': 'sans-serif' }, 'Headers (3)'));
    svg.appendChild(S('text', { x: 385, y: 136, fill: '#2563eb', 'font-size': 14, 'font-weight': 700, 'font-family': 'sans-serif' }, 'Body'));
    svg.appendChild(S('line', { x1: 382, y1: 147, x2: 425, y2: 147, stroke: '#2563eb', 'stroke-width': 3 }));

    // PART: Pre-request Script Tab
    var gPre = S('g', { id: 'part-prereq', class: 'pm-box-part' });
    gPre.appendChild(S('text', { x: 445, y: 136, fill: '#64748b', 'font-size': 13.5, 'font-family': 'sans-serif' }, 'Pre-request Script'));
    svg.appendChild(gPre);

    // PART: Tests Tab
    var gTest = S('g', { id: 'part-tests', class: 'pm-box-part' });
    gTest.appendChild(S('text', { x: 605, y: 136, fill: '#64748b', 'font-size': 13.5, 'font-family': 'sans-serif' }, 'Tests (3)'));
    svg.appendChild(gTest);

    // PART: Body Editor (JSON formateado con flujo natural de tspans)
    var gBody = S('g', { id: 'part-body', class: 'pm-box-part' });
    gBody.appendChild(S('text', { x: 30, y: 172, fill: '#0f172a', 'font-size': 13, 'font-weight': 700, 'font-family': 'sans-serif' }, 'raw'));
    gBody.appendChild(S('rect', { x: 765, y: 156, width: 90, height: 26, rx: 4, fill: '#f1f5f9', stroke: '#cbd5e1', 'stroke-width': 1 }));
    gBody.appendChild(S('text', { x: 810, y: 174, fill: '#0284c7', 'font-size': 13, 'font-weight': 700, 'font-family': 'sans-serif', 'text-anchor': 'middle' }, 'JSON'));
    
    // Contenedor del código JSON
    gBody.appendChild(S('rect', { x: 15, y: 188, width: 850, height: 114, rx: 6, fill: '#f8fafc', stroke: '#cbd5e1', 'stroke-width': 1.2 }));
    // Separador de números de línea
    gBody.appendChild(S('line', { x1: 52, y1: 188, x2: 52, y2: 302, stroke: '#e2e8f0', 'stroke-width': 1 }));
    
    // Números de línea
    gBody.appendChild(S('text', { x: 34, y: 212, fill: '#94a3b8', 'font-size': 13, 'font-family': 'ui-monospace, monospace', 'text-anchor': 'middle' }, '1'));
    gBody.appendChild(S('text', { x: 34, y: 238, fill: '#94a3b8', 'font-size': 13, 'font-family': 'ui-monospace, monospace', 'text-anchor': 'middle' }, '2'));
    gBody.appendChild(S('text', { x: 34, y: 264, fill: '#94a3b8', 'font-size': 13, 'font-family': 'ui-monospace, monospace', 'text-anchor': 'middle' }, '3'));
    gBody.appendChild(S('text', { x: 34, y: 290, fill: '#94a3b8', 'font-size': 13, 'font-family': 'ui-monospace, monospace', 'text-anchor': 'middle' }, '4'));

    // Código JSON con tspans secuenciales (sin saltos ni coordenadas hardcodeadas)
    var line1 = S('text', { x: 68, y: 212, 'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace', 'font-size': 13.5, fill: '#0f172a' });
    line1.appendChild(S('tspan', {}, '{'));
    gBody.appendChild(line1);

    var line2 = S('text', { x: 68, y: 238, 'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace', 'font-size': 13.5 });
    line2.appendChild(S('tspan', { fill: '#0284c7', 'font-weight': 600 }, '  "title"'));
    line2.appendChild(S('tspan', { fill: '#0f172a' }, ': '));
    line2.appendChild(S('tspan', { fill: '#15803d' }, '"Computación en Internet 2"'));
    line2.appendChild(S('tspan', { fill: '#0f172a' }, ','));
    gBody.appendChild(line2);

    var line3 = S('text', { x: 68, y: 264, 'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace', 'font-size': 13.5 });
    line3.appendChild(S('tspan', { fill: '#0284c7', 'font-weight': 600 }, '  "credits"'));
    line3.appendChild(S('tspan', { fill: '#0f172a' }, ': '));
    line3.appendChild(S('tspan', { fill: '#b45309', 'font-weight': 700 }, '3'));
    gBody.appendChild(line3);

    var line4 = S('text', { x: 68, y: 290, 'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace', 'font-size': 13.5, fill: '#0f172a' });
    line4.appendChild(S('tspan', {}, '}'));
    gBody.appendChild(line4);

    svg.appendChild(gBody);

    // PART: Response Inspector
    var gResp = S('g', { id: 'part-response', class: 'pm-box-part' });
    gResp.appendChild(S('rect', { x: 15, y: 314, width: 850, height: 42, rx: 6, fill: '#f1f5f9', stroke: '#e2e8f0', 'stroke-width': 1.2 }));
    gResp.appendChild(S('text', { x: 30, y: 341, fill: '#0f172a', 'font-size': 14.5, 'font-weight': 800, 'font-family': 'sans-serif' }, 'Response'));
    gResp.appendChild(S('rect', { x: 470, y: 321, width: 110, height: 28, rx: 4, fill: '#dcfce7', stroke: '#16a34a', 'stroke-width': 1.2 }));
    gResp.appendChild(S('text', { x: 525, y: 340, fill: '#15803d', 'font-size': 13, 'font-weight': 800, 'font-family': 'sans-serif', 'text-anchor': 'middle' }, '201 Created'));
    gResp.appendChild(S('rect', { x: 600, y: 321, width: 110, height: 28, rx: 4, fill: '#ffffff', stroke: '#cbd5e1', 'stroke-width': 1.2 }));
    gResp.appendChild(S('text', { x: 655, y: 340, fill: '#334155', 'font-size': 13, 'font-family': 'sans-serif', 'text-anchor': 'middle', 'font-weight': 600 }, 'Tiempo: 45 ms'));
    gResp.appendChild(S('rect', { x: 730, y: 321, width: 120, height: 28, rx: 4, fill: '#ffffff', stroke: '#cbd5e1', 'stroke-width': 1.2 }));
    gResp.appendChild(S('text', { x: 790, y: 340, fill: '#334155', 'font-size': 13, 'font-family': 'sans-serif', 'text-anchor': 'middle', 'font-weight': 600 }, 'Tamaño: 824 B'));

    gResp.appendChild(S('line', { x1: 15, y1: 388, x2: 865, y2: 388, stroke: '#e2e8f0', 'stroke-width': 1 }));
    gResp.appendChild(S('text', { x: 30, y: 380, fill: '#64748b', 'font-size': 13, 'font-family': 'sans-serif' }, 'Body (JSON)'));
    gResp.appendChild(S('text', { x: 130, y: 380, fill: '#64748b', 'font-size': 13, 'font-family': 'sans-serif' }, 'Cookies'));
    gResp.appendChild(S('text', { x: 210, y: 380, fill: '#64748b', 'font-size': 13, 'font-family': 'sans-serif' }, 'Headers (7)'));
    gResp.appendChild(S('text', { x: 310, y: 380, fill: '#16a34a', 'font-size': 13.5, 'font-weight': 800, 'font-family': 'sans-serif' }, 'Test Results (3/3 PASS)'));
    gResp.appendChild(S('line', { x1: 308, y1: 387, x2: 465, y2: 387, stroke: '#16a34a', 'stroke-width': 3 }));

    gResp.appendChild(S('rect', { x: 15, y: 398, width: 850, height: 76, rx: 6, fill: '#f8fafc', stroke: '#e2e8f0', 'stroke-width': 1.2 }));
    gResp.appendChild(S('circle', { cx: 35, cy: 418, r: 5.5, fill: '#10b981' }));
    gResp.appendChild(S('text', { x: 50, y: 422, fill: '#0f172a', 'font-size': 13, 'font-weight': 600, 'font-family': 'sans-serif' }, 'PASS · Status code es 201 Created (Controlador Spring Boot)'));
    gResp.appendChild(S('circle', { cx: 35, cy: 442, r: 5.5, fill: '#10b981' }));
    gResp.appendChild(S('text', { x: 50, y: 446, fill: '#0f172a', 'font-size': 13, 'font-weight': 600, 'font-family': 'sans-serif' }, 'PASS · Response payload contiene id numérico autogenerado'));
    gResp.appendChild(S('circle', { cx: 35, cy: 466, r: 5.5, fill: '#10b981' }));
    gResp.appendChild(S('text', { x: 50, y: 470, fill: '#0f172a', 'font-size': 13, 'font-weight': 600, 'font-family': 'sans-serif' }, 'PASS · Variable de entorno {{course_id}} persistida exitosamente'));
    svg.appendChild(gResp);

    // Active Highlight Rect
    var highlight = S('rect', { class: 'pm-highlight-rect', x: 0, y: 0, width: 0, height: 0, style: 'display:none;' });
    svg.appendChild(highlight);

    return {
      svg: svg,
      highlight: highlight,
      render: function (stepIndex) {
        if (stepIndex < 0 || stepIndex >= parts.length) {
          highlight.style.display = 'none';
          ['part-env', 'part-url', 'part-body', 'part-prereq', 'part-tests', 'part-response'].forEach(function (id) {
            var node = svg.getElementById(id);
            if (node) { node.classList.remove('dimmed'); node.classList.add('focused'); }
          });
          return;
        }

        var part = parts[stepIndex];
        highlight.style.display = 'block';
        highlight.setAttribute('x', part.box.x);
        highlight.setAttribute('y', part.box.y);
        highlight.setAttribute('width', part.box.width);
        highlight.setAttribute('height', part.box.height);

        ['env', 'url', 'body', 'prereq', 'tests', 'response'].forEach(function (id) {
          var node = svg.getElementById('part-' + id);
          if (node) {
            if (id === part.id) {
              node.classList.remove('dimmed');
              node.classList.add('focused');
            } else {
              node.classList.remove('focused');
              node.classList.add('dimmed');
            }
          }
        });
      }
    };
  }

  var sceneObj;

  DK.player({
    mount: document.getElementById('app'),
    wide: true,
    ariaLabel: 'Explorador interactivo de la interfaz de Postman',
    phases: [
      'Entornos',
      'Petición',
      'Body JSON',
      'Pre-request',
      'Tests',
      'Respuesta'
    ],
    scene: function (svgEl, stage) {
      sceneObj = createScene();
      stage.replaceChildren(sceneObj.svg);
      return {
        setSteps: function () {},
        render: function (i) {
          sceneObj.render(i);
        }
      };
    },
    build: function () {
      return parts.map(function (p, idx) {
        return {
          phase: idx,
          title: p.title,
          kicker: p.kicker,
          caption: p.caption
        };
      });
    },
    kicker: function (p) {
      return parts[p] ? parts[p].kicker : '';
    },
    intro: {
      kicker: 'Guía visual de Postman',
      title: 'Anatomía de la Interfaz',
      text: 'Pulsa "Siguiente" para recorrer e iluminar cada área esencial de la interfaz de Postman: desde la selección de variables de entorno hasta la inspección de aserciones automatizadas.'
    }
  });
})();
</script>
</body>
</html>
