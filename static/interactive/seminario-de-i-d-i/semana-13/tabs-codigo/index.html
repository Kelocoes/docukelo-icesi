<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Código de las pestañas</title>
<link rel="stylesheet" href="../../../_shared/dk-base.css">
<link rel="stylesheet" href="../../../_shared/dk-tabs.css">
<style>
  .ide { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(0, 2fr); gap: 12px 16px; align-items: start; }
  .ide-left { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ide-left .dk-phone { flex: none; }
  .ide-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .ide-btns button { font: 600 12px system-ui, sans-serif; border: 1.5px solid var(--dk-line); background: transparent; color: var(--dk-ink); border-radius: 14px; padding: 4px 12px; cursor: pointer; }
  .ide-btns button:hover { border-color: var(--dk-ctl); color: var(--dk-ctl); }

  /* pila en miniatura */
  .stk { width: 100%; max-width: 262px; border: 1px solid var(--dk-line); border-radius: 12px; padding: 6px 8px 8px; background: var(--dk-card); }
  .stk h4 { margin: 0 0 6px; font: 700 11px system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--dk-muted); display: flex; justify-content: space-between; }
  .stk h4 b.ok { color: var(--dk-ack); } .stk h4 b.no { color: var(--dk-err); }
  .stk ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; min-height: 120px; justify-content: flex-start; }
  .stk li { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 9px; border: 2px solid var(--dk-line); border-radius: 8px; background: var(--dk-card); font: 700 12px ui-monospace, Consolas, monospace; }
  .stk li small { font: 600 10.5px system-ui, sans-serif; color: var(--dk-muted); }
  .stk li.top { border-color: var(--dk-ctl); background: color-mix(in srgb, var(--dk-ctl) 14%, var(--dk-card)); } .stk li.top small { color: var(--dk-ctl); }
  .stk li.new { animation: stk-in .45s cubic-bezier(.2, .8, .2, 1); }
  @keyframes stk-in { from { transform: translateX(60px); opacity: 0; } }

  /* teléfono (apoyo) */
  .ide .pf-appbar { display: flex; align-items: center; justify-content: center; position: relative; min-height: 42px; }
  .ide .pf-appbar .bk { position: absolute; left: 6px; top: 50%; margin-top: -16px; width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #1c1b1f; cursor: pointer; }
  .ide .pf-appbar .bk .pf-ic { width: 20px; height: 20px; }
  .ide .pf-kv { display: flex; justify-content: space-between; margin: 4px 0; font-size: 12.5px; } .ide .pf-kv span:first-child { color: #79747e; }
  .ide [data-act] { cursor: pointer; }
  .ide .hov { outline: 3px solid var(--dk-ctl); outline-offset: 1px; border-radius: 12px; }
  .pf-exit { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 20px; text-align: center; background: rgba(24, 24, 27, .93); color: #fff; z-index: 3; }
  .pf-exit.on { display: flex; } .pf-exit small { color: #d4d4d8; font-size: 12px; }

  /* editor */
  .ed { min-width: 0; border: 1px solid var(--dk-line); border-radius: 12px; overflow: hidden; background: var(--dk-card); }
  .ed-tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--dk-line); background: var(--dk-band); }
  .ed-tabs button { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 14px; border: 0; border-right: 1px solid var(--dk-line); background: transparent; color: var(--dk-muted); font: 600 12.5px ui-monospace, Consolas, monospace; cursor: pointer; }
  .ed-tabs button.on { background: var(--dk-card); color: var(--dk-ink); box-shadow: inset 0 -3px 0 var(--dk-ctl); }
  .ed-tabs button i { width: 8px; height: 8px; border-radius: 50%; background: var(--dk-ack); }
  .ed-path { padding: 4px 14px; border-bottom: 1px solid var(--dk-line); font: 600 11.5px ui-monospace, Consolas, monospace; color: var(--dk-muted); }
  .ed-code { height: 440px; overflow: auto; padding: 8px 0; font: 12.5px/1.75 ui-monospace, Consolas, monospace; }
  .ed-code .kw { color: var(--dk-s-kw); font-weight: 700; } .ed-code .ty { color: var(--dk-s-ty); font-weight: 600; } .ed-code .fn { color: var(--dk-s-fn); }
  .ed-code .ob { color: var(--dk-s-ob); } .ed-code .st { color: var(--dk-s-st); } .ed-code .nu { color: var(--dk-s-nu); } .ed-code .an { color: var(--dk-s-an); }
  .ed-code .cm { color: var(--dk-muted); font-style: italic; }
  .ln { display: flex; align-items: center; gap: 0; padding: 0 10px 0 0; border-left: 3px solid transparent; transition: background .3s; min-width: max-content; }
  .ln .no { flex: none; width: 36px; text-align: right; padding-right: 12px; color: var(--dk-muted); opacity: .6; user-select: none; }
  .ln .tx { white-space: pre; }
  .ln.run { background: var(--dk-band-on); border-left-color: var(--dk-ctl); animation: ln-flash 1.1s ease-out; }
  .ln.hov { background: var(--dk-band); border-left-color: var(--dk-p3); outline: 0; }
  @keyframes ln-flash { 0% { background: color-mix(in srgb, var(--dk-ctl) 38%, transparent); } }
  .lens { margin-left: 14px; flex: none; font: 700 11px system-ui, sans-serif; padding: 1px 9px; border-radius: 10px; border: 1.5px solid var(--dk-ctl); background: var(--dk-band-on); color: var(--dk-ctl); cursor: pointer; }
  .lens:disabled { border-color: var(--dk-line); background: transparent; color: var(--dk-muted); cursor: not-allowed; opacity: .75; }
  .lens.sw { border-color: var(--dk-p4); color: var(--dk-p4); background: color-mix(in srgb, var(--dk-p4) 12%, transparent); }
  .ide-cap { grid-column: 1 / -1; margin: 0; padding: 9px 14px; border-left: 4px solid var(--dk-ctl); border-radius: 8px; background: var(--dk-band); font-size: 14px; min-height: 44px; }
  .ide .dk-ph-hint { margin: 0; }
  @media (max-width: 760px) { .ide { grid-template-columns: 1fr; } .ed-code { height: 340px; } }
</style>
</head>
<body>
<div id="app"></div>

<script>if (window.parent === window) document.documentElement.classList.add('solo');</script>
<script src="../../../_shared/dk-theme.js"></script>
<script src="../../../_shared/dk-kit.js"></script>
<script src="../../../_shared/dk-tabs.js"></script>
<script>
/* Código de las pestañas: el teléfono (1/3) y el código por archivos (2/3), enlazados en los dos sentidos. Solo DATOS: archivos, acciones y mensajes. */
(function () {
  var L = function (t, o) { return Object.assign({ t: t }, o); };
  var IMP = "import 'package:flutter/material.dart';";
  var FILES = {
    'main.dart': { path: 'lib/main.dart', vis: function () { return false; }, lines: [
      L(IMP),
      L("import 'screens/main_screen.dart';"),
      L(''),
      L('void main() => runApp(const MiApp());'),
      L(''),
      L('class MiApp extends StatelessWidget {'),
      L('  const MiApp({super.key});'),
      L(''),
      L('  @override'),
      L('  Widget build(BuildContext context) {'),
      L('    return const MaterialApp('),
      L('      home: MainScreen(),', { run: 'reset', id: 'init', label: '▶ Reiniciar app' }),
      L('    );'),
      L('  }'),
      L('}'),
    ] },
    'main_screen.dart': { path: 'lib/screens/main_screen.dart', vis: function () { return !S.detail; }, lines: [
      L(IMP),
      L("import '../pages/cursos_page.dart';"),
      L("import '../pages/guardados_page.dart';"),
      L("import '../pages/perfil_page.dart';"),
      L(''),
      L('class MainScreen extends StatefulWidget {'),
      L('  const MainScreen({super.key});'),
      L(''),
      L('  @override'),
      L('  State<MainScreen> createState() => _MainScreenState();'),
      L('}'),
      L(''),
      L('class _MainScreenState extends State<MainScreen> {'),
      L('  int _selectedIndex = 0;', { id: 'state' }),
      L('  final _paginas = const [CursosPage(), GuardadosPage(), PerfilPage()];'),
      L(''),
      L('  @override'),
      L('  Widget build(BuildContext context) {'),
      L('    return Scaffold('),
      L("      appBar: AppBar(title: const Text('DocuKelo')),"),
      L('      %body%', { toggle: 'keep', id: 'body' }),
      L('      bottomNavigationBar: NavigationBar(', { pe: 'tab' }),
      L('        selectedIndex: _selectedIndex,'),
      L('        onDestinationSelected: (i) => setState(() => _selectedIndex = i),', { run: 'tab', id: 'tap', pe: 'tab', label: '▶ Siguiente pestaña' }),
      L('        destinations: const ['),
      L("          NavigationDestination(icon: Icon(Icons.school), label: 'Cursos'),"),
      L("          NavigationDestination(icon: Icon(Icons.bookmark), label: 'Guardados'),"),
      L("          NavigationDestination(icon: Icon(Icons.person), label: 'Perfil'),"),
      L('        ],'),
      L('      ),'),
      L('    );'),
      L('  }'),
      L('}'),
    ] },
    'cursos_page.dart': { path: 'lib/pages/cursos_page.dart', vis: function () { return !S.detail && S.tab === 0; }, lines: [
      L(IMP),
      L("import '../screens/detalle_curso_screen.dart';"),
      L(''),
      L('// Una Page no tiene Scaffold: solo el cuerpo de la pestaña'),
      L('class CursosPage extends StatelessWidget {'),
      L('  const CursosPage({super.key});'),
      L(''),
      L('  @override'),
      L('  Widget build(BuildContext context) {'),
      L('    return Column(children: ['),
      L("      const TextField(decoration: InputDecoration(labelText: 'Buscar')),", { pe: 'q' }),
      L('      ListTile(', { pe: 'curso' }),
      L("        title: const Text('Flutter Declarativo'),"),
      L('        onTap: () => Navigator.push(', { run: 'open', id: 'push', pe: 'curso', label: '▶ Ejecutar' }),
      L('          context,'),
      L('          MaterialPageRoute(builder: (_) =>'),
      L("              const DetalleCursoScreen(titulo: 'Flutter Declarativo')),"),
      L('        ),'),
      L('      ),'),
      L('    ]);'),
      L('  }'),
      L('}'),
    ] },
    'guardados_page.dart': { path: 'lib/pages/guardados_page.dart', vis: function () { return !S.detail && S.tab === 1; }, lines: [
      L(IMP),
      L(''),
      L('class GuardadosPage extends StatelessWidget {'),
      L('  const GuardadosPage({super.key});'),
      L(''),
      L('  @override'),
      L('  Widget build(BuildContext context) {'),
      L('    return const Center('),
      L("      child: Text('No tienes cursos guardados aún'),"),
      L('    );'),
      L('  }'),
      L('}'),
    ] },
    'perfil_page.dart': { path: 'lib/pages/perfil_page.dart', vis: function () { return !S.detail && S.tab === 2; }, lines: [
      L(IMP),
      L(''),
      L('class PerfilPage extends StatelessWidget {'),
      L('  const PerfilPage({super.key});'),
      L(''),
      L('  @override'),
      L('  Widget build(BuildContext context) {'),
      L('    return const Column(children: ['),
      L('      CircleAvatar(radius: 32, child: Icon(Icons.person)),'),
      L("      Text('Estudiante de Software'),"),
      L("      Text('Universidad Icesi · 2026'),"),
      L('    ]);'),
      L('  }'),
      L('}'),
    ] },
    'detalle_curso_screen.dart': { path: 'lib/screens/detalle_curso_screen.dart', vis: function () { return !!S.detail; }, lines: [
      L(IMP),
      L(''),
      L('class DetalleCursoScreen extends StatelessWidget {'),
      L('  final String titulo;'),
      L('  const DetalleCursoScreen({super.key, required this.titulo});'),
      L(''),
      L('  @override'),
      L('  Widget build(BuildContext context) {'),
      L('    return Scaffold('),
      L('      appBar: AppBar(title: Text(titulo)),', { pe: 'back' }),
      L('      body: Center('),
      L('        child: FilledButton(', { pe: 'volver' }),
      L('          onPressed: () => Navigator.pop(context),', { run: 'back', id: 'pop', pe: 'volver', label: '▶ Ejecutar' }),
      L("          child: const Text('Volver al catálogo'),"),
      L('        ),'),
      L('      ),'),
      L('    );'),
      L('  }'),
      L('}'),
    ] },
  };
  var ORDER = ['main.dart', 'main_screen.dart', 'cursos_page.dart', 'guardados_page.dart', 'perfil_page.dart', 'detalle_curso_screen.dart'];
  var PAGE_FILE = ['cursos_page.dart', 'guardados_page.dart', 'perfil_page.dart'];
  var NAMES = ['Cursos', 'Guardados', 'Perfil'];

  var MSG = {
    start: 'Toca una pestaña o un curso en el teléfono, o pulsa «▶» en el código: el teléfono y la pila cambian. La pestaña del editor sigue a la pantalla visible.',
    reset: 'home: MainScreen() → Navigator arranca con una ruta, la anfitriona. _selectedIndex vale 0.',
    tabKeep: 'onDestinationSelected llama a setState: cambia _selectedIndex y build() muestra otra página. La pila no se entera: sigue con una ruta.',
    tabDirect: 'setState cambia el índice y body construye otra página; la anterior se destruyó con lo que tenía escrito. La pila sigue con una ruta.',
    open: 'Navigator.push apila DetalleCursoScreen: pila de dos rutas. Su Scaffold cubre la barra inferior y su AppBar dibuja la flecha.',
    back: 'Navigator.pop desapila el detalle. MainScreen reaparece intacta, en la misma pestaña.',
    keep: 'body: IndexedStack(...): las tres páginas viven a la vez (solo una visible), así que el texto de «Buscar» se conserva al cambiar de pestaña.',
    direct: 'body: _paginas[_selectedIndex]: solo existe la página elegida. Al salir de Cursos se pierde el texto de «Buscar».',
  };

  var el = DK.el, t = DK.timers();
  var S = { tab: 0, detail: null, q: 'sillas', keep: true }, file = 'main_screen.dart';

  /* ---------- teléfono ---------- */
  var ph = DK.tabs.phone({ height: 330, on: function (act, arg) {
    if (act === 'tab') exec('tab', +arg); else if (act === 'open') exec('open', arg); else if (act === 'back') exec('back');
  }, onType: function (v) { S.q = v; } });
  var resetBtn = el('button', { text: 'Reiniciar' });
  var stkList = el('ol'), stkInfo = el('b');
  var stk = el('div', { class: 'stk' }, el('h4', {}, el('span', { text: 'Pila de rutas' }), el('span', {}, 'profundidad = ', stkInfo)), stkList);
  var left = el('div', { class: 'ide-left' }, ph.el, el('div', { class: 'ide-btns' }, resetBtn), stk);

  /* ---------- editor ---------- */
  var pathBar = el('div', { class: 'ed-path' }), tabs = el('div', { class: 'ed-tabs', role: 'tablist' }), code = el('div', { class: 'ed-code', tabindex: '0' });
  var cap = el('p', { class: 'ide-cap', 'aria-live': 'polite', text: MSG.start });
  var ide = el('div', { class: 'ide' }, left, el('div', { class: 'ed' }, tabs, pathBar, code), cap);
  document.getElementById('app').replaceChildren(el('div', { class: 'dk-card dk-wide' }, ide));

  var visibleFile = function () { return S.detail ? 'detalle_curso_screen.dart' : PAGE_FILE[S.tab]; };

  function paintPhone() { ph.render({ tab: S.tab, detail: S.detail, q: S.q }); }
  function paintStack(fresh) {
    stkList.replaceChildren();
    var rows = [['MainScreen', 'índice ' + S.tab + ' · ' + NAMES[S.tab]]];
    if (S.detail) rows.push(['DetalleCursoScreen', S.detail]);
    rows.slice().reverse().forEach(function (r, i) {
      stkList.appendChild(el('li', { class: (i === 0 ? 'top' : '') + (fresh && i === 0 ? ' new' : '') }, r[0], el('small', { text: i === 0 ? 'tope' : 'suspendida' })));
    });
    stkInfo.textContent = String(rows.length);
  }
  function paintTabs() {
    tabs.replaceChildren();
    ORDER.forEach(function (name) {
      var vis = FILES[name].vis();
      tabs.appendChild(el('button', { role: 'tab', class: name === file ? 'on' : '', 'aria-selected': String(name === file), onclick: function () { showFile(name); } },
        name, vis ? el('i', { title: 'Este archivo dibuja lo que se ve en el teléfono' }) : null));
    });
  }
  function paintCode(flashId) {
    code.replaceChildren();
    FILES[file].lines.forEach(function (ln, k) {
      var text = ln.t.replace('%body%', S.keep ? 'body: IndexedStack(index: _selectedIndex, children: _paginas),' : 'body: _paginas[_selectedIndex],');
      var row = el('div', { class: 'ln', 'data-id': ln.id || '', 'data-pe': ln.pe || '' }, el('span', { class: 'no', text: String(k + 1) }));
      var tx = el('span', { class: 'tx' }); tx.innerHTML = DK.highlight(text) || ' ';
      row.appendChild(tx);
      if (ln.run) {
        var ok = ln.run === 'reset' || FILES[file].vis();
        row.appendChild(el('button', { class: 'lens', text: ln.label, disabled: ok ? null : true, title: ok ? 'Ejecutar esta línea' : 'Este archivo no dibuja la pantalla visible',
          onclick: function () { exec(ln.run, ln.run === 'open' ? 'Flutter Declarativo' : undefined); } }));
      }
      if (ln.toggle) row.appendChild(el('button', { class: 'lens sw', text: S.keep ? 'cambiar a lista directa' : 'volver a IndexedStack', title: 'Edita esta línea', onclick: toggleKeep }));
      if (flashId && ln.id === flashId) row.classList.add('run');
      code.appendChild(row);
    });
  }
  function showFile(name, flashId) { file = name; pathBar.textContent = FILES[name].path; paintTabs(); paintCode(flashId); var r = code.querySelector('.run'); code.scrollTop = r ? Math.max(0, r.offsetTop - 120) : 0; }
  function say(m) { cap.textContent = m; }

  /* ---------- acciones ---------- */
  function apply(act, arg) {
    var fresh = false;
    if (act === 'reset') { S.tab = 0; S.detail = null; S.q = 'sillas'; say(MSG.reset); }
    else if (act === 'tab') {
      var from = S.tab; S.tab = typeof arg === 'number' ? arg : (S.tab + 1) % 3;
      if (!S.keep && from === 0 && S.tab !== 0) S.q = '';   // la lista directa destruyó CursosPage y su campo
      say(S.keep ? MSG.tabKeep : MSG.tabDirect);
    }
    else if (act === 'open') { S.detail = arg || 'Flutter Declarativo'; fresh = true; say(MSG.open); }
    else if (act === 'back') { S.detail = null; say(MSG.back); }
    paintPhone(); paintStack(fresh);
  }
  function exec(act, arg) {
    t.clear();
    var line = act === 'reset' ? { f: 'main.dart', id: 'init' } : act === 'tab' ? { f: 'main_screen.dart', id: 'tap' }
      : act === 'open' ? { f: 'cursos_page.dart', id: 'push' } : { f: 'detalle_curso_screen.dart', id: 'pop' };
    showFile(line.f, line.id);   // causa: se ve la línea que se ejecuta...
    t.later(function () { apply(act, arg); }, DK.reduced ? 0 : 450);   // ...y después cambian pila y teléfono
    t.later(function () { showFile(visibleFile()); }, DK.reduced ? 0 : 1700);   // el código sigue a la pantalla visible
  }
  function toggleKeep() {
    S.keep = !S.keep; if (!S.keep && S.tab !== 0) S.q = '';
    paintPhone(); paintCode('body'); say(S.keep ? MSG.keep : MSG.direct);
  }

  resetBtn.addEventListener('click', function () { exec('reset'); });

  // pasar el ratón por un elemento del teléfono marca su línea de código, y al revés
  function hover(on, pe) {
    if (!pe) return;
    [].forEach.call(code.querySelectorAll('.ln[data-pe="' + pe + '"]'), function (n) { n.classList.toggle('hov', on); });
    [].forEach.call(ph.el.querySelectorAll('[data-pe="' + pe + '"]'), function (n) { n.classList.toggle('hov', on); });
  }
  ide.addEventListener('mouseover', function (e) { var n = e.target.closest('[data-pe]'); if (n) hover(true, n.getAttribute('data-pe')); });
  ide.addEventListener('mouseout', function (e) { var n = e.target.closest('[data-pe]'); if (n) hover(false, n.getAttribute('data-pe')); });

  paintPhone(); paintStack(); showFile(file);
  DK.autoHeight();
})();
</script>
</body>
</html>
