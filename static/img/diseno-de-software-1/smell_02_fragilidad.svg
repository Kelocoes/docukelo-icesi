<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <style>
      .txt-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; letter-spacing: 0.04em; }
      .txt-sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; letter-spacing: 0.02em; }
      .txt-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; }
      .ghost-line { stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 4 5; fill: none; }
      .crack-line { stroke: #ef4444; stroke-width: 2.2; stroke-linecap: round; fill: none; }
    </style>
    <filter id="glow-shatter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-solid" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5454e9" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="grad-blue-frag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e6ef2"/>
      <stop offset="100%" stop-color="#5454e9"/>
    </linearGradient>
    <linearGradient id="grad-shard-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="grad-shard-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Fondo sutil con bordes redondeados -->
  <rect x="2" y="2" width="516" height="216" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Título y subtítulo -->
  <text x="24" y="28" class="txt-title">FRAGILIDAD (FRAGILITY)</text>
  <text x="24" y="44" class="txt-sub">Un cambio en un punto quiebra partes lejanas sin relación aparente</text>

  <!-- MÓDULO IZQUIERDO: Modificación Inocua -->
  <g id="module-edited" transform="translate(45, 75)" filter="url(#glow-solid)">
    <!-- Polígono suave hexagonal -->
    <polygon points="50,10 85,30 85,75 50,95 15,75 15,30" fill="url(#grad-blue-frag)"/>
    <!-- Icono de edición suave (Delta) -->
    <circle cx="50" cy="52" r="16" fill="#ffffff" opacity="0.95"/>
    <path d="M50 43 L58 59 L42 59 Z" fill="#5454e9"/>
    <text x="50" y="116" text-anchor="middle" class="txt-label" fill="#5454e9">Módulo A (Editado)</text>
  </g>

  <!-- ZONA INTERMEDIA: Ausencia de relación conceptual (El abismo misterioso) -->
  <g id="distance-gap">
    <path d="M140 128 C 190 90, 230 160, 280 128 C 310 108, 330 128, 350 128" class="ghost-line"/>
    <rect x="205" y="105" width="105" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="257" y="119" text-anchor="middle" font-family="system-ui" font-size="9px" font-weight="700" fill="#64748b">¿SIN RELACIÓN?</text>
  </g>

  <!-- MÓDULO DERECHO: El Quiebre Catastrófico / Cristal Roto -->
  <g id="module-broken" transform="translate(350, 70)" filter="url(#glow-shatter)">
    <!-- Fragmento superior izquierdo desprendido -->
    <polygon points="40,8 10,28 32,54" fill="url(#grad-shard-1)" transform="translate(-8, -10) rotate(-8 30 30)"/>

    <!-- Fragmento superior derecho -->
    <polygon points="42,8 85,30 58,52" fill="url(#grad-shard-2)" transform="translate(10, -6) rotate(6 60 30)"/>

    <!-- Fragmento central partido -->
    <polygon points="32,54 58,52 48,82 22,75" fill="url(#grad-shard-1)"/>

    <!-- Fragmento inferior derecho caído -->
    <polygon points="58,52 85,75 50,98 48,82" fill="url(#grad-shard-2)" transform="translate(8, 8) rotate(12 60 80)"/>

    <!-- Fragmento inferior izquierdo desplazado -->
    <polygon points="10,28 32,54 22,75 12,70" fill="url(#grad-shard-1)" transform="translate(-10, 6) rotate(-10 20 60)"/>

    <!-- Grietas de impacto luminoso -->
    <path d="M40 8 L32 54 L58 52 L48 82 L50 98" class="crack-line"/>
    <line x1="32" y1="54" x2="10" y2="28" class="crack-line"/>
    <line x1="58" y1="52" x2="85" y2="30" class="crack-line"/>

    <!-- Destellos de error (Sparks) -->
    <circle cx="8" cy="85" r="3" fill="#ef4444"/>
    <circle cx="95" cy="18" r="3.5" fill="#ef4444"/>
    <circle cx="92" cy="98" r="2.5" fill="#f87171"/>

    <!-- Icono de rayo central -->
    <polygon points="38,36 46,36 42,48 48,48 37,64 40,52 35,52" fill="#ffffff"/>

    <text x="50" y="121" text-anchor="middle" class="txt-label" fill="#dc2626">Módulo Z (¡Roto!)</text>
  </g>
</svg>
