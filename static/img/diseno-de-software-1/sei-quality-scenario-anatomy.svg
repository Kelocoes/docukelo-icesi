<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580">
  <defs>
    <style>
      :root {
        --canvas: #f8fafc;
        --card: #ffffff;
        --card-border: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent-source: #b45309;
        --accent-source-bg: #fef3c7;
        --accent-stimulus: #1d4ed8;
        --accent-stimulus-bg: #dbeafe;
        --accent-env: #475569;
        --accent-env-bg: #f1f5f9;
        --accent-artifact: #6d28d9;
        --accent-artifact-bg: #ede9fe;
        --accent-response: #0f766e;
        --accent-response-bg: #ccfbf1;
        --accent-measure: #047857;
        --accent-measure-bg: #d1fae5;
        --conn-line: #94a3b8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0b1120;
          --card: #1e293b;
          --card-border: #334155;
          --text-primary: #f8fafc;
          --text-secondary: #cbd5e1;
          --text-muted: #94a3b8;
          --accent-source: #f59e0b;
          --accent-source-bg: #78350f33;
          --accent-stimulus: #60a5fa;
          --accent-stimulus-bg: #1e3a8a44;
          --accent-env: #94a3b8;
          --accent-env-bg: #33415544;
          --accent-artifact: #c084fc;
          --accent-artifact-bg: #581c8744;
          --accent-response: #2dd4bf;
          --accent-response-bg: #134e4a44;
          --accent-measure: #34d399;
          --accent-measure-bg: #064e3b44;
          --conn-line: #475569;
        }
      }
      .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    </style>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="580" rx="16" fill="var(--canvas)" stroke="var(--card-border)" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(40, 28)">
    <rect width="270" height="26" rx="6" fill="var(--accent-stimulus-bg)"/>
    <text x="135" y="17" class="font-sans" font-size="11" font-weight="700" fill="var(--accent-stimulus)" text-anchor="middle" letter-spacing="0.5">MODELO FORMAL SEI / BASS ET AL.</text>
    <text x="0" y="52" class="font-sans" font-size="22" font-weight="800" fill="var(--text-primary)">Anatomia Hexapartita de un Escenario de Calidad</text>
    <text x="0" y="74" class="font-sans" font-size="13" font-weight="400" fill="var(--text-secondary)">Estructura canonica para desambiguar requerimientos no funcionales mediante pruebas cuantitativas y verificables</text>
  </g>

  <!-- Flow Visual Outline: Environment Wrapper -->
  <g transform="translate(40, 116)">
    <!-- 4. ENTORNO (ENVIRONMENT) BOUNDARY BOX -->
    <rect x="0" y="0" width="920" height="290" rx="14" fill="var(--canvas)" stroke="var(--accent-env)" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Environment Badge -->
    <g transform="translate(24, -14)">
      <rect width="320" height="28" rx="6" fill="var(--accent-env-bg)" stroke="var(--accent-env)" stroke-width="1"/>
      <text x="160" y="18" class="font-sans" font-size="12" font-weight="700" fill="var(--accent-env)" text-anchor="middle">4. ENTORNO / CONTEXTO AMBIENTAL</text>
    </g>
    <text x="360" y="-5" class="font-sans" font-size="11" font-style="italic" fill="var(--text-muted)">Estado y modo operativo del sistema (hora pico, degradado, recuperacion de red, mantenimiento)</text>

    <!-- 1. FUENTE DEL ESTIMULO (SOURCE) -->
    <g transform="translate(30, 40)" filter="url(#shadow)">
      <rect width="160" height="150" rx="10" fill="var(--card)" stroke="var(--card-border)" stroke-width="1.5"/>
      <rect x="0" y="0" width="160" height="34" rx="10" fill="var(--accent-source-bg)"/>
      <rect x="0" y="24" width="160" height="10" fill="var(--accent-source-bg)"/>
      <text x="80" y="22" class="font-sans" font-size="12" font-weight="700" fill="var(--accent-source)" text-anchor="middle">1. FUENTE</text>
      
      <text x="16" y="58" class="font-sans" font-size="11" font-weight="600" fill="var(--text-primary)">¿Quien genera el evento?</text>
      <text x="16" y="76" class="font-sans" font-size="10" fill="var(--text-secondary)">- Usuarios externos</text>
      <text x="16" y="92" class="font-sans" font-size="10" fill="var(--text-secondary)">- Sensores telematicos</text>
      <text x="16" y="108" class="font-sans" font-size="10" fill="var(--text-secondary)">- Modems OBU (buses)</text>
      <text x="16" y="124" class="font-sans" font-size="10" fill="var(--text-secondary)">- Sistemas auditores</text>

      <rect x="12" y="136" width="136" height="2" fill="var(--accent-source)"/>
    </g>

    <!-- Connector Source -> Stimulus -->
    <path d="M 190 115 L 222 115" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 2. ESTIMULO (STIMULUS) -->
    <g transform="translate(230, 40)" filter="url(#shadow)">
      <rect width="170" height="150" rx="10" fill="var(--card)" stroke="var(--card-border)" stroke-width="1.5"/>
      <rect x="0" y="0" width="170" height="34" rx="10" fill="var(--accent-stimulus-bg)"/>
      <rect x="0" y="24" width="170" height="10" fill="var(--accent-stimulus-bg)"/>
      <text x="85" y="22" class="font-sans" font-size="12" font-weight="700" fill="var(--accent-stimulus)" text-anchor="middle">2. ESTIMULO</text>
      
      <text x="16" y="58" class="font-sans" font-size="11" font-weight="600" fill="var(--text-primary)">¿Que evento ocurre?</text>
      <text x="16" y="76" class="font-sans" font-size="10" fill="var(--text-secondary)">- Rafaga de telemetria</text>
      <text x="16" y="92" class="font-sans" font-size="10" fill="var(--text-secondary)">- Solicitud de cambio</text>
      <text x="16" y="108" class="font-sans" font-size="10" fill="var(--text-secondary)">- Falla de canal celular</text>
      <text x="16" y="124" class="font-sans" font-size="10" fill="var(--text-secondary)">- Consulta masiva de app</text>

      <rect x="12" y="136" width="146" height="2" fill="var(--accent-stimulus)"/>
    </g>

    <!-- Connector Stimulus -> Artifact -->
    <path d="M 400 115 L 432 115" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 3. ARTEFACTO (ARTIFACT) -->
    <g transform="translate(440, 30)" filter="url(#shadow)">
      <rect width="180" height="170" rx="12" fill="var(--card)" stroke="var(--accent-artifact)" stroke-width="2"/>
      <rect x="0" y="0" width="180" height="36" rx="12" fill="var(--accent-artifact-bg)"/>
      <rect x="0" y="26" width="180" height="10" fill="var(--accent-artifact-bg)"/>
      <text x="90" y="23" class="font-sans" font-size="12" font-weight="700" fill="var(--accent-artifact)" text-anchor="middle">3. ARTEFACTO</text>
      
      <text x="16" y="58" class="font-sans" font-size="11" font-weight="700" fill="var(--text-primary)">Elemento bajo prueba</text>
      <text x="16" y="76" class="font-sans" font-size="10" fill="var(--text-secondary)">- Ingesta telemática</text>
      <text x="16" y="92" class="font-sans" font-size="10" fill="var(--text-secondary)">- Motor de geocercas</text>
      <text x="16" y="108" class="font-sans" font-size="10" fill="var(--text-secondary)">- Calculador de headway</text>
      <text x="16" y="124" class="font-sans" font-size="10" fill="var(--text-secondary)">- Buffer local en OBU</text>
      <text x="16" y="140" class="font-sans" font-size="10" fill="var(--text-secondary)">- Base de series de tiempo</text>

      <rect x="14" y="152" width="152" height="3" fill="var(--accent-artifact)"/>
    </g>

    <!-- Connector Artifact -> Response -->
    <path d="M 620 115 L 652 115" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- 5. RESPUESTA (RESPONSE) -->
    <g transform="translate(660, 40)" filter="url(#shadow)">
      <rect width="150" height="150" rx="10" fill="var(--card)" stroke="var(--card-border)" stroke-width="1.5"/>
      <rect x="0" y="0" width="150" height="34" rx="10" fill="var(--accent-response-bg)"/>
      <rect x="0" y="24" width="150" height="10" fill="var(--accent-response-bg)"/>
      <text x="75" y="22" class="font-sans" font-size="12" font-weight="700" fill="var(--accent-response)" text-anchor="middle">5. RESPUESTA</text>
      
      <text x="14" y="58" class="font-sans" font-size="11" font-weight="600" fill="var(--text-primary)">Accion observable</text>
      <text x="14" y="76" class="font-sans" font-size="10" fill="var(--text-secondary)">- Absorber paquetes</text>
      <text x="14" y="92" class="font-sans" font-size="10" fill="var(--text-secondary)">- Procesar sin colapso</text>
      <text x="14" y="108" class="font-sans" font-size="10" fill="var(--text-secondary)">- Integrar nuevo sensor</text>
      <text x="14" y="124" class="font-sans" font-size="10" fill="var(--text-secondary)">- Reanudar publicacion</text>

      <rect x="12" y="136" width="126" height="2" fill="var(--accent-response)"/>
    </g>

    <!-- Connector Response -> Measure -->
    <path d="M 810 115 L 832 115" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- 6. MEDIDA DE RESPUESTA (RESPONSE MEASURE) -->
    <g transform="translate(730, 210)" filter="url(#shadow)">
      <rect width="170" height="66" rx="8" fill="var(--card)" stroke="var(--accent-measure)" stroke-width="2"/>
      <rect x="0" y="0" width="170" height="24" rx="8" fill="var(--accent-measure-bg)"/>
      <rect x="0" y="18" width="170" height="6" fill="var(--accent-measure-bg)"/>
      <text x="85" y="16" class="font-sans" font-size="11" font-weight="700" fill="var(--accent-measure)" text-anchor="middle">6. MEDIDA DE RESPUESTA</text>
      <text x="12" y="38" class="font-mono" font-size="10" font-weight="600" fill="var(--text-primary)">Latencia p99 &lt; 500 ms</text>
      <text x="12" y="52" class="font-mono" font-size="10" font-weight="600" fill="var(--text-primary)">0% pérdida de eventos</text>
    </g>
    <!-- Measurement link arrow -->
    <path d="M 735 190 L 735 210" stroke="#059669" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Context note inside environment box -->
    <g transform="translate(30, 220)">
      <rect width="670" height="50" rx="8" fill="var(--accent-env-bg)"/>
      <text x="16" y="20" class="font-sans" font-size="11" font-weight="700" fill="var(--accent-env)">EJEMPLO ENTORNO METROCALI MIO:</text>
      <text x="16" y="38" class="font-sans" font-size="10" fill="var(--text-secondary)">Hora pico (06:30 - 08:30), 950 buses transmitiendo concurrentemente; salida masiva de 100 buses del Túnel del Bulevar del Río con reconexión 4G instantánea.</text>
    </g>
  </g>

  <!-- Bottom Comparative Callout Footer -->
  <g transform="translate(40, 428)">
    <rect width="920" height="124" rx="10" fill="var(--card)" stroke="var(--card-border)" stroke-width="1.2"/>
    
    <!-- Left: Vague Requirement (Anti-pattern) -->
    <g transform="translate(24, 18)">
      <rect width="180" height="22" rx="4" fill="#fee2e2"/>
      <text x="90" y="15" class="font-sans" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">REQUERIMIENTO VAGO (ANTIPATRÓN)</text>
      <text x="0" y="44" class="font-sans" font-size="12" font-style="italic" fill="var(--text-muted)">"El sistema de telemetría de MetroCali debe ser rápido, altamente escalable y no debe colapsar cuando los buses pasen por túneles."</text>
      <text x="0" y="66" class="font-sans" font-size="10" font-weight="600" fill="#dc2626">Inverificable, ambiguo, sin criterio de aceptación ingenieril.</text>
    </g>

    <!-- Center separator line -->
    <line x1="450" y1="14" x2="450" y2="110" stroke="var(--card-border)" stroke-width="1"/>

    <!-- Right: Concrete Hexapartite Scenario -->
    <g transform="translate(470, 18)">
      <rect width="210" height="22" rx="4" fill="#d1fae5"/>
      <text x="105" y="15" class="font-sans" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">ESCENARIO SEI FORMULADO Y MEDIBLE</text>
      <text x="0" y="42" class="font-sans" font-size="11" font-weight="600" fill="var(--text-primary)">Cuando 100 buses emergen del túnel (Fuente/Estímulo) en hora pico (Entorno),</text>
      <text x="0" y="58" class="font-sans" font-size="11" fill="var(--text-secondary)">el motor de ingesta (Artefacto) debe drenar el backlog acumulado (Respuesta)</text>
      <text x="0" y="74" class="font-mono" font-size="11" font-weight="700" fill="var(--accent-measure)">en menos de 10 segundos, con cero pérdida y latencia p99 &lt; 800 ms (Medida).</text>
    </g>
  </g>
</svg>
