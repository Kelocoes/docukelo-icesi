<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <style>
      :root {
        --canvas: #f8fafc;
        --card: #ffffff;
        --card-border: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent-source: #b45309;
        --accent-source-bg: #fef3c7;
        --accent-stimulus: #1d4ed8;
        --accent-stimulus-bg: #dbeafe;
        --accent-env: #475569;
        --accent-env-bg: #f1f5f9;
        --accent-artifact: #6d28d9;
        --accent-artifact-bg: #ede9fe;
        --accent-response: #0f766e;
        --accent-response-bg: #ccfbf1;
        --accent-measure: #047857;
        --accent-measure-bg: #d1fae5;
        --conn-line: #94a3b8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0b1120;
          --card: #1e293b;
          --card-border: #334155;
          --text-primary: #f8fafc;
          --text-secondary: #cbd5e1;
          --text-muted: #94a3b8;
          --accent-source: #f59e0b;
          --accent-source-bg: #78350f33;
          --accent-stimulus: #60a5fa;
          --accent-stimulus-bg: #1e3a8a44;
          --accent-env: #94a3b8;
          --accent-env-bg: #33415544;
          --accent-artifact: #c084fc;
          --accent-artifact-bg: #581c8744;
          --accent-response: #2dd4bf;
          --accent-response-bg: #134e4a44;
          --accent-measure: #34d399;
          --accent-measure-bg: #064e3b44;
          --conn-line: #475569;
        }
      }
      .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    </style>

    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="520" rx="14" fill="var(--canvas)" stroke="var(--card-border)" stroke-width="1.5"/>

  <!-- Header Section -->
  <g transform="translate(45, 26)">
    <rect width="280" height="24" rx="5" fill="var(--accent-stimulus-bg)"/>
    <text x="140" y="16" class="font-sans" font-size="10" font-weight="700" fill="var(--accent-stimulus)" text-anchor="middle" letter-spacing="0.5">MODELO FORMAL SEI / BASS, CLEMENTS &amp; KAZMAN</text>
    <text x="0" y="50" class="font-sans" font-size="20" font-weight="800" fill="var(--text-primary)">Anatomia Hexapartita de un Escenario de Calidad</text>
    <text x="0" y="70" class="font-sans" font-size="12" font-weight="400" fill="var(--text-secondary)">Estructura formal para desambiguar requerimientos no funcionales mediante estímulos medibles</text>
  </g>

  <!-- 4. ENTORNO / CONTEXTO OPERACIONAL (BOUNDARY ENVELOPE) -->
  <g transform="translate(45, 114)">
    <rect width="910" height="375" rx="12" fill="var(--canvas)" stroke="var(--accent-env)" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Environment Badge Header -->
    <g transform="translate(24, -13)">
      <rect width="260" height="26" rx="6" fill="var(--accent-env-bg)" stroke="var(--accent-env)" stroke-width="1"/>
      <text x="130" y="17" class="font-sans" font-size="11" font-weight="700" fill="var(--accent-env)" text-anchor="middle">4. ENTORNO / CONTEXTO OPERACIONAL</text>
    </g>
    <text x="300" y="-3" class="font-sans" font-size="11" font-style="italic" fill="var(--text-muted)">Condición ambiental: Operación normal, hora pico matutina, recuperación de red o falla parcial</text>

    <!-- 1. FUENTE DEL ESTIMULO -->
    <g transform="translate(24, 35)" filter="url(#shadow)">
      <rect width="180" height="180" rx="10" fill="var(--card)" stroke="var(--card-border)" stroke-width="1.5"/>
      <rect width="180" height="32" rx="10" fill="var(--accent-source-bg)"/>
      <rect y="22" width="180" height="10" fill="var(--accent-source-bg)"/>
      <text x="90" y="21" class="font-sans" font-size="11" font-weight="700" fill="var(--accent-source)" text-anchor="middle">1. FUENTE</text>
      
      <text x="14" y="54" class="font-sans" font-size="11" font-weight="700" fill="var(--text-primary)">¿Quién genera?</text>
      <text x="14" y="72" class="font-sans" font-size="10" fill="var(--text-secondary)">• Módems OBU (buses)</text>
      <text x="14" y="90" class="font-sans" font-size="10" fill="var(--text-secondary)">• Sensores IoT (SoC/APC)</text>
      <text x="14" y="108" class="font-sans" font-size="10" fill="var(--text-secondary)">• Pasajeros en estación</text>
      <text x="14" y="126" class="font-sans" font-size="10" fill="var(--text-secondary)">• Operador de despacho</text>
      <text x="14" y="144" class="font-sans" font-size="10" fill="var(--text-secondary)">• Ingenieros dev/ops</text>

      <rect x="14" y="162" width="152" height="2" fill="var(--accent-source)"/>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 206 125 L 230 125" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- 2. ESTIMULO -->
    <g transform="translate(234, 35)" filter="url(#shadow)">
      <rect width="190" height="180" rx="10" fill="var(--card)" stroke="var(--card-border)" stroke-width="1.5"/>
      <rect width="190" height="32" rx="10" fill="var(--accent-stimulus-bg)"/>
      <rect y="22" width="190" height="10" fill="var(--accent-stimulus-bg)"/>
      <text x="95" y="21" class="font-sans" font-size="11" font-weight="700" fill="var(--accent-stimulus)" text-anchor="middle">2. ESTÍMULO</text>
      
      <text x="14" y="54" class="font-sans" font-size="11" font-weight="700" fill="var(--text-primary)">¿Qué evento ocurre?</text>
      <text x="14" y="72" class="font-sans" font-size="10" fill="var(--text-secondary)">• Tasa sostenida 320 ev/s</text>
      <text x="14" y="90" class="font-sans" font-size="10" fill="var(--text-secondary)">• Ráfaga 4.000 paquetes</text>
      <text x="14" y="108" class="font-sans" font-size="10" fill="var(--text-secondary)">• Pérdida de señal 4G/LTE</text>
      <text x="14" y="126" class="font-sans" font-size="10" fill="var(--text-secondary)">• Nuevo sensor telemático</text>
      <text x="14" y="144" class="font-sans" font-size="10" fill="var(--text-secondary)">• Exceso vel. troncal</text>

      <rect x="14" y="162" width="162" height="2" fill="var(--accent-stimulus)"/>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 426 125 L 450 125" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- 3. ARTEFACTO (SYSTEM UNDER TEST) -->
    <g transform="translate(454, 25)" filter="url(#shadow)">
      <rect width="210" height="200" rx="12" fill="var(--card)" stroke="var(--accent-artifact)" stroke-width="2"/>
      <rect width="210" height="34" rx="12" fill="var(--accent-artifact-bg)"/>
      <rect y="24" width="210" height="10" fill="var(--accent-artifact-bg)"/>
      <text x="105" y="22" class="font-sans" font-size="11" font-weight="700" fill="var(--accent-artifact)" text-anchor="middle">3. ARTEFACTO (BAJO PRUEBA)</text>
      
      <text x="14" y="54" class="font-sans" font-size="11" font-weight="700" fill="var(--text-primary)">Frontera afectada</text>
      <text x="14" y="72" class="font-sans" font-size="10" fill="var(--text-secondary)">• Pipeline de Ingesta</text>
      <text x="14" y="90" class="font-sans" font-size="10" fill="var(--text-secondary)">• Motor de Geocercas</text>
      <text x="14" y="108" class="font-sans" font-size="10" fill="var(--text-secondary)">• Calculador de Headways</text>
      <text x="14" y="126" class="font-sans" font-size="10" fill="var(--text-secondary)">• Puertos / Adaptadores</text>
      <text x="14" y="144" class="font-sans" font-size="10" fill="var(--text-secondary)">• Buffer local en OBU</text>
      <text x="14" y="162" class="font-sans" font-size="10" fill="var(--text-secondary)">• Repositorio de Auditoría</text>

      <rect x="14" y="180" width="182" height="3" fill="var(--accent-artifact)"/>
    </g>

    <!-- Arrow 3 -> 5 -->
    <path d="M 666 125 L 690 125" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>

    <!-- 5. RESPUESTA -->
    <g transform="translate(694, 35)" filter="url(#shadow)">
      <rect width="190" height="180" rx="10" fill="var(--card)" stroke="var(--card-border)" stroke-width="1.5"/>
      <rect width="190" height="32" rx="10" fill="var(--accent-response-bg)"/>
      <rect y="22" width="190" height="10" fill="var(--accent-response-bg)"/>
      <text x="95" y="21" class="font-sans" font-size="11" font-weight="700" fill="var(--accent-response)" text-anchor="middle">5. RESPUESTA</text>
      
      <text x="14" y="54" class="font-sans" font-size="11" font-weight="700" fill="var(--text-primary)">Acción observable</text>
      <text x="14" y="72" class="font-sans" font-size="10" fill="var(--text-secondary)">• Absorber backlog de ráfaga</text>
      <text x="14" y="90" class="font-sans" font-size="10" fill="var(--text-secondary)">• Validar y filtrar geopoint</text>
      <text x="14" y="108" class="font-sans" font-size="10" fill="var(--text-secondary)">• Despachar alerta instantánea</text>
      <text x="14" y="126" class="font-sans" font-size="10" fill="var(--text-secondary)">• Integrar adaptador nuevo</text>
      <text x="14" y="144" class="font-sans" font-size="10" fill="var(--text-secondary)">• Almacenar en flash local</text>

      <rect x="14" y="162" width="162" height="2" fill="var(--accent-response)"/>
    </g>

    <!-- Link line from Response to Measure -->
    <path d="M 789 217 L 789 248" stroke="#047857" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- 6. MEDIDA DE RESPUESTA (QUANTITATIVE CRITERIA) -->
    <g transform="translate(540, 250)" filter="url(#shadow)">
      <rect width="344" height="105" rx="10" fill="var(--card)" stroke="var(--accent-measure)" stroke-width="2"/>
      <rect width="344" height="30" rx="10" fill="var(--accent-measure-bg)"/>
      <rect y="20" width="344" height="10" fill="var(--accent-measure-bg)"/>
      <text x="172" y="20" class="font-sans" font-size="11" font-weight="700" fill="var(--accent-measure)" text-anchor="middle">6. MEDIDA DE RESPUESTA (CUANTITATIVA)</text>
      
      <text x="16" y="50" class="font-mono" font-size="10.5" font-weight="700" fill="var(--text-primary)">• Latencia p99 &lt; 500 ms (rendimiento)</text>
      <text x="16" y="68" class="font-mono" font-size="10.5" font-weight="700" fill="var(--text-primary)">• Drenado &lt; 10 s · 0% pérdidas (resiliencia)</text>
      <text x="16" y="86" class="font-mono" font-size="10.5" font-weight="700" fill="var(--text-primary)">• Esfuerzo &lt;= 3 días · 0 cambios en Core (modificabilidad)</text>
    </g>

    <!-- Context Callout: MetroCali MIO Real Domain -->
    <g transform="translate(24, 250)" filter="url(#shadow)">
      <rect width="496" height="105" rx="10" fill="var(--card)" stroke="var(--card-border)" stroke-width="1.2"/>
      <rect width="496" height="26" rx="10" fill="var(--accent-env-bg)"/>
      <rect y="16" width="496" height="10" fill="var(--accent-env-bg)"/>
      <text x="16" y="17" class="font-sans" font-size="10" font-weight="700" fill="var(--accent-env)">CASO REAL: METROCALI MIO (CALI, COLOMBIA)</text>
      
      <text x="16" y="46" class="font-sans" font-size="10" font-weight="600" fill="var(--text-primary)">• Flota activa:</text>
      <text x="96" y="46" class="font-sans" font-size="10" fill="var(--text-secondary)">950 buses en troncales y pretroncales (hora pico 06:30-08:30)</text>
      
      <text x="16" y="64" class="font-sans" font-size="10" font-weight="600" fill="var(--text-primary)">• Zonas de sombra:</text>
      <text x="118" y="64" class="font-sans" font-size="10" fill="var(--text-secondary)">Túnel Bulevar del Río (120 s sin red, 100 buses acumulados)</text>
      
      <text x="16" y="82" class="font-sans" font-size="10" font-weight="600" fill="var(--text-primary)">• Regla contractual:</text>
      <text x="122" y="82" class="font-sans" font-size="10" fill="var(--text-secondary)">Liquidación inmutable por km comercial efectivamente operado</text>
    </g>
  </g>
</svg>
