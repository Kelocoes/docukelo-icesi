<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="100%" height="100%">
  <defs>
    <style>
      .txt-title   { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; letter-spacing: 0.03em; }
      .txt-sub     { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
      .txt-card-t  { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .txt-card-s  { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; }
      .txt-card-m  { font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 600; }
      .txt-lbl     { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; }
      .badge-num   { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      
      .edge-wire   { stroke: #8b5cf6; stroke-width: 2; fill: none; }
      .edge-src    { stroke: #2563eb; stroke-width: 2; fill: none; }
      .edge-dip    { stroke: #059669; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
      .edge-run    { stroke: #ea580c; stroke-width: 2; stroke-dasharray: 4 3; fill: none; }
    </style>

    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="m-wire" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="m-src" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#2563eb"/>
    </marker>
    <marker id="m-dip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8 Z" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    </marker>
    <marker id="m-run" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Contenedor Base -->
  <rect x="2" y="2" width="816" height="476" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Encabezado -->
  <text x="32" y="32" class="txt-title">COMPOSITION ROOT Y ENSAMBLAJE PURA DI</text>
  <text x="32" y="49" class="txt-sub">Estructura del grafo de objetos: creación centralizada, contratos abstractos y dependencias invertidas</text>

  <!-- ============================================================== -->
  <!-- NODO 1: RAÍZ DE COMPOSICIÓN (Punto de Entrada)                -->
  <!-- ============================================================== -->
  <g id="node-composition-root" transform="translate(270, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="74" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.8"/>
    <rect x="0" y="0" width="280" height="26" rx="8" fill="#8b5cf6"/>
    <rect x="0" y="20" width="280" height="6" fill="#8b5cf6"/>
    
    <!-- Badge numérico 1 -->
    <circle cx="16" cy="13" r="9" fill="#6d28d9"/>
    <text x="16" y="13" class="badge-num">1</text>
    <text x="34" y="17" class="txt-card-t" fill="#ffffff">Raíz de Composición (Composition Root)</text>

    <text x="16" y="44" font-family="system-ui" font-size="11px" font-weight="700" fill="#4c1d95">MioApplication (main)</text>
    <text x="16" y="60" class="txt-card-s" fill="#6b21a8">Único módulo con permiso para usar new de infraestructura</text>
  </g>

  <!-- ============================================================== -->
  <!-- NODO 3: DOMINIO / SERVICIO CENTRAL                             -->
  <!-- ============================================================== -->
  <g id="node-domain-service" transform="translate(40, 220)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <rect x="0" y="0" width="220" height="26" rx="8" fill="#3b82f6"/>
    <rect x="0" y="20" width="220" height="6" fill="#3b82f6"/>

    <!-- Badge numérico 3 -->
    <circle cx="16" cy="13" r="9" fill="#1d4ed8"/>
    <text x="16" y="13" class="badge-num">3</text>
    <text x="34" y="17" class="txt-card-t" fill="#ffffff">Lógica de Dominio</text>

    <text x="16" y="46" font-family="system-ui" font-size="11px" font-weight="700" fill="#1e3a8a">BusTelemetryProcessor</text>
    <text x="16" y="62" class="txt-card-m" fill="#2563eb">- repository: TelemetryRepo</text>
    <text x="16" y="75" class="txt-card-m" fill="#2563eb">- notifier: AlertNotifier</text>
  </g>

  <!-- ============================================================== -->
  <!-- NODO 4: CONTRATOS DE INTERFAZ (PUERTOS)                        -->
  <!-- ============================================================== -->
  <g id="node-ports" transform="translate(310, 220)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="84" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="0" y="0" width="200" height="26" rx="8" fill="#f59e0b"/>
    <rect x="0" y="20" width="200" height="6" fill="#f59e0b"/>

    <!-- Badge numérico 4 -->
    <circle cx="16" cy="13" r="9" fill="#b45309"/>
    <text x="16" y="13" class="badge-num">4</text>
    <text x="34" y="17" class="txt-card-t" fill="#ffffff">Contratos de Interfaz (Puertos)</text>

    <text x="16" y="46" class="txt-card-m" fill="#92400e">&lt;&lt;interface&gt;&gt; TelemetryRepository</text>
    <text x="16" y="64" class="txt-card-m" fill="#92400e">&lt;&lt;interface&gt;&gt; AlertNotifier</text>
    <text x="16" y="77" class="txt-card-s" fill="#b45309">Abstracciones estables y puras</text>
  </g>

  <!-- ============================================================== -->
  <!-- NODO 5: ADAPTADORES CONCRETOS DE INFRAESTRUCTURA               -->
  <!-- ============================================================== -->
  <g id="node-adapters" transform="translate(560, 220)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="84" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.8"/>
    <rect x="0" y="0" width="220" height="26" rx="8" fill="#10b981"/>
    <rect x="0" y="20" width="220" height="6" fill="#10b981"/>

    <!-- Badge numérico 5 -->
    <circle cx="16" cy="13" r="9" fill="#047857"/>
    <text x="16" y="13" class="badge-num">5</text>
    <text x="34" y="17" class="txt-card-t" fill="#ffffff">Adaptadores de Infraestructura</text>

    <text x="16" y="46" class="txt-card-m" fill="#065f46">PostgreSqlTelemetryRepository</text>
    <text x="16" y="62" class="txt-card-m" fill="#065f46">SlackAlertNotifier</text>
    <text x="16" y="76" class="txt-card-s" fill="#047857">Plugins intercambiables (volátiles)</text>
  </g>

  <!-- ============================================================== -->
  <!-- CONEXIONES Y FLECHAS NUMERADAS                                 -->
  <!-- ============================================================== -->

  <!-- (2A) Cableado: main -> Adaptadores (new) -->
  <path d="M490 149 C 550 170, 630 180, 650 212" class="edge-wire" marker-end="url(#m-wire)"/>
  <rect x="560" y="162" width="76" height="18" rx="9" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="598" y="174" text-anchor="middle" class="txt-lbl" fill="#6d28d9">② Instancia</text>

  <!-- (2B) Cableado: main -> Dominio (Constructor Injection) -->
  <path d="M330 149 C 270 170, 180 180, 160 212" class="edge-wire" marker-end="url(#m-wire)"/>
  <rect x="180" y="162" width="86" height="18" rx="9" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="223" y="174" text-anchor="middle" class="txt-lbl" fill="#6d28d9">② Inyecta colaboradores</text>

  <!-- (A) Dominio -> Contratos (Código fuente) -->
  <path d="M260 262 L 302 262" class="edge-src" marker-end="url(#m-src)"/>

  <!-- (6) Inversión de Dependencias (DIP): Adaptador -> Contrato -->
  <path d="M560 262 L 518 262" class="edge-dip" marker-end="url(#m-dip)"/>
  <rect x="515" y="278" width="88" height="18" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="559" y="290" text-anchor="middle" class="txt-lbl" fill="#047857">⑥ Implementa (DIP)</text>

  <!-- (7) Flujo de Control en Runtime (Curva Naranja) -->
  <path d="M150 304 C 200 370, 600 370, 660 312" class="edge-run" marker-end="url(#m-run)"/>
  <rect x="345" y="360" width="130" height="20" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="410" y="373" text-anchor="middle" class="txt-lbl" fill="#c2410c">⑦ Flujo de Control en Runtime</text>

  <!-- ============================================================== -->
  <!-- LEYENDA INFERIOR DE TIPOS DE RELACIÓN                          -->
  <!-- ============================================================== -->
  <g id="legend" transform="translate(60, 415)">
    <rect x="0" y="0" width="700" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Ítem 1: Ensamblaje -->
    <line x1="20" y1="21" x2="50" y2="21" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="50" cy="21" r="3" fill="#8b5cf6"/>
    <text x="58" y="24" font-family="system-ui" font-size="9.5px" font-weight="600" fill="#475569">Ensamblaje (new / cableado)</text>

    <!-- Ítem 2: Dependencia compilación -->
    <line x1="230" y1="21" x2="260" y2="21" stroke="#2563eb" stroke-width="2"/>
    <path d="M260 18 L266 21 L260 24 Z" fill="#2563eb"/>
    <text x="274" y="24" font-family="system-ui" font-size="9.5px" font-weight="600" fill="#475569">Usa interfaz (compilación)</text>

    <!-- Ítem 3: Implementación DIP -->
    <line x1="430" y1="21" x2="460" y2="21" stroke="#059669" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M460 18 L466 21 L460 24 Z" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
    <text x="474" y="24" font-family="system-ui" font-size="9.5px" font-weight="600" fill="#475569">Implementa contrato (DIP)</text>

    <!-- Ítem 4: Flujo runtime -->
    <line x1="610" y1="21" x2="635" y2="21" stroke="#ea580c" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M635 18 L641 21 L635 24 Z" fill="#ea580c"/>
    <text x="648" y="24" font-family="system-ui" font-size="9.5px" font-weight="600" fill="#475569">Runtime</text>
  </g>
</svg>
