<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="100%" height="100%">
  <defs>
    <style>
      .txt-title   { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; letter-spacing: 0.03em; }
      .txt-sub     { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 500; fill: #64748b; }
      .txt-card-t  { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .txt-card-s  { font-family: ui-monospace, monospace; font-size: 9px;  font-weight: 600; }
      .txt-call    { font-family: ui-monospace, monospace; font-size: 9px;  font-weight: 600; fill: #2563eb; }
      .txt-flow    { font-family: system-ui, -apple-system, sans-serif; font-size: 9px;   font-weight: 700; fill: #d97706; }
      .txt-disp    { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 600; fill: #059669; }
      .solid-edge  { stroke: #2563eb; stroke-width: 2; fill: none; }
      .dispatch-edge { stroke: #059669; stroke-width: 1.8; stroke-dasharray: 4 3; fill: none; }
    </style>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Fondo base suave -->
  <rect x="2" y="2" width="676" height="246" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Título y subtítulo -->
  <text x="24" y="26" class="txt-title">POLIMORFISMO Y DESPACHO DINÁMICO EN RUNTIME</text>
  <text x="24" y="42" class="txt-sub">El cliente invoca una abstracción; el entorno de ejecución resuelve la implementación concreta</text>

  <!-- 1. COMPONENTE INVOCADOR / CLIENTE (Izquierda) -->
  <g id="client-caller" transform="translate(24, 75)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="168" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="168" height="26" rx="8" fill="#3b82f6"/>
    <!-- Rect para tapar esquinas inferiores del header -->
    <rect x="0" y="20" width="168" height="6" fill="#3b82f6"/>
    <text x="84" y="17" text-anchor="middle" class="txt-card-t" fill="#ffffff">Cliente Invocador</text>
    
    <text x="14" y="46" font-family="system-ui" font-size="10.5px" font-weight="700" fill="#1e3a8a">BusTelemetryProcessor</text>
    <text x="14" y="62" class="txt-card-s" fill="#64748b">Solo conoce la interfaz</text>

    <!-- Sentencia de invocación -->
    <rect x="10" y="74" width="148" height="24" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="16" y="90" class="txt-call">notifier.notify(...)</text>
  </g>

  <!-- FLECHA: Invocación estática a la interfaz -->
  <path d="M192 130 L 260 130" class="solid-edge" marker-end="url(#arrow-blue)"/>
  <text x="226" y="122" text-anchor="middle" class="txt-flow">Invoca</text>

  <!-- 2. CONTRATO ABSTRACTO / INTERFAZ (Centro) -->
  <g id="interface-contract" transform="translate(268, 70)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="164" height="120" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="0" y="0" width="164" height="26" rx="8" fill="#f59e0b"/>
    <rect x="0" y="20" width="164" height="6" fill="#f59e0b"/>
    <text x="82" y="17" text-anchor="middle" class="txt-card-t" fill="#ffffff">&lt;&lt;Interface&gt;&gt; Contrato</text>
    
    <text x="82" y="48" text-anchor="middle" font-family="system-ui" font-size="11px" font-weight="700" fill="#78350f">AlertNotifier</text>
    <line x1="12" y1="58" x2="152" y2="58" stroke="#fde68a" stroke-width="1"/>
    
    <text x="14" y="74" class="txt-card-s" fill="#92400e">+ notify(Alert)</text>
    
    <!-- Badge de abstracción estable -->
    <rect x="14" y="88" width="136" height="20" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="82" y="102" text-anchor="middle" font-family="system-ui" font-size="8.5px" font-weight="700" fill="#b45309">Abstracción Estable</text>
  </g>

  <!-- FLECHAS DE DESPACHO DINÁMICO EN RUNTIME (Hacia las concreciones) -->
  <g id="dispatch-arrows">
    <!-- Hacia Slack (Arriba) -->
    <path d="M432 110 C 460 90, 470 75, 492 75" class="dispatch-edge" marker-end="url(#arrow-green)"/>
    <!-- Hacia InMemory / Recording (Centro) -->
    <path d="M432 130 L 492 130" class="dispatch-edge" marker-end="url(#arrow-green)"/>
    <!-- Hacia Console (Abajo) -->
    <path d="M432 150 C 460 170, 470 185, 492 185" class="dispatch-edge" marker-end="url(#arrow-green)"/>

    <text x="464" y="100" text-anchor="middle" class="txt-disp">Despacho</text>
    <text x="464" y="110" text-anchor="middle" class="txt-disp">dinámico</text>
  </g>

  <!-- 3. IMPLEMENTACIONES CONCRETAS INTERCAMBIABLES (Derecha) -->
  <!-- A: SlackAlertNotifier -->
  <g id="impl-slack" transform="translate(500, 52)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="156" height="46" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
    <circle cx="14" cy="23" r="5" fill="#16a34a"/>
    <text x="26" y="20" font-family="system-ui" font-size="10px" font-weight="700" fill="#14532d">SlackAlertNotifier</text>
    <text x="26" y="34" class="txt-card-s" fill="#15803d">Producción (HTTP Webhook)</text>
  </g>

  <!-- B: RecordingAlertNotifier -->
  <g id="impl-recording" transform="translate(500, 107)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="156" height="46" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
    <circle cx="14" cy="23" r="5" fill="#16a34a"/>
    <text x="26" y="20" font-family="system-ui" font-size="10px" font-weight="700" fill="#14532d">RecordingAlertNotifier</text>
    <text x="26" y="34" class="txt-card-s" fill="#15803d">Testing Unitario (Memoria)</text>
  </g>

  <!-- C: ConsoleAlertNotifier -->
  <g id="impl-console" transform="translate(500, 162)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="156" height="46" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
    <circle cx="14" cy="23" r="5" fill="#16a34a"/>
    <text x="26" y="20" font-family="system-ui" font-size="10px" font-weight="700" fill="#14532d">ConsoleAlertNotifier</text>
    <text x="26" y="34" class="txt-card-s" fill="#15803d">Desarrollo Local (Stdout)</text>
  </g>
</svg>
