<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#7c3aed"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#ea580c"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    .t     { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 19px; font-weight: 700; fill: #0f172a; }
    .head  { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; }
    .dim   { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .lbl   { font-size: 10.5px; font-weight: 500; }
    .mono  { font-family: ui-monospace, Consolas, monospace; font-weight: 700; }
    .tag   { font-size: 10px; font-weight: 800; letter-spacing: .07em; }
  </style>

  <!-- Background -->
  <rect width="880" height="440" rx="16" fill="#f8fafc"/>

  <!-- Main Title -->
  <text x="32" y="38" class="t title">Cohesión interna (intra-módulo) vs. Acoplamiento externo (inter-módulo)</text>

  <!-- Central Divider with "vs" -->
  <line x1="440" y1="70" x2="440" y2="400" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="440" cy="235" r="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="440" y="239" class="t lbl" text-anchor="middle" fill="#94a3b8" font-size="11">vs</text>

  <!-- ==================== LEFT: ANTIPATTERN (LOW COHESION / HIGH COUPLING) ==================== -->
  <text x="236" y="78" class="t head" fill="#dc2626" text-anchor="middle">ANTIPATRÓN: BAJA COHESIÓN · ALTO ACOPLAMIENTO</text>

  <!-- Dimension Indicator Pill -->
  <rect x="116" y="90" width="240" height="18" rx="9" fill="#fee2e2"/>
  <text x="236" y="103" class="t dim" fill="#991b1b" text-anchor="middle">INTRA: TAREAS DISPARES · INTER: ENLACES RÍGIDOS</text>

  <!-- Tangled coupling curves in background -->
  <g fill="none" stroke="#fca5a5" stroke-width="1.8" opacity="0.65">
    <path d="M70,235 C140,320 220,130 330,300"/>
    <path d="M330,170 C220,150 140,340 70,235"/>
    <path d="M160,185 C220,290 280,180 320,270"/>
    <path d="M160,285 C220,170 280,280 280,185"/>
  </g>

  <!-- Monolith Class Container -->
  <rect x="106" y="118" width="260" height="236" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="236" y="142" class="t mono" fill="#b91c1c" text-anchor="middle" font-size="12">MonolithBusService</text>

  <!-- Disparate responsibilities inside monolith (low cohesion) -->
  <!-- 1. GPS -->
  <circle cx="160" cy="195" r="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="160" y="199" class="t mono" fill="#581c87" text-anchor="middle" font-size="9.5">GPS</text>
  <text x="160" y="226" class="t lbl" fill="#64748b" text-anchor="middle">telemetría</text>

  <!-- 2. Database -->
  <g transform="translate(280, 175)">
    <path d="M-16,6 V24 C-16,30 16,30 16,24 V6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <ellipse cx="0" cy="6" rx="16" ry="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <text x="0" y="21" class="t mono" fill="#14532d" text-anchor="middle" font-size="9">SQL</text>
    <text x="0" y="47" class="t lbl" fill="#64748b" text-anchor="middle">persistencia</text>
  </g>

  <!-- 3. Financial -->
  <polygon points="160,265 178,283 160,301 142,283" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="160" y="287" class="t mono" fill="#9a3412" text-anchor="middle" font-size="9">COP</text>
  <text x="160" y="318" class="t lbl" fill="#64748b" text-anchor="middle">tarifas</text>

  <!-- 4. UI / Log -->
  <g transform="translate(280, 265)">
    <rect x="-16" y="-8" width="32" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <line x1="-16" y1="-1" x2="16" y2="-1" stroke="#2563eb" stroke-width="1.5"/>
    <text x="0" y="12" class="t mono" fill="#1e3a8a" text-anchor="middle" font-size="9">LOG</text>
    <text x="0" y="35" class="t lbl" fill="#64748b" text-anchor="middle">formato</text>
  </g>

  <!-- External Client satellite with rigid direct coupling -->
  <rect x="36" y="215" width="48" height="34" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="236" class="t mono" fill="#991b1b" text-anchor="middle" font-size="9.5">Client</text>
  <path d="M84,232 L106,232" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a-red)"/>

  <!-- Left Bottom Tag -->
  <text x="236" y="385" class="t tag" fill="#991b1b" text-anchor="middle">ALTO ACOPLAMIENTO · CAMBIOS EN CASCADA</text>


  <!-- ==================== RIGHT: MODULAR DESIGN (HIGH COHESION / LOW COUPLING) ==================== -->
  <text x="654" y="78" class="t head" fill="#16a34a" text-anchor="middle">DISEÑO MODULAR: ALTA COHESIÓN · BAJO ACOPLAMIENTO</text>

  <!-- Dimension Indicator Pill -->
  <rect x="534" y="90" width="240" height="18" rx="9" fill="#dcfce7"/>
  <text x="654" y="103" class="t dim" fill="#166534" text-anchor="middle">INTRA: FOCO ÚNICO · INTER: PUERTOS LIMPIOS</text>

  <!-- Module 1: Telemetry Service (High Cohesion) -->
  <g transform="translate(470, 118)">
    <rect x="0" y="0" width="174" height="112" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="87" y="24" class="t head" fill="#581c87" text-anchor="middle">TELEMETRÍA</text>
    <!-- 3 identical circles strongly connected with generous spacing -->
    <circle cx="36" cy="62" r="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="36" y="66" class="t mono" fill="#581c87" text-anchor="middle" font-size="9.5">GPS</text>
    <circle cx="87" cy="62" r="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="87" y="66" class="t mono" fill="#581c87" text-anchor="middle" font-size="9.5">Ruta</text>
    <circle cx="138" cy="62" r="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="138" y="66" class="t mono" fill="#581c87" text-anchor="middle" font-size="9">Alerta</text>
    <!-- Strong internal links -->
    <line x1="52" y1="62" x2="71" y2="62" stroke="#7c3aed" stroke-width="3"/>
    <line x1="103" y1="62" x2="122" y2="62" stroke="#7c3aed" stroke-width="3"/>
    <text x="87" y="97" class="t lbl" fill="#7c3aed" text-anchor="middle">cohesión operativa</text>
  </g>

  <!-- Module 2: Concession Service (High Cohesion - Con amplio espaciado interno y respiración) -->
  <g transform="translate(470, 246)">
    <rect x="0" y="0" width="174" height="114" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <text x="87" y="24" class="t head" fill="#9a3412" text-anchor="middle">LIQUIDACIÓN</text>
    <!-- 3 diamonds amplios con respiración y holgura -->
    <!-- Element 1: Km (34px de ancho) -->
    <polygon points="36,44 53,61 36,78 19,61" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="36" y="65" class="t mono" fill="#9a3412" text-anchor="middle" font-size="9">Km</text>
    <!-- Element 2: COP (34px de ancho) -->
    <polygon points="87,44 104,61 87,78 70,61" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="87" y="65" class="t mono" fill="#9a3412" text-anchor="middle" font-size="9">COP</text>
    <!-- Element 3: Tarifa (34px de ancho) -->
    <polygon points="138,44 155,61 138,78 121,61" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="138" y="65" class="t mono" fill="#9a3412" text-anchor="middle" font-size="8.5">Tarifa</text>
    <!-- Strong internal links bien visibles -->
    <line x1="53" y1="61" x2="70" y2="61" stroke="#ea580c" stroke-width="3"/>
    <line x1="104" y1="61" x2="121" y2="61" stroke="#ea580c" stroke-width="3"/>
    <text x="87" y="99" class="t lbl" fill="#c2410c" text-anchor="middle">cohesión financiera</text>
  </g>

  <!-- Abstract Port / Contract (Low Coupling) -->
  <g transform="translate(690, 168)">
    <rect x="0" y="0" width="150" height="130" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="75" y="24" class="t head" fill="#14532d" text-anchor="middle">REPOSITORIO</text>
    <text x="75" y="39" class="t mono" fill="#166534" text-anchor="middle" font-size="9">&lt;interfaz&gt;</text>
    <!-- Clean storage icon -->
    <g transform="translate(75, 59)">
      <path d="M-18,6 V25 C-18,31 18,31 18,25 V6" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
      <ellipse cx="0" cy="6" rx="18" ry="6" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
      <text x="0" y="23" class="t mono" fill="#14532d" text-anchor="middle" font-size="9.5">Store</text>
    </g>
    <!-- Port connection dots on left edge -->
    <circle cx="0" cy="44" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="0" cy="88" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  </g>

  <!-- Clean decoupled wires via abstract port -->
  <path d="M644,162 C668,162 668,212 684,212" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#a-purple)"/>
  <path d="M644,310 C668,310 668,256 684,256" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#a-orange)"/>

  <!-- Right Bottom Tag -->
  <text x="654" y="385" class="t tag" fill="#166534" text-anchor="middle">BAJO ACOPLAMIENTO · MÓDULOS INDEPENDIENTES</text>
</svg>
