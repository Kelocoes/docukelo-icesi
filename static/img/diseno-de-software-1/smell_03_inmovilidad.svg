<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <style>
      .txt-title  { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; letter-spacing: 0.04em; }
      .txt-sub    { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; letter-spacing: 0.02em; }
      .txt-node   { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; }
      .txt-node-s { font-family: system-ui, -apple-system, sans-serif; font-size: 9px;   font-weight: 500; }
      .txt-flow   { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; fill: #2563eb; }
      .txt-dep    { font-family: ui-monospace, monospace; font-size: 8px; font-weight: 600; fill: #94a3b8; }
      .tether     { stroke: #ef4444; stroke-width: 2.2; stroke-linecap: round; fill: none; }
      .joint      { fill: #dc2626; stroke: #ffffff; stroke-width: 1.5; }
    </style>

    <filter id="glow-module" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5454e9" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-lock" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="grad-blue-mod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e6ef2"/>
      <stop offset="100%" stop-color="#5454e9"/>
    </linearGradient>

    <marker id="arrow-blue-pull" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Fondo base suave -->
  <rect x="2" y="2" width="516" height="216" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Título y subtítulo -->
  <text x="24" y="28" class="txt-title">INMOVILIDAD (IMMOBILITY)</text>
  <text x="24" y="44" class="txt-sub">Incapacidad de reutilizar un módulo valioso por estar atado a dependencias concretas</text>

  <!-- ARCO DE INTENTO DE EXTRACCIÓN (Hacia la nueva app) -->
  <path d="M165 92 C 240 50, 310 50, 375 88" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-blue-pull)"/>
  <text x="270" y="58" text-anchor="middle" class="txt-flow">Intentar reutilizar</text>

  <!-- DESTINO: Nueva Aplicación (Zona receptora) -->
  <g id="dest-app" transform="translate(415, 105)">
    <!-- Círculo receptor punteado con amplio respiro -->
    <circle cx="0" cy="0" r="34" fill="#f0fdf4" stroke="#86efac" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="14" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="12px" fill="#16a34a">+</text>
    <text x="0" y="48" text-anchor="middle" class="txt-node" fill="#15803d">Nueva Aplicación</text>
    <text x="0" y="61" text-anchor="middle" class="txt-node-s" fill="#16a34a">(Destino deseado)</text>
  </g>

  <!-- AMARRAS DE DEPENDENCIAS CONCRETAS (Tensas hacia abajo) -->
  <g id="tethers">
    <!-- Cuerdas rígidas rojas -->
    <path d="M110 132 L75 174" class="tether"/>
    <path d="M130 138 L130 174" class="tether"/>
    <path d="M150 132 L185 174" class="tether"/>

    <!-- Remaches de amarre -->
    <circle cx="75" cy="174" r="3.5" class="joint"/>
    <circle cx="130" cy="174" r="3.5" class="joint"/>
    <circle cx="185" cy="174" r="3.5" class="joint"/>

    <!-- Nodos concretos anclados en el fondo -->
    <circle cx="75" cy="174" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="130" cy="174" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="185" cy="174" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Etiquetas de detalles volátiles sin saturar -->
    <text x="75" y="196" text-anchor="middle" class="txt-dep">BD SQL</text>
    <text x="130" y="196" text-anchor="middle" class="txt-dep">HARDWARE</text>
    <text x="185" y="196" text-anchor="middle" class="txt-dep">DRIVER COM</text>
  </g>

  <!-- CANDADO / SÍMBOLO DE RETENCIÓN -->
  <g id="lock-icon" transform="translate(130, 146)" filter="url(#glow-lock)">
    <circle cx="0" cy="0" r="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <path d="M-3 -1 L-3 -4 C-3 -5.5, 3 -5.5, 3 -4 L 3 -1" fill="none" stroke="#dc2626" stroke-width="1.4"/>
    <rect x="-4" y="-1" width="8" height="6" rx="1" fill="#dc2626"/>
  </g>

  <!-- MÓDULO VALIOSO ATRAPADO (Centro Izquierdo) -->
  <g id="module-core" transform="translate(130, 105)" filter="url(#glow-module)">
    <!-- Círculo principal con gradiente indigo -->
    <circle cx="0" cy="0" r="34" fill="url(#grad-blue-mod)"/>
    <!-- Icono abstracto de lógica pura -->
    <circle cx="0" cy="0" r="15" fill="#ffffff" opacity="0.95"/>
    <circle cx="-5" cy="-2" r="3" fill="#5454e9"/>
    <circle cx="5" cy="-2" r="3" fill="#5454e9"/>
    <path d="M-6 6 C -2 10, 2 10, 6 6" fill="none" stroke="#5454e9" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Rótulo del módulo -->
    <text x="0" y="-42" text-anchor="middle" class="txt-node" fill="#4338ca">Lógica de Negocio</text>
    <text x="0" y="-53" text-anchor="middle" class="txt-node-s" fill="#6366f1">Módulo Valioso</text>
  </g>
</svg>
