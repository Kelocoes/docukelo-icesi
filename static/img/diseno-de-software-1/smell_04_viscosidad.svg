<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <style>
      .txt-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; letter-spacing: 0.04em; }
      .txt-sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; letter-spacing: 0.02em; }
      .txt-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; }
      .path-clean { stroke: #cbd5e1; stroke-width: 4; fill: none; stroke-linecap: round; }
      .path-viscous { stroke: #f59e0b; stroke-width: 3.5; stroke-dasharray: 6 5; fill: none; stroke-linecap: round; }
      .path-hack   { stroke: #ef4444; stroke-width: 3; fill: none; stroke-linecap: round; }
      .layer-bar   { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4 4; }
    </style>
    <filter id="glow-hack" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-viscous" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="grad-start" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e6ef2"/>
      <stop offset="100%" stop-color="#5454e9"/>
    </linearGradient>
    <linearGradient id="grad-hack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Fondo sutil con bordes redondeados -->
  <rect x="2" y="2" width="516" height="216" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Título y subtítulo -->
  <text x="24" y="28" class="txt-title">VISCOSIDAD (VISCOSITY)</text>
  <text x="24" y="44" class="txt-sub">Resulta más fácil y rápido meter un parche sucio que respetar el diseño</text>

  <!-- NODO DE ORIGEN: La nueva necesidad de cambio -->
  <g id="start-node" transform="translate(35, 105)">
    <circle cx="20" cy="20" r="18" fill="url(#grad-start)"/>
    <circle cx="20" cy="20" r="8" fill="#ffffff"/>
    <text x="20" y="52" text-anchor="middle" class="txt-label" fill="#5454e9">Nuevo Requerimiento</text>
  </g>

  <!-- BARRERAS ARQUITECTÓNICAS (Capas que se deben atravesar) -->
  <line x1="220" y1="65" x2="220" y2="185" class="layer-bar"/>
  <line x1="320" y1="65" x2="320" y2="185" class="layer-bar"/>
  <text x="220" y="60" text-anchor="middle" font-family="system-ui" font-size="8.5px" font-weight="700" fill="#94a3b8">CAPA DOMINIO</text>
  <text x="320" y="60" text-anchor="middle" font-family="system-ui" font-size="8.5px" font-weight="700" fill="#94a3b8">CAPA INFRA</text>

  <!-- CAMINO SUPERIOR: La vía correcta con fricción/viscosidad -->
  <g id="clean-path">
    <path d="M75 115 C 120 75, 170 85, 220 85 C 270 85, 370 85, 430 115" class="path-viscous" filter="url(#glow-viscous)"/>
    <!-- Compuertas de diseño ordenadas pero lentas -->
    <circle cx="170" cy="85" r="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="270" cy="85" r="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="370" cy="85" r="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Gotas de fricción / viscosidad -->
    <path d="M170 79 C 168 83, 166 85, 170 89 C 174 85, 172 83, 170 79 Z" fill="#d97706"/>
    <rect x="235" y="68" width="70" height="15" rx="7.5" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="270" y="79" text-anchor="middle" font-family="system-ui" font-size="8px" font-weight="700" fill="#b45309">ALTA FRICCIÓN</text>
  </g>

  <!-- CAMINO INFERIOR: El atajo del parche sucio (El Hack que perfora todo) -->
  <g id="hack-path">
    <path d="M75 130 C 130 165, 230 160, 430 130" class="path-hack" filter="url(#glow-hack)"/>
    <polygon points="438,128 426,122 428,136" fill="#ef4444"/>

    <!-- Parche / Curita estilizada sobre la capa perforada -->
    <g transform="translate(265, 150) rotate(-15)">
      <rect x="-16" y="-7" width="32" height="14" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.4"/>
      <circle cx="-6" cy="0" r="1.5" fill="#ef4444"/>
      <circle cx="0" cy="0" r="1.5" fill="#ef4444"/>
      <circle cx="6" cy="0" r="1.5" fill="#ef4444"/>
    </g>

    <rect x="235" y="172" width="70" height="15" rx="7.5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="270" y="183" text-anchor="middle" font-family="system-ui" font-size="8px" font-weight="700" fill="#dc2626">EL "HACK" FÁCIL</text>
  </g>

  <!-- NODO DESTINO: Producción / Despliegue -->
  <g id="end-node" transform="translate(440, 105)">
    <circle cx="20" cy="20" r="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <polyline points="14 20 18 24 26 16" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="52" text-anchor="middle" class="txt-label" fill="#475569">Producción</text>
  </g>
</svg>
