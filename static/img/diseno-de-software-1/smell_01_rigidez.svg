<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <style>
      .txt-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; letter-spacing: 0.04em; }
      .txt-sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; letter-spacing: 0.02em; }
      .txt-tag   { font-family: ui-monospace, monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .rigid-bar { stroke: #cbd5e1; stroke-width: 3.5; stroke-linecap: round; }
      .shock-bar { stroke: #ef4444; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 6 3; }
    </style>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5454e9" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e6ef2"/>
      <stop offset="100%" stop-color="#5454e9"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Fondo sutil con bordes redondeados -->
  <rect x="2" y="2" width="516" height="216" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Título y categoría del síntoma -->
  <text x="24" y="28" class="txt-title">RIGIDEZ (RIGIDITY)</text>
  <text x="24" y="44" class="txt-sub">Un cambio menor desata una cascada forzada de modificaciones</text>

  <!-- Red de barras rígidas altamente acopladas -->
  <g id="connections">
    <!-- Barras de transmisión de impacto -->
    <line x1="85" y1="125" x2="190" y2="85" class="shock-bar"/>
    <line x1="85" y1="125" x2="190" y2="165" class="shock-bar"/>
    <line x1="190" y1="85" x2="315" y2="70" class="shock-bar"/>
    <line x1="190" y1="85" x2="315" y2="125" class="shock-bar"/>
    <line x1="190" y1="165" x2="315" y2="125" class="shock-bar"/>
    <line x1="190" y1="165" x2="315" y2="180" class="shock-bar"/>
    <line x1="315" y1="70" x2="435" y2="95" class="shock-bar"/>
    <line x1="315" y1="125" x2="435" y2="95" class="shock-bar"/>
    <line x1="315" y1="125" x2="435" y2="160" class="shock-bar"/>
    <line x1="315" y1="180" x2="435" y2="160" class="shock-bar"/>
  </g>

  <!-- Ondas concéntricas de perturbación desde el origen -->
  <circle cx="85" cy="125" r="32" fill="none" stroke="#5454e9" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.4"/>
  <circle cx="85" cy="125" r="42" fill="none" stroke="#5454e9" stroke-width="1" stroke-dasharray="2 4" opacity="0.25"/>

  <!-- NODO 1: Origen del cambio (Delta) -->
  <g id="node-origin" filter="url(#glow-blue)">
    <circle cx="85" cy="125" r="22" fill="url(#grad-blue)"/>
    <path d="M85 113 L93 129 L77 129 Z" fill="#ffffff"/>
    <text x="85" y="162" text-anchor="middle" class="txt-sub" font-weight="700" fill="#5454e9">Δ Cambio 1</text>
  </g>

  <!-- NODOS EN CASCADA (Nivel 1) -->
  <g id="cascade-level-1">
    <circle cx="190" cy="85" r="16" fill="url(#grad-orange)" filter="url(#glow-red)"/>
    <circle cx="190" cy="85" r="7" fill="#ffffff" opacity="0.8"/>
    <circle cx="190" cy="165" r="16" fill="url(#grad-orange)" filter="url(#glow-red)"/>
    <circle cx="190" cy="165" r="7" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- NODOS EN CASCADA (Nivel 2) -->
  <g id="cascade-level-2">
    <circle cx="315" cy="70" r="14" fill="url(#grad-red)" filter="url(#glow-red)"/>
    <circle cx="315" cy="125" r="15" fill="url(#grad-red)" filter="url(#glow-red)"/>
    <circle cx="315" cy="180" r="14" fill="url(#grad-red)" filter="url(#glow-red)"/>
  </g>

  <!-- NODOS TERMINALES AFECTADOS (Nivel 3) -->
  <g id="cascade-level-3">
    <circle cx="435" cy="95" r="18" fill="url(#grad-red)" filter="url(#glow-red)"/>
    <text x="435" y="99" text-anchor="middle" class="txt-tag">MODIF!</text>
    <circle cx="435" cy="160" r="18" fill="url(#grad-red)" filter="url(#glow-red)"/>
    <text x="435" y="164" text-anchor="middle" class="txt-tag">MODIF!</text>
  </g>

  <!-- Etiquetas de paso de la reacción -->
  <g id="indicators">
    <rect x="228" y="116" width="48" height="18" rx="9" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="252" y="129" text-anchor="middle" font-family="system-ui" font-size="9px" font-weight="700" fill="#b91c1c">IMPACTO</text>
  </g>
</svg>
