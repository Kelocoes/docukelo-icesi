<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 575" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .badge { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 11px; fill: #ffffff; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; }
    .card-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11.5px; }
    .card-desc { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 11px; fill: #475569; }
    .flow-label { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 10.5px; fill: #64748b; }
  </style>

  <!-- Background card container -->
  <rect x="15" y="15" width="930" height="545" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Row 1 Left to Right: Cards 1, 2, 3 -->

  <!-- Card 1: Cliente HTTP -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="250" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#f1f5f9"/>
    <rect x="0" y="20" width="250" height="10" fill="#f1f5f9"/>
    <circle cx="20" cy="15" r="10" fill="#64748b"/>
    <text x="20" y="19" class="badge" text-anchor="middle">1</text>
    <text x="40" y="20" class="card-title" fill="#1e293b">Cliente (HTTP Request)</text>
    <text x="20" y="50" class="card-sub" fill="#475569">Navegador, Postman, App</text>
    <text x="20" y="73" class="card-desc">Emite la petición HTTP (GET, POST...)</text>
    <text x="20" y="91" class="card-desc">Contiene Headers, Params y Body JSON</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 295 105 L 355 105" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="325" y="96" class="flow-label" text-anchor="middle">Petición</text>

  <!-- Card 2: Middlewares -->
  <g transform="translate(365, 45)">
    <rect x="0" y="0" width="250" height="120" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#eff6ff"/>
    <rect x="0" y="20" width="250" height="10" fill="#eff6ff"/>
    <circle cx="20" cy="15" r="10" fill="#2563eb"/>
    <text x="20" y="19" class="badge" text-anchor="middle">2</text>
    <text x="40" y="20" class="card-title" fill="#1e3a8a">Middlewares</text>
    <text x="20" y="50" class="card-sub" fill="#2563eb">Procesamiento Temprano</text>
    <text x="20" y="73" class="card-desc">Acceso crudo a req y res</text>
    <text x="20" y="91" class="card-desc">CORS, Morgan logging y body parsing</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 615 105 L 675 105" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="645" y="96" class="flow-label" text-anchor="middle">Next()</text>

  <!-- Card 3: Guards -->
  <g transform="translate(685, 45)">
    <rect x="0" y="0" width="230" height="120" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.6" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="230" height="30" rx="10" fill="#fffbeb"/>
    <rect x="0" y="20" width="230" height="10" fill="#fffbeb"/>
    <circle cx="20" cy="15" r="10" fill="#d97706"/>
    <text x="20" y="19" class="badge" text-anchor="middle">3</text>
    <text x="40" y="20" class="card-title" fill="#92400e">Guards</text>
    <text x="20" y="50" class="card-sub" fill="#d97706">Seguridad y Permisos</text>
    <text x="20" y="73" class="card-desc">Valida token JWT o sesión</text>
    <text x="20" y="91" class="card-desc">Verifica roles de usuario (RBAC)</text>
  </g>

  <!-- Snake connector: Card 3 to Card 4 (down and left curve) -->
  <path d="M 800 165 C 800 200, 800 215, 800 230" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arr-indigo)"/>
  <text x="825" y="200" class="flow-label" text-anchor="start">Autorizado</text>

  <!-- Row 2 Right to Left: Cards 4, 5, 6 -->

  <!-- Card 4: Interceptors (Pre) -->
  <g transform="translate(685, 235)">
    <rect x="0" y="0" width="230" height="120" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.6" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="230" height="30" rx="10" fill="#eef2ff"/>
    <rect x="0" y="20" width="230" height="10" fill="#eef2ff"/>
    <circle cx="20" cy="15" r="10" fill="#4f46e5"/>
    <text x="20" y="19" class="badge" text-anchor="middle">4</text>
    <text x="40" y="20" class="card-title" fill="#312e81">Interceptors (Pre)</text>
    <text x="20" y="50" class="card-sub" fill="#4f46e5">Lógica Previa al Handler</text>
    <text x="20" y="73" class="card-desc">Inicia cronómetro de rendimiento</text>
    <text x="20" y="91" class="card-desc">Enriquece el contexto de ejecución</text>
  </g>

  <!-- Arrow 4 to 5 (Leftwards) -->
  <path d="M 685 295 L 625 295" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arr-teal)"/>
  <text x="655" y="286" class="flow-label" text-anchor="middle">Pasa a</text>

  <!-- Card 5: Pipes -->
  <g transform="translate(365, 235)">
    <rect x="0" y="0" width="250" height="120" rx="10" fill="#ffffff" stroke="#14b8a6" stroke-width="1.6" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#f0fdfa"/>
    <rect x="0" y="20" width="250" height="10" fill="#f0fdfa"/>
    <circle cx="20" cy="15" r="10" fill="#0d9488"/>
    <text x="20" y="19" class="badge" text-anchor="middle">5</text>
    <text x="40" y="20" class="card-title" fill="#134e4a">Pipes</text>
    <text x="20" y="50" class="card-sub" fill="#0d9488">Validación y Transformación</text>
    <text x="20" y="73" class="card-desc">Valida DTO con class-validator</text>
    <text x="20" y="91" class="card-desc">Transforma strings a number (ParseIntPipe)</text>
  </g>

  <!-- Arrow 5 to 6 (Leftwards) -->
  <path d="M 365 295 L 305 295" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-emerald)"/>
  <text x="335" y="286" class="flow-label" text-anchor="middle">Datos válidos</text>

  <!-- Card 6: Controller & Service -->
  <g transform="translate(45, 235)">
    <rect x="0" y="0" width="250" height="120" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.6" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#f0fdf4"/>
    <rect x="0" y="20" width="250" height="10" fill="#f0fdf4"/>
    <circle cx="20" cy="15" r="10" fill="#16a34a"/>
    <text x="20" y="19" class="badge" text-anchor="middle">6</text>
    <text x="40" y="20" class="card-title" fill="#14532d">Controller y Service</text>
    <text x="20" y="50" class="card-sub" fill="#16a34a">Enrutador y Lógica de Negocio</text>
    <text x="20" y="73" class="card-desc">Controller mapea la ruta (@Get, @Post)</text>
    <text x="20" y="91" class="card-desc">Service ejecuta reglas y repositorios</text>
  </g>

  <!-- Snake connector: Card 6 to Card 7 (down) -->
  <path d="M 170 355 C 170 380, 170 395, 170 415" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr-indigo)"/>
  <text x="180" y="388" class="flow-label" text-anchor="start">Retorno datos</text>

  <!-- Row 3 Left to Right: Cards 7, 8, 9 -->

  <!-- Card 7: Interceptors (Post) -->
  <g transform="translate(45, 420)">
    <rect x="0" y="0" width="250" height="120" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.6" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#eef2ff"/>
    <rect x="0" y="20" width="250" height="10" fill="#eef2ff"/>
    <circle cx="20" cy="15" r="10" fill="#4f46e5"/>
    <text x="20" y="19" class="badge" text-anchor="middle">7</text>
    <text x="40" y="20" class="card-title" fill="#312e81">Interceptors (Post)</text>
    <text x="20" y="50" class="card-sub" fill="#4f46e5">Transformación de Respuesta</text>
    <text x="20" y="73" class="card-desc">Envuelve respuestas en { data: ... }</text>
    <text x="20" y="91" class="card-desc">Calcula y loguea tiempo de ejecución</text>
  </g>

  <!-- Arrow 7 to 8 -->
  <path d="M 295 480 L 355 480" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#arr-rose)"/>
  <text x="325" y="471" class="flow-label" text-anchor="middle">Si hay error</text>

  <!-- Card 8: Exception Filters -->
  <g transform="translate(365, 420)">
    <rect x="0" y="0" width="250" height="120" rx="10" fill="#ffffff" stroke="#f43f5e" stroke-width="1.6" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#fff1f2"/>
    <rect x="0" y="20" width="250" height="10" fill="#fff1f2"/>
    <circle cx="20" cy="15" r="10" fill="#e11d48"/>
    <text x="20" y="19" class="badge" text-anchor="middle">8</text>
    <text x="40" y="20" class="card-title" fill="#881337">Exception Filters</text>
    <text x="20" y="50" class="card-sub" fill="#e11d48">Manejo Centralizado Errores</text>
    <text x="20" y="73" class="card-desc">Captura excepciones (404, 400, 500)</text>
    <text x="20" y="91" class="card-desc">Estandariza el JSON de error emitido</text>
  </g>

  <!-- Arrow 8 to 9 -->
  <path d="M 615 480 L 675 480" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-slate)"/>
  <text x="645" y="471" class="flow-label" text-anchor="middle">Envío final</text>

  <!-- Card 9: Respuesta HTTP -->
  <g transform="translate(685, 420)">
    <rect x="0" y="0" width="230" height="120" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="230" height="30" rx="10" fill="#f1f5f9"/>
    <rect x="0" y="20" width="230" height="10" fill="#f1f5f9"/>
    <circle cx="20" cy="15" r="10" fill="#475569"/>
    <text x="20" y="19" class="badge" text-anchor="middle">9</text>
    <text x="40" y="20" class="card-title" fill="#1e293b">Respuesta HTTP</text>
    <text x="20" y="50" class="card-sub" fill="#475569">Retorno al Cliente</text>
    <text x="20" y="73" class="card-desc">Status Code (200, 201, 400...)</text>
    <text x="20" y="91" class="card-desc">Entrega del Payload JSON al Cliente</text>
  </g>
</svg>
