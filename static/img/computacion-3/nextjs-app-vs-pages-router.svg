<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" style="max-width: 960px;" role="img" aria-label="Comparación de estructura de carpetas entre Pages Router y App Router">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .sub   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
      .note  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .file  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; fill: #1e293b; }
      .dir   { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .chip  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; }
      .lead  { stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 2 4; }
    </style>
    <filter id="avp-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <symbol id="avp-folder" viewBox="0 0 18 13">
      <path d="M0,2 a2,2 0 0 1 2,-2 h5 l2,2 h7 a2,2 0 0 1 2,2 v7 a2,2 0 0 1 -2,2 h-14 a2,2 0 0 1 -2,-2 z" fill="#f59e0b"/>
    </symbol>
    <symbol id="avp-file" viewBox="0 0 13 15">
      <path d="M0.75,0.75 h7.5 l4,4 v9.5 h-11.5 z" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
      <path d="M8.25,0.75 v4 h4" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </symbol>
  </defs>

  <rect x="10" y="10" width="940" height="460" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="42" class="title" text-anchor="middle">Pages Router vs App Router: de archivos a URLs</text>
  <text x="480" y="62" class="sub" text-anchor="middle">Ambos usan el sistema de archivos como router, pero con convenciones distintas</text>

  <!-- ============ LEFT: PAGES ROUTER ============ -->
  <rect x="30" y="84" width="440" height="366" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#avp-shadow)"/>
  <rect x="48" y="100" width="128" height="24" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="58" y="116" class="label" fill="#9a3412">PAGES ROUTER</text>
  <text x="452" y="116" class="chip" fill="#94a3b8" text-anchor="end">pages/ · desde 2016</text>

  <!-- rows: y = 150 + i*28 -->
  <use href="#avp-folder" x="54" y="141" width="18" height="13"/>
  <text x="78" y="152" class="dir">pages/</text>

  <use href="#avp-file" x="78" y="168" width="13" height="15"/>
  <text x="98" y="180" class="file">_app.tsx</text>
  <line x1="230" y1="176" x2="326" y2="176" class="lead"/>
  <rect x="332" y="166" width="120" height="20" rx="6" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="392" y="180" class="chip" fill="#7e22ce" text-anchor="middle">envuelve todo</text>

  <use href="#avp-file" x="78" y="196" width="13" height="15"/>
  <text x="98" y="208" class="file">index.tsx</text>
  <line x1="230" y1="204" x2="326" y2="204" class="lead"/>
  <rect x="332" y="194" width="120" height="20" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="392" y="208" class="chip" fill="#1d4ed8" text-anchor="middle">/</text>

  <use href="#avp-file" x="78" y="224" width="13" height="15"/>
  <text x="98" y="236" class="file">about.tsx</text>
  <line x1="230" y1="232" x2="326" y2="232" class="lead"/>
  <rect x="332" y="222" width="120" height="20" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="392" y="236" class="chip" fill="#1d4ed8" text-anchor="middle">/about</text>

  <use href="#avp-folder" x="76" y="253" width="18" height="13"/>
  <text x="100" y="264" class="dir">blog/</text>

  <use href="#avp-file" x="100" y="280" width="13" height="15"/>
  <text x="120" y="292" class="file">index.tsx</text>
  <line x1="230" y1="288" x2="326" y2="288" class="lead"/>
  <rect x="332" y="278" width="120" height="20" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="392" y="292" class="chip" fill="#1d4ed8" text-anchor="middle">/blog</text>

  <use href="#avp-file" x="100" y="308" width="13" height="15"/>
  <text x="120" y="320" class="file">[slug].tsx</text>
  <line x1="230" y1="316" x2="326" y2="316" class="lead"/>
  <rect x="332" y="306" width="120" height="20" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="392" y="320" class="chip" fill="#1d4ed8" text-anchor="middle">/blog/:slug</text>

  <rect x="48" y="390" width="404" height="44" rx="8" fill="#fff7ed"/>
  <text x="250" y="409" class="note" fill="#9a3412" text-anchor="middle">Regla: cada archivo es una ruta</text>
  <text x="250" y="425" class="chip" fill="#c2410c" text-anchor="middle">getServerSideProps · getStaticProps</text>

  <!-- ============ RIGHT: APP ROUTER ============ -->
  <rect x="490" y="84" width="440" height="366" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" filter="url(#avp-shadow)"/>
  <rect x="508" y="100" width="112" height="24" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="518" y="116" class="label" fill="#15803d">APP ROUTER</text>
  <text x="912" y="116" class="chip" fill="#16a34a" text-anchor="end">app/ · recomendado</text>

  <use href="#avp-folder" x="514" y="141" width="18" height="13"/>
  <text x="538" y="152" class="dir">app/</text>

  <use href="#avp-file" x="538" y="168" width="13" height="15"/>
  <text x="558" y="180" class="file">layout.tsx</text>
  <line x1="690" y1="176" x2="786" y2="176" class="lead"/>
  <rect x="792" y="166" width="120" height="20" rx="6" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="852" y="180" class="chip" fill="#7e22ce" text-anchor="middle">UI raíz</text>

  <use href="#avp-file" x="538" y="196" width="13" height="15"/>
  <text x="558" y="208" class="file">page.tsx</text>
  <line x1="690" y1="204" x2="786" y2="204" class="lead"/>
  <rect x="792" y="194" width="120" height="20" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="852" y="208" class="chip" fill="#1d4ed8" text-anchor="middle">/</text>

  <use href="#avp-folder" x="536" y="225" width="18" height="13"/>
  <text x="560" y="236" class="dir">about/</text>

  <use href="#avp-file" x="560" y="252" width="13" height="15"/>
  <text x="580" y="264" class="file">page.tsx</text>
  <line x1="690" y1="260" x2="786" y2="260" class="lead"/>
  <rect x="792" y="250" width="120" height="20" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="852" y="264" class="chip" fill="#1d4ed8" text-anchor="middle">/about</text>

  <use href="#avp-folder" x="536" y="281" width="18" height="13"/>
  <text x="560" y="292" class="dir">blog/</text>

  <use href="#avp-file" x="560" y="308" width="13" height="15"/>
  <text x="580" y="320" class="file">layout.tsx</text>
  <line x1="690" y1="316" x2="786" y2="316" class="lead"/>
  <rect x="792" y="306" width="120" height="20" rx="6" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="852" y="320" class="chip" fill="#7e22ce" text-anchor="middle">UI de /blog</text>

  <use href="#avp-file" x="560" y="336" width="13" height="15"/>
  <text x="580" y="348" class="file">page.tsx</text>
  <line x1="690" y1="344" x2="786" y2="344" class="lead"/>
  <rect x="792" y="334" width="120" height="20" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="852" y="348" class="chip" fill="#1d4ed8" text-anchor="middle">/blog</text>

  <use href="#avp-folder" x="558" y="365" width="18" height="13"/>
  <text x="582" y="376" class="dir">[slug]/</text>

  <use href="#avp-file" x="582" y="392" width="13" height="15"/>
  <text x="602" y="404" class="file">page.tsx</text>
  <line x1="690" y1="400" x2="786" y2="400" class="lead"/>
  <rect x="792" y="390" width="120" height="20" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="852" y="404" class="chip" fill="#1d4ed8" text-anchor="middle">/blog/:slug</text>

  <rect x="508" y="418" width="404" height="24" rx="8" fill="#f0fdf4"/>
  <text x="710" y="434" class="note" fill="#166534" text-anchor="middle">Regla: cada carpeta es un segmento; page.tsx la hace pública</text>
</svg>
