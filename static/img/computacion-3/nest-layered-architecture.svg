<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .level-tag { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 14px; fill: #1e293b; letter-spacing: 0.5px; }
    .box-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; }
    .box-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11.5px; }
    .box-desc { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 11px; fill: #475569; }
    .conn-label { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11px; }
    .ret-label { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 10px; fill: #64748b; }
  </style>

  <rect x="15" y="15" width="870" height="175" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="15" y="15" width="870" height="38" rx="14" fill="#f1f5f9"/>
  <rect x="15" y="38" width="870" height="15" fill="#f1f5f9"/>
  <text x="35" y="39" class="level-tag">Nivel 1: Visión General del Sistema</text>

  <g transform="translate(45, 65)">
    <rect x="0" y="0" width="210" height="105" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="210" height="30" rx="10" fill="#dbeafe"/>
    <rect x="0" y="20" width="210" height="10" fill="#dbeafe"/>
    <text x="105" y="21" class="box-title" fill="#1e3a8a" text-anchor="middle">Frontend / Cliente</text>
    <text x="105" y="50" class="box-sub" fill="#2563eb" text-anchor="middle">Navegador Web / App Móvil</text>
    <text x="105" y="72" class="box-desc" text-anchor="middle">Interfaz de Usuario</text>
    <text x="105" y="88" class="box-desc" text-anchor="middle">Envía peticiones de red</text>
  </g>

  <path d="M 265 105 L 345 105" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="305" y="96" class="conn-label" fill="#1e3a8a" text-anchor="middle">HTTP / JSON</text>
  <path d="M 345 125 L 265 125" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-slate)"/>
  <text x="305" y="140" class="ret-label" text-anchor="middle">Respuesta</text>

  <g transform="translate(355, 65)">
    <rect x="0" y="0" width="210" height="105" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="210" height="30" rx="10" fill="#dcfce7"/>
    <rect x="0" y="20" width="210" height="10" fill="#dcfce7"/>
    <text x="105" y="21" class="box-title" fill="#14532d" text-anchor="middle">Backend (Servidor NestJS)</text>
    <text x="105" y="50" class="box-sub" fill="#16a34a" text-anchor="middle">API REST / Node.js</text>
    <text x="105" y="72" class="box-desc" text-anchor="middle">Endpoints y Lógica de Negocio</text>
    <text x="105" y="88" class="box-desc" text-anchor="middle">Orquestación de Procesos</text>
  </g>

  <path d="M 575 105 L 655 105" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="615" y="96" class="conn-label" fill="#14532d" text-anchor="middle">TCP / SQL</text>
  <path d="M 655 125 L 575 125" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-slate)"/>
  <text x="615" y="140" class="ret-label" text-anchor="middle">Datos</text>

  <g transform="translate(665, 65)">
    <rect x="0" y="0" width="195" height="105" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="195" height="30" rx="10" fill="#fee2e2"/>
    <rect x="0" y="20" width="195" height="10" fill="#fee2e2"/>
    <text x="97" y="21" class="box-title" fill="#7f1d1d" text-anchor="middle">Base de Datos</text>
    <text x="97" y="50" class="box-sub" fill="#dc2626" text-anchor="middle">PostgreSQL</text>
    <text x="97" y="72" class="box-desc" text-anchor="middle">Persistencia Relacional</text>
    <text x="97" y="88" class="box-desc" text-anchor="middle">Tablas y Restricciones</text>
  </g>

  <rect x="15" y="205" width="870" height="430" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="15" y="205" width="870" height="38" rx="14" fill="#f8fafc"/>
  <rect x="15" y="230" width="870" height="15" fill="#f8fafc"/>
  <text x="35" y="230" class="level-tag">Nivel 2: Arquitectura Interna de NestJS</text>

  <g transform="translate(45, 260)">
    <rect x="0" y="0" width="210" height="140" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="210" height="30" rx="10" fill="#f1f5f9"/>
    <rect x="0" y="20" width="210" height="10" fill="#f1f5f9"/>
    <text x="105" y="21" class="box-title" fill="#0f172a" text-anchor="middle">Cliente</text>
    <text x="105" y="50" class="box-sub" fill="#475569" text-anchor="middle">Navegador / Postman</text>
    <line x1="15" y1="62" x2="195" y2="62" stroke="#cbd5e1" stroke-width="1"/>
    <text x="105" y="82" class="box-desc" text-anchor="middle">Envía la petición HTTP</text>
    <text x="105" y="100" class="box-desc" font-weight="700" fill="#2563eb" text-anchor="middle">GET /books/42</text>
    <text x="105" y="122" class="ret-label" text-anchor="middle">Recibe respuesta JSON</text>
  </g>

  <path d="M 265 315 L 340 315" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="302" y="305" class="conn-label" fill="#1e3a8a" text-anchor="middle">1. Request</text>
  <path d="M 340 345 L 265 345" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-slate)"/>
  <text x="302" y="360" class="ret-label" text-anchor="middle">JSON (200 OK)</text>

  <g transform="translate(350, 260)">
    <rect x="0" y="0" width="215" height="140" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="215" height="30" rx="10" fill="#dbeafe"/>
    <rect x="0" y="20" width="215" height="10" fill="#dbeafe"/>
    <text x="107" y="21" class="box-title" fill="#1e3a8a" text-anchor="middle">Controlador</text>
    <text x="107" y="50" class="box-sub" fill="#2563eb" text-anchor="middle">@Controller('books')</text>
    <line x1="15" y1="62" x2="200" y2="62" stroke="#bfdbfe" stroke-width="1"/>
    <text x="107" y="80" class="box-desc" text-anchor="middle">Punto de entrada HTTP</text>
    <text x="107" y="98" class="box-desc" text-anchor="middle">Valida parámetros y DTOs</text>
    <text x="107" y="116" class="box-desc" text-anchor="middle">Delega sin lógica pesada</text>
  </g>

  <path d="M 575 315 L 650 315" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <text x="612" y="305" class="conn-label" fill="#14532d" text-anchor="middle">2. Delega</text>
  <path d="M 650 345 L 575 345" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-slate)"/>
  <text x="612" y="360" class="ret-label" text-anchor="middle">Resultado</text>

  <g transform="translate(660, 260)">
    <rect x="0" y="0" width="205" height="140" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="205" height="30" rx="10" fill="#dcfce7"/>
    <rect x="0" y="20" width="205" height="10" fill="#dcfce7"/>
    <text x="102" y="21" class="box-title" fill="#14532d" text-anchor="middle">Servicio (Provider)</text>
    <text x="102" y="50" class="box-sub" fill="#15803d" text-anchor="middle">@Injectable()</text>
    <line x1="15" y1="62" x2="190" y2="62" stroke="#bbf7d0" stroke-width="1"/>
    <text x="102" y="80" class="box-desc" text-anchor="middle">Lógica de negocio</text>
    <text x="102" y="98" class="box-desc" text-anchor="middle">Reglas de validación</text>
    <text x="102" y="116" class="box-desc" text-anchor="middle">Coordina los datos</text>
  </g>

  <path d="M 735 410 L 735 460" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <text x="695" y="438" class="conn-label" fill="#78350f" text-anchor="middle">3. CRUD</text>

  <path d="M 785 460 L 785 410" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-slate)"/>
  <text x="825" y="438" class="ret-label" text-anchor="middle">Entidad</text>

  <g transform="translate(660, 470)">
    <rect x="0" y="0" width="205" height="140" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="205" height="30" rx="10" fill="#fef08a"/>
    <rect x="0" y="20" width="205" height="10" fill="#fef08a"/>
    <text x="102" y="21" class="box-title" fill="#713f12" text-anchor="middle">Repositorio</text>
    <text x="102" y="50" class="box-sub" fill="#a16207" text-anchor="middle">Repository&lt;Book&gt;</text>
    <line x1="15" y1="62" x2="190" y2="62" stroke="#fde047" stroke-width="1"/>
    <text x="102" y="80" class="box-desc" text-anchor="middle">Abstracción ORM (TypeORM)</text>
    <text x="102" y="98" class="box-desc" text-anchor="middle">Métodos find(), save()...</text>
    <text x="102" y="116" class="box-desc" text-anchor="middle">Mapea tablas a clases</text>
  </g>

  <path d="M 650 525 L 575 525" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <text x="612" y="515" class="conn-label" fill="#7f1d1d" text-anchor="middle">4. SQL</text>
  <path d="M 575 555 L 650 555" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-slate)"/>
  <text x="612" y="570" class="ret-label" text-anchor="middle">Filas / Registros</text>

  <g transform="translate(350, 470)">
    <rect x="0" y="0" width="215" height="140" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="215" height="30" rx="10" fill="#fee2e2"/>
    <rect x="0" y="20" width="215" height="10" fill="#fee2e2"/>
    <text x="107" y="21" class="box-title" fill="#7f1d1d" text-anchor="middle">Base de Datos</text>
    <text x="107" y="50" class="box-sub" fill="#dc2626" text-anchor="middle">PostgreSQL</text>
    <line x1="15" y1="62" x2="200" y2="62" stroke="#fecaca" stroke-width="1"/>
    <text x="107" y="80" class="box-desc" text-anchor="middle">Ejecuta: SELECT * FROM books</text>
    <text x="107" y="98" class="box-desc" text-anchor="middle">Persistencia relacional</text>
    <text x="107" y="116" class="box-desc" font-weight="600" fill="#15803d" text-anchor="middle">Retorna registros</text>
  </g>
</svg>
