<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <marker id="a-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#475569"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#7c3aed"/></marker>
  </defs>
  <style>
    .t { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .head { font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .lbl { font-size: 12px; font-weight: 600; fill: #334155; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; }
  </style>
  <rect width="880" height="440" rx="16" fill="#f8fafc"/>
  <text x="32" y="38" class="t title">Todo mezclado vs. separado por capas</text>

  <!-- ANTES -->
  <text x="230" y="84" class="t head" fill="#dc2626" text-anchor="middle">ANTES</text>

  <!-- tangled wires -->
  <g fill="none" stroke="#f87171" stroke-width="2" opacity="0.75">
    <path d="M110,150 C200,330 300,100 330,370"/>
    <path d="M350,150 C250,120 150,380 100,340"/>
    <path d="M390,270 C300,420 160,60 110,150"/>
    <path d="M100,340 C200,200 340,420 390,270"/>
    <path d="M110,150 Q230,250 350,150"/>
    <path d="M330,370 Q220,280 100,340"/>
  </g>
  <g fill="none" stroke="#ef4444" stroke-width="2.5">
    <path d="M110,150 Q150,200 190,225"/>
    <path d="M350,150 Q310,190 270,222"/>
    <path d="M390,270 Q330,265 276,250"/>
    <path d="M330,370 Q290,320 262,285"/>
    <path d="M100,340 Q150,300 195,268"/>
  </g>

  <!-- center -->
  <circle cx="230" cy="250" r="46" fill="#0f172a"/>
  <text x="230" y="255" class="t mono" fill="#f8fafc" text-anchor="middle" font-size="13">page.tsx</text>

  <!-- cloud: fetch -->
  <g transform="translate(110,150)">
    <circle cx="-14" cy="4" r="13" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <circle cx="2" cy="-6" r="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <circle cx="18" cy="4" r="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <rect x="-14" y="2" width="32" height="15" fill="#fee2e2"/>
    <text x="2" y="38" class="t lbl" text-anchor="middle">fetch</text>
  </g>
  <!-- JSON -->
  <g transform="translate(350,150)">
    <circle r="24" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text y="5" class="t mono" fill="#b91c1c" text-anchor="middle" font-size="15">{ }</text>
    <text y="42" class="t lbl" text-anchor="middle">JSON</text>
  </g>
  <!-- rules hexagon -->
  <g transform="translate(390,270)">
    <polygon points="-22,0 -11,-20 11,-20 22,0 11,20 -11,20" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text y="42" class="t lbl" text-anchor="middle">reglas</text>
  </g>
  <!-- JSX window -->
  <g transform="translate(330,370)">
    <rect x="-24" y="-18" width="48" height="36" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <line x1="-24" y1="-8" x2="24" y2="-8" stroke="#ef4444" stroke-width="2"/>
    <text y="40" class="t lbl" text-anchor="middle">JSX</text>
  </g>
  <!-- state -->
  <g transform="translate(100,340)">
    <polygon points="0,-24 24,0 0,24 -24,0" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text y="42" class="t lbl" text-anchor="middle">estado</text>
  </g>

  <!-- divider -->
  <line x1="440" y1="80" x2="440" y2="410" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="440" cy="245" r="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="440" y="250" class="t lbl" text-anchor="middle" fill="#94a3b8" font-size="11">vs</text>

  <!-- DESPUES -->
  <text x="660" y="84" class="t head" fill="#16a34a" text-anchor="middle">DESPUÉS</text>

  <!-- UI slab -->
  <polygon points="560,120 780,120 760,180 540,180" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="660" y="157" class="t head" fill="#1e3a8a" text-anchor="middle" font-size="14">UI</text>
  <!-- Domain slab -->
  <polygon points="560,230 780,230 760,290 540,290" fill="#ede9fe" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round"/>
  <text x="650" y="267" class="t head" fill="#581c87" text-anchor="middle" font-size="14">DOMINIO</text>
  <!-- Data slab -->
  <polygon points="560,340 780,340 760,400 540,400" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="650" y="377" class="t head" fill="#14532d" text-anchor="middle" font-size="14">DATOS</text>

  <!-- arrows to domain -->
  <path d="M655,184 L655,224" stroke="#7c3aed" stroke-width="3" marker-end="url(#a-purple)"/>
  <path d="M650,336 L650,296" stroke="#7c3aed" stroke-width="3" marker-end="url(#a-purple)"/>
</svg>
