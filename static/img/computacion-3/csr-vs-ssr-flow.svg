<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" style="max-width: 960px;" role="img" aria-label="Comparación entre Client-Side Rendering y Server-Side Rendering">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .sub   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .06em; fill: #475569; }
      .cap   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .step  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
      .url   { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8px; fill: #64748b; }
    </style>
    <filter id="csr-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="csr-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#64748b"/>
    </marker>
    <marker id="csr-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="940" height="540" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="42" class="title" text-anchor="middle">CSR vs SSR: ¿dónde se construye el HTML?</text>
  <text x="480" y="62" class="sub" text-anchor="middle">Mismo resultado final, pero el usuario ve el contenido en momentos muy distintos</text>

  <!-- ===================== CSR LANE ===================== -->
  <rect x="30" y="80" width="900" height="215" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="48" y="94" width="230" height="24" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="58" y="110" class="label" fill="#1d4ed8">CSR · CLIENT-SIDE RENDERING</text>
  <text x="912" y="110" class="mono" fill="#64748b" text-anchor="end">React + Vite (SPA)</text>

  <!-- Server / CDN -->
  <g transform="translate(50,140)" filter="url(#csr-shadow)">
    <rect width="120" height="90" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="8" y="10" width="104" height="30" rx="5" fill="#1e293b" stroke="#334155"/>
    <circle cx="18" cy="25" r="3" fill="#10b981"/>
    <text x="27" y="29" class="mono" fill="#e2e8f0">index.html</text>
    <rect x="8" y="50" width="104" height="30" rx="5" fill="#1e293b" stroke="#334155"/>
    <circle cx="18" cy="65" r="3" fill="#f59e0b"/>
    <text x="27" y="69" class="mono" fill="#38bdf8">bundle.js</text>
  </g>
  <text x="110" y="258" class="cap" text-anchor="middle">Servidor / CDN</text>

  <path d="M174,185 L214,185" class="a" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#csr-arrow-gray)"/>
  <text x="194" y="176" class="step" fill="#475569" text-anchor="middle">1</text>

  <!-- Browser A: blank -->
  <g transform="translate(220,130)" filter="url(#csr-shadow)">
    <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M0,8 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v12 h-190 z" fill="#f1f5f9"/>
    <circle cx="10" cy="10" r="2.5" fill="#ef4444"/><circle cx="18" cy="10" r="2.5" fill="#f59e0b"/><circle cx="26" cy="10" r="2.5" fill="#10b981"/>
    <rect x="36" y="4" width="146" height="12" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="44" y="13" class="url">localhost:5173</text>
    <text x="95" y="62" class="mono" fill="#94a3b8" text-anchor="middle">&lt;div id="root"&gt;</text>
    <text x="95" y="78" class="mono" fill="#94a3b8" text-anchor="middle">&lt;/div&gt;</text>
  </g>
  <text x="315" y="258" class="cap" text-anchor="middle">HTML vacío: pantalla en blanco</text>

  <path d="M414,185 L449,185" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#csr-arrow-gray)"/>
  <text x="432" y="176" class="step" fill="#475569" text-anchor="middle">2</text>

  <!-- Browser B: loading -->
  <g transform="translate(455,130)" filter="url(#csr-shadow)">
    <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M0,8 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v12 h-190 z" fill="#f1f5f9"/>
    <circle cx="10" cy="10" r="2.5" fill="#ef4444"/><circle cx="18" cy="10" r="2.5" fill="#f59e0b"/><circle cx="26" cy="10" r="2.5" fill="#10b981"/>
    <rect x="36" y="4" width="146" height="12" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="44" y="13" class="url">localhost:5173</text>
    <circle cx="95" cy="58" r="14" fill="none" stroke="#e2e8f0" stroke-width="4"/>
    <path d="M95,44 a14,14 0 0 1 14,14" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="95" y="94" class="mono" fill="#64748b" text-anchor="middle">Cargando...</text>
  </g>
  <text x="550" y="258" class="cap" text-anchor="middle">Descarga JS + fetch de datos</text>

  <path d="M649,185 L684,185" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#csr-arrow-gray)"/>
  <text x="667" y="176" class="step" fill="#475569" text-anchor="middle">3</text>

  <!-- Browser C: content -->
  <g transform="translate(690,130)" filter="url(#csr-shadow)">
    <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M0,8 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v12 h-190 z" fill="#f1f5f9"/>
    <circle cx="10" cy="10" r="2.5" fill="#ef4444"/><circle cx="18" cy="10" r="2.5" fill="#f59e0b"/><circle cx="26" cy="10" r="2.5" fill="#10b981"/>
    <rect x="36" y="4" width="146" height="12" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="44" y="13" class="url">localhost:5173</text>
    <rect x="12" y="28" width="166" height="12" rx="3" fill="#1e293b"/>
    <rect x="12" y="48" width="110" height="8" rx="2" fill="#475569"/>
    <rect x="12" y="62" width="150" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="74" width="130" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="88" width="54" height="14" rx="4" fill="#2563eb"/>
  </g>
  <text x="785" y="258" class="cap" text-anchor="middle">Contenido + interactividad</text>

  <!-- CSR timeline -->
  <rect x="220" y="270" width="420" height="8" rx="4" fill="#fecaca"/>
  <rect x="690" y="270" width="190" height="8" rx="4" fill="#86efac"/>
  <text x="430" y="290" class="mono" fill="#b91c1c" text-anchor="middle">el usuario espera sin contenido útil</text>
  <text x="785" y="290" class="mono" fill="#15803d" text-anchor="middle">primer contenido visible</text>

  <!-- ===================== SSR LANE ===================== -->
  <rect x="30" y="315" width="900" height="215" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="48" y="329" width="232" height="24" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="58" y="345" class="label" fill="#15803d">SSR · SERVER-SIDE RENDERING</text>
  <text x="912" y="345" class="mono" fill="#64748b" text-anchor="end">Next.js</text>

  <!-- Next server -->
  <g transform="translate(50,375)" filter="url(#csr-shadow)">
    <rect width="120" height="90" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="8" y="10" width="104" height="30" rx="5" fill="#1e293b" stroke="#334155"/>
    <circle cx="18" cy="25" r="3" fill="#a855f7"/>
    <text x="27" y="29" class="mono" fill="#c084fc">fetch(datos)</text>
    <rect x="8" y="50" width="104" height="30" rx="5" fill="#1e293b" stroke="#334155"/>
    <circle cx="18" cy="65" r="3" fill="#10b981"/>
    <text x="27" y="69" class="mono" fill="#4ade80">React → HTML</text>
  </g>
  <text x="110" y="493" class="cap" text-anchor="middle">Servidor Next.js</text>

  <path d="M174,420 L214,420" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#csr-arrow-green)"/>
  <text x="194" y="411" class="step" fill="#15803d" text-anchor="middle">1</text>

  <!-- Browser A': visible content -->
  <g transform="translate(220,365)" filter="url(#csr-shadow)">
    <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M0,8 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v12 h-190 z" fill="#f1f5f9"/>
    <circle cx="10" cy="10" r="2.5" fill="#ef4444"/><circle cx="18" cy="10" r="2.5" fill="#f59e0b"/><circle cx="26" cy="10" r="2.5" fill="#10b981"/>
    <rect x="36" y="4" width="146" height="12" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="44" y="13" class="url">localhost:3000</text>
    <rect x="12" y="28" width="166" height="12" rx="3" fill="#1e293b"/>
    <rect x="12" y="48" width="110" height="8" rx="2" fill="#475569"/>
    <rect x="12" y="62" width="150" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="74" width="130" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="88" width="54" height="14" rx="4" fill="#93c5fd"/>
  </g>
  <text x="315" y="493" class="cap" text-anchor="middle">HTML completo: contenido visible</text>

  <path d="M414,420 L449,420" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#csr-arrow-green)"/>
  <text x="432" y="411" class="step" fill="#15803d" text-anchor="middle">2</text>

  <!-- Browser B': hydration -->
  <g transform="translate(455,365)" filter="url(#csr-shadow)">
    <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/>
    <path d="M1,8 a7,7 0 0 1 7,-7 h174 a7,7 0 0 1 7,7 v12 h-188 z" fill="#eff6ff"/>
    <circle cx="10" cy="10" r="2.5" fill="#ef4444"/><circle cx="18" cy="10" r="2.5" fill="#f59e0b"/><circle cx="26" cy="10" r="2.5" fill="#10b981"/>
    <rect x="36" y="4" width="146" height="12" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="44" y="13" class="url">localhost:3000</text>
    <rect x="12" y="28" width="166" height="12" rx="3" fill="#1e293b"/>
    <rect x="12" y="48" width="110" height="8" rx="2" fill="#475569"/>
    <rect x="12" y="62" width="150" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="74" width="130" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="88" width="54" height="14" rx="4" fill="#60a5fa"/>
    <rect x="96" y="86" width="82" height="18" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="137" y="98" class="mono" fill="#1d4ed8" text-anchor="middle">+ JS mínimo</text>
  </g>
  <text x="550" y="493" class="cap" text-anchor="middle">Hydration: React conecta eventos</text>

  <path d="M649,420 L684,420" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#csr-arrow-green)"/>
  <text x="667" y="411" class="step" fill="#15803d" text-anchor="middle">3</text>

  <!-- Browser C': interactive -->
  <g transform="translate(690,365)" filter="url(#csr-shadow)">
    <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M0,8 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v12 h-190 z" fill="#f1f5f9"/>
    <circle cx="10" cy="10" r="2.5" fill="#ef4444"/><circle cx="18" cy="10" r="2.5" fill="#f59e0b"/><circle cx="26" cy="10" r="2.5" fill="#10b981"/>
    <rect x="36" y="4" width="146" height="12" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="44" y="13" class="url">localhost:3000</text>
    <rect x="12" y="28" width="166" height="12" rx="3" fill="#1e293b"/>
    <rect x="12" y="48" width="110" height="8" rx="2" fill="#475569"/>
    <rect x="12" y="62" width="150" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="74" width="130" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="88" width="54" height="14" rx="4" fill="#2563eb"/>
    <path d="M52,96 L52,110 L56,106 L59,112 L61,111 L58,105 L63,105 Z" fill="#0f172a" stroke="#ffffff" stroke-width="0.8"/>
  </g>
  <text x="785" y="493" class="cap" text-anchor="middle">Totalmente interactivo</text>

  <!-- SSR timeline -->
  <rect x="220" y="505" width="660" height="8" rx="4" fill="#86efac"/>
  <text x="550" y="525" class="mono" fill="#15803d" text-anchor="middle">el contenido es visible desde la primera respuesta (mejor SEO y percepción de velocidad)</text>
</svg>
