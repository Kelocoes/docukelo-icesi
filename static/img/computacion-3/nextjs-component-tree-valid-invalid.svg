<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="410" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header Title -->
  <text x="460" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Árbol de Componentes: Reglas de Invocación</text>
  <text x="460" y="49" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#64748b">Cómo combinar Server Components y Client Components de forma válida</text>

  <!-- ==================== COLUMN 1: VÁLIDO ==================== -->
  <g transform="translate(24, 68)" filter="url(#card-shadow)">
    <rect width="272" height="322" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Status Badge -->
    <rect x="14" y="12" width="244" height="28" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
    <text x="136" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="800" fill="#15803d">1. SERVER LLAMA CLIENT  [VÁLIDO]</text>

    <!-- Server Box -->
    <rect x="20" y="52" width="232" height="60" rx="8" fill="#eef2ff" stroke="#5454E9" stroke-width="1.8"/>
    <circle cx="42" cy="74" r="10" fill="#5454E9"/>
    <text x="42" y="78" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="800" fill="#ffffff">S</text>
    <text x="60" y="72" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="800" fill="#1e1e2e">Server Component</text>
    <text x="60" y="90" font-family="Consolas, monospace" font-size="11" fill="#5454E9">app/page.tsx</text>

    <!-- Connector Arrow -->
    <line x1="136" y1="112" x2="136" y2="150" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <rect x="85" y="122" width="102" height="18" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="136" y="135" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="700" fill="#15803d">Renderiza directo</text>

    <!-- Client Box -->
    <rect x="20" y="152" width="232" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="42" cy="174" r="10" fill="#10b981"/>
    <text x="42" y="178" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="800" fill="#ffffff">C</text>
    <text x="60" y="172" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="800" fill="#065f46">Client Component</text>
    <text x="60" y="190" font-family="Consolas, monospace" font-size="11" fill="#047857">'use client' (Botón)</text>

    <!-- Bottom Result Card -->
    <rect x="18" y="226" width="236" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="28" y="236" width="80" height="18" rx="4" fill="#dcfce7"/>
    <text x="68" y="249" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="800" fill="#15803d">FLUJO IDEAL</text>
    <text x="28" y="272" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#334155">El servidor entrega HTML listo.</text>
    <text x="28" y="290" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" fill="#64748b">Solo el botón descarga script JS.</text>
  </g>

  <!-- ==================== COLUMN 2: INVÁLIDO ==================== -->
  <g transform="translate(324, 68)" filter="url(#card-shadow)">
    <rect width="272" height="322" rx="10" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
    <!-- Status Badge -->
    <rect x="14" y="12" width="244" height="28" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="136" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="800" fill="#dc2626">2. CLIENT IMPORTA SERVER [INVÁLIDO]</text>

    <!-- Client Box -->
    <rect x="20" y="52" width="232" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="42" cy="74" r="10" fill="#10b981"/>
    <text x="42" y="78" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="800" fill="#ffffff">C</text>
    <text x="60" y="72" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="800" fill="#065f46">Client Component</text>
    <text x="60" y="90" font-family="Consolas, monospace" font-size="11" fill="#047857">'use client' (Frontera)</text>

    <!-- Connector Arrow Error -->
    <line x1="136" y1="112" x2="136" y2="150" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
    <rect x="80" y="122" width="112" height="18" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <text x="136" y="135" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="800" fill="#dc2626">import prohibido</text>

    <!-- Contaminated Box -->
    <rect x="20" y="152" width="232" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="42" cy="174" r="10" fill="#ef4444"/>
    <text x="42" y="178" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="800" fill="#ffffff">!</text>
    <text x="60" y="172" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#991b1b">Componente Contagiado</text>
    <text x="60" y="190" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">Se vuelve Client: Falla BD</text>

    <!-- Bottom Result Card -->
    <rect x="18" y="226" width="236" height="82" rx="8" fill="#ffffff" stroke="#fecaca"/>
    <rect x="28" y="236" width="90" height="18" rx="4" fill="#fee2e2"/>
    <text x="73" y="249" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="800" fill="#dc2626">CONTAGIO</text>
    <text x="28" y="272" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#991b1b">'use client' infecta todo lo que</text>
    <text x="28" y="290" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" fill="#7f1d1d">importa hacia abajo recursivamente.</text>
  </g>

  <!-- ==================== COLUMN 3: PATRÓN DE RANURA ==================== -->
  <g transform="translate(624, 68)" filter="url(#card-shadow)">
    <rect width="272" height="322" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Status Badge -->
    <rect x="14" y="12" width="244" height="28" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
    <text x="136" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="800" fill="#15803d">3. SERVER VÍA CHILDREN  [VÁLIDO]</text>

    <!-- Server Parent Orchestrator -->
    <rect x="20" y="52" width="232" height="38" rx="6" fill="#eef2ff" stroke="#5454E9" stroke-width="1.5"/>
    <text x="136" y="75" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#4338ca">Server Padre (Ensamblador)</text>

    <!-- Client Component Outer Container with Slot -->
    <rect x="20" y="98" width="232" height="114" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <text x="32" y="116" font-family="Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="800" fill="#065f46">Client Component (Modal)</text>

    <!-- The Slot Box -->
    <rect x="30" y="124" width="212" height="76" rx="6" fill="#ffffff" stroke="#5454E9" stroke-width="1.8" stroke-dasharray="4 3"/>
    <rect x="40" y="132" width="110" height="16" rx="4" fill="#eef2ff"/>
    <text x="95" y="144" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" font-weight="700" fill="#5454E9">Ranura {children}</text>
    <text x="40" y="166" font-family="Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="800" fill="#4338ca">Server Component</text>
    <text x="40" y="184" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#16a34a">Se ejecuta en Node (0 KB)</text>

    <!-- Bottom Result Card -->
    <rect x="18" y="226" width="236" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="28" y="236" width="115" height="18" rx="4" fill="#dcfce7"/>
    <text x="85" y="249" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="800" fill="#15803d">PATRÓN DE RANURA</text>
    <text x="28" y="272" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#334155">El Client aloja la ranura pero</text>
    <text x="28" y="290" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" fill="#64748b">no importa ni contamina al Server.</text>
  </g>
</svg>