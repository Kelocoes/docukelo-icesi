<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" style="max-width: 960px;" role="img" aria-label="Layouts anidados en la práctica: layout raíz, layout de cursos y página dinámica">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .sub   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
      .ui    { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .h1    { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: 800; fill: #0f172a; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .tag   { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #ffffff; }
    </style>
    <filter id="nl-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="nl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="940" height="460" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="42" class="title" text-anchor="middle">Layouts anidados: lo que ve el usuario en /cursos/nextjs</text>
  <text x="480" y="62" class="sub" text-anchor="middle">Cada carpeta puede aportar su propio layout; la página queda en el centro</text>

  <!-- ============ BROWSER ============ -->
  <g filter="url(#nl-shadow)">
    <rect x="30" y="80" width="610" height="376" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <path d="M30,90 a10,10 0 0 1 10,-10 h590 a10,10 0 0 1 10,10 v18 h-610 z" fill="#f1f5f9"/>
  <circle cx="46" cy="94" r="4" fill="#ef4444"/><circle cx="58" cy="94" r="4" fill="#f59e0b"/><circle cx="70" cy="94" r="4" fill="#10b981"/>
  <rect x="90" y="86" width="400" height="16" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="102" y="98" class="mono" fill="#475569">localhost:3000/cursos/nextjs</text>

  <!-- root layout outline -->
  <rect x="42" y="116" width="586" height="330" rx="10" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="496" y="108" width="124" height="18" rx="9" fill="#a855f7"/>
  <text x="558" y="121" class="tag" text-anchor="middle">app/layout.tsx</text>

  <!-- navbar -->
  <rect x="52" y="130" width="566" height="38" rx="8" fill="#0f172a"/>
  <text x="68" y="154" class="ui" fill="#ffffff" font-weight="800">CompuNet Academy</text>
  <text x="380" y="154" class="ui" fill="#94a3b8">Inicio</text>
  <text x="440" y="154" class="ui" fill="#38bdf8">Cursos</text>
  <rect x="440" y="159" width="44" height="2.5" rx="1" fill="#38bdf8"/>
  <text x="510" y="154" class="ui" fill="#94a3b8">Acerca de</text>

  <!-- cursos layout outline -->
  <rect x="54" y="180" width="562" height="222" rx="10" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="440" y="172" width="168" height="18" rx="9" fill="#0d9488"/>
  <text x="524" y="185" class="tag" text-anchor="middle">app/cursos/layout.tsx</text>

  <!-- sidebar -->
  <rect x="66" y="196" width="150" height="194" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="80" y="218" class="label" fill="#0f766e">CURSOS</text>
  <text x="80" y="246" class="ui" fill="#334155">NestJS</text>
  <text x="80" y="274" class="ui" fill="#334155">React</text>
  <rect x="72" y="286" width="138" height="24" rx="6" fill="#ccfbf1"/>
  <text x="80" y="302" class="ui" fill="#0f766e" font-weight="800">Next.js</text>
  <text x="80" y="332" class="ui" fill="#334155">Docker</text>

  <!-- page -->
  <rect x="228" y="196" width="376" height="194" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="408" y="188" width="188" height="18" rx="9" fill="#2563eb"/>
  <text x="502" y="201" class="tag" text-anchor="middle">app/cursos/[slug]/page.tsx</text>
  <text x="246" y="234" class="h1">Next.js y App Router</text>
  <rect x="246" y="246" width="70" height="18" rx="9" fill="#dbeafe"/>
  <text x="281" y="259" class="mono" fill="#1d4ed8" text-anchor="middle">Semana 9</text>
  <rect x="246" y="278" width="330" height="7" rx="3" fill="#bfdbfe"/>
  <rect x="246" y="293" width="300" height="7" rx="3" fill="#bfdbfe"/>
  <rect x="246" y="308" width="318" height="7" rx="3" fill="#bfdbfe"/>
  <rect x="246" y="323" width="240" height="7" rx="3" fill="#bfdbfe"/>
  <rect x="246" y="348" width="110" height="28" rx="6" fill="#2563eb"/>
  <text x="301" y="366" class="ui" fill="#ffffff" text-anchor="middle">Ver detalle</text>

  <!-- footer -->
  <rect x="52" y="410" width="566" height="28" rx="6" fill="#f1f5f9"/>
  <text x="335" y="428" class="mono" fill="#64748b" text-anchor="middle">© 2026 CompuNet Academy · footer del layout raíz</text>

  <!-- ============ RIGHT PANEL ============ -->
  <rect x="662" y="80" width="268" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#nl-shadow)"/>
  <text x="680" y="106" class="label" fill="#475569">AL NAVEGAR ENTRE CURSOS</text>
  <text x="680" y="132" class="mono" fill="#64748b">/cursos/react</text>
  <path d="M780,128 L806,128" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#nl-arrow)"/>
  <text x="812" y="132" class="mono" fill="#1d4ed8" font-weight="700">/cursos/nextjs</text>

  <rect x="680" y="148" width="14" height="14" rx="3" fill="#a855f7"/>
  <text x="702" y="160" class="ui" fill="#334155">Layout raíz</text>
  <rect x="842" y="146" width="72" height="18" rx="9" fill="#f0fdf4" stroke="#86efac"/>
  <text x="878" y="159" class="mono" fill="#15803d" text-anchor="middle">persiste</text>

  <rect x="680" y="184" width="14" height="14" rx="3" fill="#0d9488"/>
  <text x="702" y="196" class="ui" fill="#334155">Layout de cursos</text>
  <rect x="842" y="182" width="72" height="18" rx="9" fill="#f0fdf4" stroke="#86efac"/>
  <text x="878" y="195" class="mono" fill="#15803d" text-anchor="middle">persiste</text>

  <rect x="680" y="220" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="702" y="232" class="ui" fill="#334155">Página</text>
  <rect x="842" y="218" width="72" height="18" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="878" y="231" class="mono" fill="#1d4ed8" text-anchor="middle">cambia</text>
  <text x="680" y="264" class="mono" fill="#64748b">El estado del layout no se pierde</text>

  <rect x="662" y="296" width="268" height="160" rx="12" fill="#0f172a" filter="url(#nl-shadow)"/>
  <text x="680" y="322" class="mono" fill="#e2e8f0" font-weight="700">app/</text>
  <text x="696" y="342" class="mono" fill="#d8b4fe">layout.tsx</text>
  <text x="696" y="360" class="mono" fill="#94a3b8">page.tsx</text>
  <text x="696" y="378" class="mono" fill="#e2e8f0" font-weight="700">cursos/</text>
  <text x="712" y="396" class="mono" fill="#5eead4">layout.tsx</text>
  <text x="712" y="414" class="mono" fill="#94a3b8">page.tsx</text>
  <text x="712" y="432" class="mono" fill="#e2e8f0" font-weight="700">[slug]/</text>
  <text x="812" y="432" class="mono" fill="#93c5fd">page.tsx</text>
</svg>
