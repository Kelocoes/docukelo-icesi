<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%">
  <defs>
    <filter id="guard-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    .title-main { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; }
    .subtitle-main { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #64748b; }
    .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; }
    .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; }
    .code-pill { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; }
    .flow-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; }
  </style>

  <!-- Background Base Canvas -->
  <rect x="10" y="10" width="920" height="500" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="470" y="42" class="title-main" fill="#0f172a" text-anchor="middle">Flujo de Autorización con PermissionsGuard en NestJS</text>
  <text x="470" y="64" class="subtitle-main" text-anchor="middle">CanActivate, extracción de metadatos con Reflector y verificación granular de permisos</text>

  <!-- 1. Request Node -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="160" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#guard-shadow)"/>
    <circle cx="20" cy="20" r="10" fill="#64748b"/>
    <text x="20" y="24" class="badge" text-anchor="middle">1</text>
    <text x="38" y="24" class="box-title" fill="#1e293b">Petición HTTP</text>
    <rect x="10" y="44" width="140" height="52" rx="6" fill="#f1f5f9"/>
    <text x="18" y="64" class="code-pill" fill="#334155">GET /users</text>
    <text x="18" y="82" class="code-pill" fill="#64748b">Bearer &lt;JWT&gt;</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 190 165 L 235 165" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 2. AuthGuard('jwt') -->
  <g transform="translate(245, 110)">
    <rect x="0" y="0" width="180" height="110" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6" filter="url(#guard-shadow)"/>
    <circle cx="20" cy="20" r="10" fill="#2563eb"/>
    <text x="20" y="24" class="badge" text-anchor="middle">2</text>
    <text x="38" y="24" class="box-title" fill="#1d4ed8">AuthGuard('jwt')</text>
    <text x="12" y="52" class="box-sub" fill="#475569">• Valida firma y exp</text>
    <text x="12" y="72" class="box-sub" fill="#475569">• Inyecta usuario en</text>
    <rect x="12" y="78" width="156" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="20" y="93" class="code-pill" fill="#1d4ed8">req.user = User</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 425 165 L 470 165" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 3. PermissionsGuard + Reflector Container -->
  <g transform="translate(480, 85)">
    <rect x="0" y="0" width="225" height="165" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" filter="url(#guard-shadow)"/>
    <circle cx="20" cy="20" r="10" fill="#d97706"/>
    <text x="20" y="24" class="badge" text-anchor="middle">3</text>
    <text x="38" y="24" class="box-title" fill="#b45309">PermissionsGuard</text>

    <!-- Sub-element: Reflector -->
    <rect x="12" y="42" width="201" height="52" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="20" y="60" class="flow-text" fill="#92400e">Reflector.get('permissions')</text>
    <text x="20" y="78" class="code-pill" fill="#b45309">['read']</text>

    <!-- Sub-element: Condition Check -->
    <rect x="12" y="102" width="201" height="50" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="20" y="120" class="flow-text" fill="#78350f">userPerms.includes(p)?</text>
    <text x="20" y="138" class="code-pill" fill="#92400e">required.every(...)</text>
  </g>

  <!-- Arrow 3 -> Decision branches -->
  <!-- Branch 1: Denied (Down to Red Box) -->
  <path d="M 592 250 L 592 340" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="600" y="295" class="flow-text" fill="#dc2626">No cumple</text>

  <!-- Branch 2: Granted (Right to Green Box) -->
  <path d="M 705 165 L 755 165" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="730" y="155" class="flow-text" fill="#16a34a" text-anchor="middle">Cumple</text>

  <!-- 4. Result Granted: Route Handler -->
  <g transform="translate(765, 110)">
    <rect x="0" y="0" width="145" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#guard-shadow)"/>
    <circle cx="20" cy="20" r="10" fill="#16a34a"/>
    <text x="20" y="24" class="badge" text-anchor="middle">✓</text>
    <text x="38" y="24" class="box-title" fill="#14532d">Acceso OK</text>
    <text x="12" y="52" class="box-sub" fill="#15803d">Ejecuta el Handler:</text>
    <rect x="10" y="60" width="125" height="38" rx="6" fill="#dcfce7"/>
    <text x="16" y="78" class="code-pill" fill="#14532d">findAll()</text>
    <text x="16" y="91" class="code-pill" fill="#166534">200 OK JSON</text>
  </g>

  <!-- 5. Result Denied: ForbiddenException -->
  <g transform="translate(500, 350)">
    <rect x="0" y="0" width="185" height="100" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6" filter="url(#guard-shadow)"/>
    <circle cx="20" cy="20" r="10" fill="#dc2626"/>
    <text x="20" y="24" class="badge" text-anchor="middle">✗</text>
    <text x="38" y="24" class="box-title" fill="#991b1b">Acceso Denegado</text>
    <rect x="10" y="44" width="165" height="42" rx="6" fill="#fee2e2"/>
    <text x="16" y="62" class="code-pill" fill="#991b1b">ForbiddenException</text>
    <text x="16" y="77" class="code-pill" fill="#7f1d1d">HTTP 403 Forbidden</text>
  </g>

  <!-- Bottom Explanatory Summary Bar -->
  <g transform="translate(30, 350)">
    <rect x="0" y="0" width="445" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="18" y="26" class="box-title" fill="#0f172a">Claves del PermissionsGuard</text>
    <text x="18" y="50" class="box-sub" fill="#475569">1. <tspan font-weight="700">Reflector</tspan> extrae metadatos inyectados por el decorador @Permissions()</text>
    <text x="18" y="70" class="box-sub" fill="#475569">2. <tspan font-weight="700">ExecutionContext</tspan> da acceso al contexto HTTP y a req.user</text>
    <text x="18" y="90" class="box-sub" fill="#475569">3. Si required es vacío o undefined, permite el paso automáticamente</text>
  </g>
</svg>
