<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Pila del historial del navegador con router.push y con router.replace">
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.mono{font-family:ui-monospace,Consolas,"JetBrains Mono",monospace;font-size:14px}.small{font-size:12px}.tiny{font-size:11px}.h{font-size:15px;font-weight:700}.title{font-size:20px;font-weight:700}.sub{font-size:13px}.note{font-size:13px;font-weight:600}</style>
<rect width="960" height="560" rx="16" fill="#ffffff"/>
<text x="32" y="42" class="title" fill="#1c1e21">push agrega una entrada al historial; replace cambia la actual</text>
<text x="32" y="66" class="sub" fill="#5a5f66">Cada columna es la pila del historial (abajo la más vieja). El triángulo marca la página en la que estás.</text>
<text x="280" y="112" text-anchor="middle" class="h" fill="#1c1e21">1. Historial inicial</text>
<text x="530" y="112" text-anchor="middle" class="h" fill="#1c1e21">2. Navegas a /dashboard</text>
<text x="780" y="112" text-anchor="middle" class="h" fill="#1c1e21">3. Pulsas "Atrás"</text>
<rect x="20" y="130" width="920" height="195" rx="12" fill="#f6f7fb"/>
<text x="40" y="164" class="mono" font-weight="700" fill="#1c1e21">router.push('/dashboard')</text>
