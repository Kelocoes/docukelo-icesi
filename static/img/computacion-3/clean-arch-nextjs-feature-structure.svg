<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <marker id="pu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#7c3aed"/></marker>
  </defs>
  <style>
    .t { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .fold { font-family: ui-monospace, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .leaf { font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 600; }
  </style>
  <rect width="880" height="440" rx="16" fill="#f8fafc"/>
  <text x="32" y="38" class="t title">Una feature, tres capas hacia el dominio</text>

  <!-- connectors from root -->
  <g stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M190,235 C230,235 220,100 260,100"/>
    <path d="M190,235 C230,235 220,180 260,180"/>
    <path d="M190,235 C230,235 220,290 260,290"/>
    <path d="M190,235 C230,235 220,370 260,370"/>
  </g>

  <!-- root folder -->
  <g transform="translate(40,212)">
    <path d="M0,6 Q0,0 6,0 H34 L42,8 H144 Q150,8 150,14 V40 Q150,46 144,46 H6 Q0,46 0,40 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3" stroke-linejoin="round"/>
    <text x="75" y="33" class="fold" fill="#0f172a" text-anchor="middle" font-size="12">exercises/</text>
  </g>

  <!-- domain -->
  <g transform="translate(260,80)">
    <path d="M0,6 Q0,0 6,0 H26 L32,6 H114 Q120,6 120,12 V34 Q120,40 114,40 H6 Q0,40 0,34 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="60" y="28" class="fold" fill="#581c87" text-anchor="middle">domain</text>
  </g>
  <!-- infra -->
  <g transform="translate(260,160)">
    <path d="M0,6 Q0,0 6,0 H26 L32,6 H114 Q120,6 120,12 V34 Q120,40 114,40 H6 Q0,40 0,34 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"/>
    <text x="60" y="28" class="fold" fill="#14532d" text-anchor="middle">infra</text>
  </g>
  <!-- presentation -->
  <g transform="translate(260,270)">
    <path d="M0,6 Q0,0 6,0 H26 L32,6 H114 Q120,6 120,12 V34 Q120,40 114,40 H6 Q0,40 0,34 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
    <text x="60" y="28" class="fold" fill="#1e3a8a" text-anchor="middle">presentation</text>
  </g>
  <!-- di -->
  <g transform="translate(260,350)">
    <path d="M0,6 Q0,0 6,0 H26 L32,6 H114 Q120,6 120,12 V34 Q120,40 114,40 H6 Q0,40 0,34 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
    <text x="60" y="28" class="fold" fill="#334155" text-anchor="middle">di</text>
  </g>

  <!-- dependency arrows into domain -->
  <path d="M370,160 C395,150 395,125 374,112" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#pu)"/>
  <path d="M370,276 C415,260 415,130 378,108" stroke="#7c3aed" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#pu)"/>

  <!-- leaves -->
  <g class="leaf" text-anchor="middle">
    <g fill="#ede9fe" stroke="#7c3aed" stroke-width="2">
      <rect x="450" y="86" width="100" height="28" rx="14"/><rect x="560" y="86" width="110" height="28" rx="14"/><rect x="680" y="86" width="100" height="28" rx="14"/>
    </g>
    <text x="500" y="105" fill="#581c87">entities</text><text x="615" y="105" fill="#581c87">repositories</text><text x="730" y="105" fill="#581c87">usecases</text>
    <g fill="#dcfce7" stroke="#16a34a" stroke-width="2">
      <rect x="450" y="166" width="70" height="28" rx="14"/><rect x="530" y="166" width="84" height="28" rx="14"/><rect x="624" y="166" width="104" height="28" rx="14"/><rect x="738" y="166" width="112" height="28" rx="14"/>
    </g>
    <text x="485" y="185" fill="#14532d">dtos</text><text x="572" y="185" fill="#14532d">mappers</text><text x="676" y="185" fill="#14532d">datasources</text><text x="794" y="185" fill="#14532d">repositories</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="450" y="276" width="70" height="28" rx="14"/><rect x="530" y="276" width="110" height="28" rx="14"/>
    </g>
    <text x="485" y="295" fill="#1e3a8a">hooks</text><text x="585" y="295" fill="#1e3a8a">components</text>
    <g fill="#f1f5f9" stroke="#64748b" stroke-width="2">
      <rect x="450" y="356" width="130" height="28" rx="14"/>
    </g>
    <text x="515" y="375" fill="#334155">container.ts</text>
  </g>

  <!-- leaf connectors -->
  <g stroke="#cbd5e1" stroke-width="2.5" fill="none">
    <path d="M380,100 H450"/><path d="M380,180 H450"/><path d="M380,290 H450"/><path d="M380,370 H450"/>
  </g>
</svg>
