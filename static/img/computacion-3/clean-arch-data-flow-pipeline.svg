<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#475569"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#16a34a"/></marker>
  </defs>
  <style>
    .t { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .head { font-size: 12px; font-weight: 800; letter-spacing: .06em; }
    .num { font-size: 18px; font-weight: 800; fill: #fff; }
    .tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; fill: #64748b; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #475569; }
  </style>
  <rect width="880" height="440" rx="16" fill="#f8fafc"/>
  <text x="32" y="38" class="t title">Un clic: ida al backend y vuelta a la pantalla</text>

  <!-- pipe -->
  <line x1="90" y1="170" x2="790" y2="170" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round"/>

  <!-- station labels -->
  <g class="t head" text-anchor="middle">
    <text x="90" y="112" fill="#1e40af">FORM</text>
    <text x="270" y="112" fill="#1e40af">HOOK</text>
    <text x="450" y="112" fill="#c2410c">USE CASE</text>
    <text x="630" y="112" fill="#6b21a8">REPO + MAPPER</text>
    <text x="790" y="112" fill="#14532d">API</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#475569" stroke-width="3" fill="none">
    <path d="M126,170 L234,170" marker-end="url(#b)"/>
    <path d="M306,170 L414,170" marker-end="url(#b)"/>
    <path d="M486,170 L594,170" marker-end="url(#b)"/>
    <path d="M666,170 L752,170" marker-end="url(#b)"/>
  </g>

  <!-- forward packets: circle = params, triangle = DTO -->
  <g fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5">
    <circle cx="180" cy="148" r="10"/>
    <circle cx="360" cy="148" r="10"/>
    <circle cx="540" cy="148" r="10"/>
  </g>
  <polygon points="709,136 721,158 697,158" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- stations -->
  <circle cx="90" cy="170" r="34" fill="#2563eb"/>
  <text x="90" y="177" class="t num" text-anchor="middle">1</text>
  <circle cx="270" cy="170" r="34" fill="#2563eb"/>
  <text x="270" y="177" class="t num" text-anchor="middle">2</text>
  <circle cx="450" cy="170" r="34" fill="#ea580c"/>
  <text x="450" y="177" class="t num" text-anchor="middle">3</text>
  <circle cx="630" cy="170" r="34" fill="#9333ea"/>
  <text x="630" y="177" class="t num" text-anchor="middle">4</text>
  <circle cx="790" cy="170" r="34" fill="#16a34a"/>
  <text x="790" y="177" class="t num" text-anchor="middle">5</text>

  <!-- return U path -->
  <path d="M790,214 L790,330 L90,330 L90,216" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#gr)" stroke-linejoin="round"/>

  <!-- return packets: triangle = DTO, square = Entity -->
  <polygon points="790,262 802,284 778,284" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" transform="translate(-60,36)"/>
  <rect x="610" y="318" width="24" height="24" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5" transform="translate(-60,0)"/>
  <rect x="438" y="318" width="24" height="24" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5" transform="translate(-60,0)"/>
  <rect x="258" y="318" width="24" height="24" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5" transform="translate(-60,0)"/>

  <text x="640" y="370" class="t tag" text-anchor="middle">toDomain()</text>
  <text x="90" y="370" class="t tag">re-render</text>
  <text x="790" y="300" class="t tag" text-anchor="end">JSON</text>

  <!-- legend -->
  <g transform="translate(300,405)">
    <circle cx="0" cy="0" r="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="16" y="4" class="t mono">params</text>
    <polygon points="118,-9 128,8 108,8" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="138" y="4" class="t mono">DTO</text>
    <rect x="200" y="-8" width="16" height="16" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
    <text x="224" y="4" class="t mono">Entity</text>
  </g>
</svg>
