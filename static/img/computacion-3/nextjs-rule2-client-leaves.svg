<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="100%" height="100%">
  <!-- Canvas Background -->
  <rect width="520" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="260" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="14.5" font-weight="800" fill="#865CF0">REGLA 2: CLIENTE EN LAS HOJAS</text>
  <text x="260" y="48" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#64748b">Aislar la interactividad en los nodos terminales para no contaminar el árbol</text>

  <!-- SPLIT COMPARISON: Anti-Patrón vs Patrón Óptimo -->
  <!-- LEFT: Contagio (Mal) -->
  <g transform="translate(20, 68)">
    <rect width="225" height="268" rx="10" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="12" y="12" width="201" height="22" rx="5" fill="#fee2e2"/>
    <text x="112" y="27" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="800" fill="#dc2626">MAL: 'use client' EN LA RAÍZ</text>

    <!-- Root client box -->
    <rect x="25" y="46" width="175" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="112" y="64" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#991b1b">'use client'</text>
    <text x="112" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#7f1d1d">DashboardPage.tsx</text>

    <!-- Contagion lines -->
    <line x1="112" y1="88" x2="60" y2="116" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="112" y1="88" x2="164" y2="116" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Contaminated Children -->
    <rect x="15" y="116" width="90" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="3 2"/>
    <text x="60" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#991b1b">BigTable.tsx</text>
    <text x="60" y="148" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="8" fill="#dc2626">Contagiado JS</text>

    <rect x="120" y="116" width="90" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="3 2"/>
    <text x="165" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#991b1b">Chart.tsx</text>
    <text x="165" y="148" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="8" fill="#dc2626">Contagiado JS</text>

    <!-- Problem tag -->
    <rect x="15" y="180" width="195" height="74" rx="6" fill="#ffffff" stroke="#fecaca"/>
    <text x="25" y="200" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="700" fill="#dc2626">Consecuencia Negativa:</text>
    <text x="25" y="216" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#7f1d1d">• Todo el árbol viaja en el bundle.</text>
    <text x="25" y="230" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#7f1d1d">• Imposible consultar BD directo.</text>
    <text x="25" y="244" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#7f1d1d">• Carga pesada para el navegador.</text>
  </g>

  <!-- RIGHT: Aislamiento (Bueno) -->
  <g transform="translate(275, 68)">
    <rect width="225" height="268" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="12" y="12" width="201" height="22" rx="5" fill="#dcfce7"/>
    <text x="112" y="27" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="800" fill="#15803d">BIEN: SOLO LA HOJA ES CLIENTE</text>

    <!-- Root server box -->
    <rect x="25" y="46" width="175" height="42" rx="6" fill="#eef2ff" stroke="#5454E9" stroke-width="1.5"/>
    <text x="112" y="64" text-anchor="middle" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#312e81">SERVER COMPONENT</text>
    <text x="112" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#4338ca">DashboardPage.tsx</text>

    <!-- Clean lines -->
    <line x1="112" y1="88" x2="60" y2="116" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="112" y1="88" x2="164" y2="116" stroke="#16a34a" stroke-width="1.5"/>

    <!-- Left Child: Stays Server -->
    <rect x="15" y="116" width="90" height="44" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="60" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#312e81">BigTable.tsx</text>
    <text x="60" y="148" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="600" fill="#5454E9">Server (0 KB)</text>

    <!-- Right Child: Only the Button is Client -->
    <rect x="120" y="116" width="90" height="44" rx="6" fill="#dcfce7" stroke="#4CB979" stroke-width="1.8"/>
    <text x="165" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="9" font-weight="700" fill="#166534">LikeBtn.tsx</text>
    <text x="165" y="148" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="700" fill="#15803d">'use client'</text>

    <!-- Advantage tag -->
    <rect x="15" y="180" width="195" height="74" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="25" y="200" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="700" fill="#15803d">Beneficio Óptimo:</text>
    <text x="25" y="216" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#166534">• 90% de UI renderizada en server.</text>
    <text x="25" y="230" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#166534">• BigTable consulta DB directamente.</text>
    <text x="25" y="244" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#166534">• Solo 2 KB de JS para el botón.</text>
  </g>
</svg>