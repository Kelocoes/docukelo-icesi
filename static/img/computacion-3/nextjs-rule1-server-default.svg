<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="100%" height="100%">
  <!-- Canvas Background -->
  <rect width="520" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="260" y="28" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="14.5" font-weight="800" fill="#5454E9">REGLA 1: SERVIDOR POR DEFECTO</text>
  <text x="260" y="46" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#64748b">Todo componente nace en el servidor hasta requerir eventos</text>

  <!-- Root Node -->
  <rect x="160" y="60" width="200" height="40" rx="8" fill="#eef2ff" stroke="#5454E9" stroke-width="2"/>
  <circle cx="180" cy="80" r="9" fill="#5454E9"/>
  <text x="180" y="84" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">S</text>
  <text x="265" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1e1e2e">app/layout.tsx</text>
  <text x="265" y="93" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="600" fill="#5454E9">Server Component (0 KB)</text>

  <!-- Tree Connectors -->
  <line x1="260" y1="100" x2="260" y2="118" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="140" y1="118" x2="380" y2="118" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="140" y1="118" x2="140" y2="130" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="380" y1="118" x2="380" y2="130" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- Left Branch: Sidebar -->
  <rect x="60" y="130" width="160" height="44" rx="8" fill="#eef2ff" stroke="#5454E9" stroke-width="1.8"/>
  <circle cx="80" cy="152" r="9" fill="#5454E9"/>
  <text x="80" y="156" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">S</text>
  <text x="150" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1e1e2e">Sidebar.tsx</text>
  <text x="150" y="163" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#5454E9">Server (0 KB JS)</text>

  <!-- Right Branch: Page -->
  <rect x="300" y="130" width="160" height="44" rx="8" fill="#eef2ff" stroke="#5454E9" stroke-width="1.8"/>
  <circle cx="320" cy="152" r="9" fill="#5454E9"/>
  <text x="320" y="156" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">S</text>
  <text x="390" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1e1e2e">app/page.tsx</text>
  <text x="390" y="163" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#5454E9">Server (Consulta BD)</text>

  <!-- Sub-connectors under app/page.tsx -->
  <line x1="380" y1="174" x2="380" y2="190" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="305" y1="190" x2="445" y2="190" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="305" y1="190" x2="305" y2="200" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="445" y1="190" x2="445" y2="200" stroke="#94a3b8" stroke-width="1.8"/>

  <!-- Sub-leaf 1: PostList (Server) -->
  <rect x="245" y="200" width="120" height="40" rx="6" fill="#eef2ff" stroke="#5454E9" stroke-width="1.5"/>
  <text x="305" y="217" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#1e1e2e">PostList.tsx</text>
  <text x="305" y="231" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#5454E9">Server (0 KB)</text>

  <!-- Sub-leaf 2: LikeButton (Client) -->
  <rect x="375" y="200" width="130" height="40" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <circle cx="390" cy="220" r="7" fill="#10b981"/>
  <text x="390" y="223" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="800" fill="#ffffff">C</text>
  <text x="445" y="217" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#065f46">LikeButton.tsx</text>
  <text x="445" y="231" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="700" fill="#047857">'use client' (Click)</text>

  <!-- Bottom Spacious Stat Cards -->
  <g transform="translate(25, 258)">
    <rect width="225" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="112" y="24" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#5454E9">ÁRBOL EN SERVIDOR (90%)</text>
    <text x="112" y="48" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#1e1e2e">0 KB de JavaScript</text>
    <text x="112" y="66" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#64748b">Layout, Sidebar y Page corren en Node</text>

    <rect x="245" width="225" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="357" y="24" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#10b981">FRONTERA CLIENTE (10%)</text>
    <text x="357" y="48" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#047857">Solo LikeButton</text>
    <text x="357" y="66" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#64748b">Único script que hidrata el navegador</text>
  </g>
</svg>