<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%">
  <defs>
    <marker id="s12-st-slate-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#94a3b8"/>
    </marker>
    <marker id="s12-st-purple-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 Z" fill="#c084fc"/>
    </marker>
  </defs>
  <style>
    .t { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #f1f5f9; }
    .st-num { font-size: 16px; font-weight: 800; fill: #0f172a; }
    .st-name { font-size: 15px; font-weight: 700; }
    .st-tag { font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; }
    .st-desc { font-size: 12px; font-weight: 500; fill: #94a3b8; }
    .st-crit { font-size: 11px; font-weight: 600; fill: #cbd5e1; }
  </style>

  <!-- Canvas background dark -->
  <rect width="880" height="470" rx="16" fill="#0f172a"/>

  <!-- Title (Claim sentence) -->
  <text x="32" y="38" class="t title">Escalera de decisión: del estado local al store global</text>

  <!-- Connective ramp / upward spine -->
  <path d="M120,340 L310,265 L500,185 L690,105" stroke="#334155" stroke-width="4" stroke-dasharray="6 6" fill="none"/>
  <path d="M190,312 L220,300" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#s12-st-slate-dark)"/>
  <path d="M380,232 L410,220" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#s12-st-slate-dark)"/>
  <path d="M570,152 L600,140" stroke="#c084fc" stroke-width="3" fill="none" marker-end="url(#s12-st-purple-dark)"/>

  <!-- STEP 1: Estado Local -->
  <g transform="translate(32, 280)">
    <rect width="180" height="120" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <circle cx="28" cy="28" r="14" fill="#3b82f6"/>
    <text x="28" y="33" class="t st-num" text-anchor="middle">1</text>
    <text x="52" y="33" class="t st-name" fill="#93c5fd">Estado Local</text>
    <rect x="14" y="52" width="76" height="22" rx="11" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="52" y="67" class="t st-tag" fill="#60a5fa" text-anchor="middle">useState</text>
    <text x="14" y="92" class="t st-desc">1 componente aislado</text>
    <text x="14" y="108" class="t st-crit">Inputs, modals, UI efímera</text>
  </g>

  <!-- STEP 2: Lifting State Up -->
  <g transform="translate(225, 205)">
    <rect width="180" height="120" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2.5"/>
    <circle cx="28" cy="28" r="14" fill="#22c55e"/>
    <text x="28" y="33" class="t st-num" text-anchor="middle">2</text>
    <text x="52" y="33" class="t st-name" fill="#86efac">Lifting State Up</text>
    <rect x="14" y="52" width="94" height="22" rx="11" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="61" y="67" class="t st-tag" fill="#4ade80" text-anchor="middle">Props &amp; Fn</text>
    <text x="14" y="92" class="t st-desc">2 o 3 hermanos cercanos</text>
    <text x="14" y="108" class="t st-crit">Ancestro común directo</text>
  </g>

  <!-- STEP 3: Context API -->
  <g transform="translate(418, 125)">
    <rect width="180" height="120" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="2.5"/>
    <circle cx="28" cy="28" r="14" fill="#f97316"/>
    <text x="28" y="33" class="t st-num" text-anchor="middle">3</text>
    <text x="52" y="33" class="t st-name" fill="#fdba74">Context API</text>
    <rect x="14" y="52" width="96" height="22" rx="11" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
    <text x="62" y="67" class="t st-tag" fill="#fb923c" text-anchor="middle">Provider</text>
    <text x="14" y="92" class="t st-desc">Lectura transversal simple</text>
    <text x="14" y="108" class="t st-crit">Tema, auth, baja frecuencia</text>
  </g>

  <!-- STEP 4: Store Global (Redux) -->
  <g transform="translate(611, 45)">
    <rect width="235" height="135" rx="14" fill="#2e1065" stroke="#a855f7" stroke-width="3.5"/>
    <circle cx="32" cy="32" r="16" fill="#c084fc"/>
    <text x="32" y="38" class="t st-num" text-anchor="middle">4</text>
    <text x="58" y="38" class="t st-name" fill="#f3e8ff" font-size="16">Store Global</text>
    <rect x="16" y="58" width="124" height="24" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
    <text x="78" y="74" class="t st-tag" fill="#e9d5ff" text-anchor="middle">Redux Toolkit</text>
    <text x="16" y="100" class="t st-desc" font-weight="600" fill="#f3e8ff">Alta frecuencia + Asincronía</text>
    <text x="16" y="118" class="t st-crit" fill="#d8b4fe">Múltiples pantallas y rutas</text>
  </g>

  <!-- Bottom criteria banner -->
  <g transform="translate(32, 416)">
    <rect width="816" height="38" rx="8" fill="#1e293b"/>
    <text x="16" y="24" class="t st-crit" font-size="12" fill="#e2e8f0">Regla de oro: usa la solución más simple posible en cada nivel. Escala solo cuando el costo de mantenimiento lo justifique.</text>
  </g>
</svg>
