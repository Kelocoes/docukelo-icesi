<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <style>
    .t { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 13px; font-weight: 500; fill: #64748b; }
    .card-title { font-size: 16px; font-weight: 700; }
    .badge { font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; }
    .feat-title { font-size: 12px; font-weight: 700; fill: #334155; }
    .feat-desc { font-size: 11.5px; font-weight: 400; fill: #64748b; }
    .use-case-box { font-size: 11px; font-weight: 600; }
  </style>

  <!-- Canvas background -->
  <rect width="880" height="440" rx="16" fill="#f8fafc"/>

  <!-- Title & Subtitle -->
  <text x="32" y="38" class="t title">Gestión de Estado: Context vs. Zustand vs. Redux Toolkit</text>
  <text x="32" y="60" class="t sub">Criterios de selección según complejidad, arquitectura y volumen de re-renders</text>

  <!-- CARD 1: React Context -->
  <g transform="translate(32, 80)">
    <rect width="256" height="330" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="16" y="16" width="105" height="24" rx="12" fill="#dbeafe"/>
    <text x="68" y="32" class="t badge" fill="#1d4ed8" text-anchor="middle">React Context</text>
    <text x="16" y="64" class="t card-title" fill="#1e3a8a">Inyección de Datos</text>
    
    <g transform="translate(16, 80)">
      <circle cx="5" cy="8" r="3" fill="#3b82f6"/>
      <text x="15" y="11" class="t feat-title">Alcance:</text>
      <text x="15" y="27" class="t feat-desc">Transporte de datos sin prop drilling.</text>

      <circle cx="5" cy="50" r="3" fill="#3b82f6"/>
      <text x="15" y="53" class="t feat-title">Re-renders:</text>
      <text x="15" y="69" class="t feat-desc">Afecta a todo el subárbol consumidor.</text>

      <circle cx="5" cy="92" r="3" fill="#3b82f6"/>
      <text x="15" y="95" class="t feat-title">Arquitectura:</text>
      <text x="15" y="111" class="t feat-desc">Requiere &lt;Provider&gt;; sin middleware.</text>

      <circle cx="5" cy="134" r="3" fill="#3b82f6"/>
      <text x="15" y="137" class="t feat-title">Depuración:</text>
      <text x="15" y="153" class="t feat-desc">React DevTools básica; sin time travel.</text>
    </g>

    <rect x="16" y="256" width="224" height="58" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="26" y="274" class="t use-case-box" fill="#1e40af">Cuándo usar:</text>
    <text x="26" y="290" class="t feat-desc" fill="#3b82f6">Tema claro/oscuro, idioma y</text>
    <text x="26" y="304" class="t feat-desc" fill="#3b82f6">datos globales de baja frecuencia.</text>
  </g>

  <!-- CARD 2: Zustand -->
  <g transform="translate(312, 80)">
    <rect width="256" height="330" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <rect x="16" y="16" width="75" height="24" rx="12" fill="#dcfce7"/>
    <text x="53" y="32" class="t badge" fill="#15803d" text-anchor="middle">Zustand</text>
    <text x="16" y="64" class="t card-title" fill="#14532d">Global Ágil</text>

    <g transform="translate(16, 80)">
      <circle cx="5" cy="8" r="3" fill="#22c55e"/>
      <text x="15" y="11" class="t feat-title">Alcance:</text>
      <text x="15" y="27" class="t feat-desc">Store minimalista basado en hooks.</text>

      <circle cx="5" cy="50" r="3" fill="#22c55e"/>
      <text x="15" y="53" class="t feat-title">Re-renders:</text>
      <text x="15" y="69" class="t feat-desc">Selectivos con useStore((s) =&gt; s.x).</text>

      <circle cx="5" cy="90" r="3" fill="#22c55e"/>
      <text x="15" y="93" class="t feat-title">Arquitectura:</text>
      <text x="15" y="108" class="t feat-desc">Sin Provider obligatorio;</text>
      <text x="15" y="122" class="t feat-desc">boilerplate casi nulo.</text>

      <circle cx="5" cy="138" r="3" fill="#22c55e"/>
      <text x="15" y="141" class="t feat-title">Depuración:</text>
      <text x="15" y="155" class="t feat-desc">Middleware para Redux DevTools.</text>
    </g>

    <rect x="16" y="256" width="224" height="58" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="26" y="274" class="t use-case-box" fill="#166534">Cuándo usar:</text>
    <text x="26" y="290" class="t feat-desc" fill="#15803d">SPAs medianas, prototipos y</text>
    <text x="26" y="304" class="t feat-desc" fill="#15803d">módulos con UI ágil o dinámica.</text>
  </g>

  <!-- CARD 3: Redux Toolkit -->
  <g transform="translate(592, 80)">
    <rect width="256" height="330" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <rect x="16" y="16" width="105" height="24" rx="12" fill="#f3e8ff"/>
    <text x="68" y="32" class="t badge" fill="#7e22ce" text-anchor="middle">Redux Toolkit</text>
    <text x="16" y="64" class="t card-title" fill="#581c87">Estado Empresarial</text>

    <g transform="translate(16, 80)">
      <circle cx="5" cy="8" r="3" fill="#a855f7"/>
      <text x="15" y="11" class="t feat-title">Alcance:</text>
      <text x="15" y="27" class="t feat-desc">Flujo unidireccional estricto con slices.</text>

      <circle cx="5" cy="50" r="3" fill="#a855f7"/>
      <text x="15" y="53" class="t feat-title">Re-renders:</text>
      <text x="15" y="69" class="t feat-desc">Altamente selectivos mediante useSelector.</text>

      <circle cx="5" cy="92" r="3" fill="#a855f7"/>
      <text x="15" y="95" class="t feat-title">Arquitectura:</text>
      <text x="15" y="111" class="t feat-desc">Immer, Thunks y Clean Arch desacoplada.</text>

      <circle cx="5" cy="134" r="3" fill="#a855f7"/>
      <text x="15" y="137" class="t feat-title">Depuración:</text>
      <text x="15" y="153" class="t feat-desc">Redux DevTools nativo con Time-Travel.</text>
    </g>

    <rect x="16" y="256" width="224" height="58" rx="8" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="26" y="274" class="t use-case-box" fill="#6b21a8">Cuándo usar:</text>
    <text x="26" y="290" class="t feat-desc" fill="#7e22ce">Clean Architecture, equipos</text>
    <text x="26" y="304" class="t feat-desc" fill="#7e22ce">grandes y alta asincronía.</text>
  </g>
</svg>
