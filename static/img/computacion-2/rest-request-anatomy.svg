<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" style="max-width:920px; display:block; margin:0 auto;">
  <defs>
    <style>
      .t-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .t-sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
      .mono-sm { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #1e293b; }
      .mono-ann { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="920" height="340" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Columna Izquierda: Componentes de la Petición HTTP -->
  <rect x="25" y="20" width="370" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="25" y="20" width="370" height="36" rx="12" fill="#eff6ff"/>
  <rect x="25" y="40" width="370" height="16" fill="#eff6ff"/>
  <text class="t-title" x="210" y="42" text-anchor="middle" fill="#1e3a8a">Petición HTTP Entrante</text>

  <!-- Segmento 1: Path -->
  <rect x="40" y="68" width="340" height="48" rx="8" fill="#f8fafc" stroke="#93c5fd"/>
  <text class="mono-sm" x="52" y="88">/api/v1/productos/<tspan fill="#2563eb" font-weight="700">42</tspan></text>
  <text class="t-sub" x="52" y="104">Identificador primario en la URI</text>

  <!-- Segmento 2: Query String -->
  <rect x="40" y="128" width="340" height="48" rx="8" fill="#f8fafc" stroke="#fcd34d"/>
  <text class="mono-sm" x="52" y="148">?nombre=laptop&amp;<tspan fill="#d97706" font-weight="700">limite=10</tspan></text>
  <text class="t-sub" x="52" y="164">Parámetros opcionales / filtros</text>

  <!-- Segmento 3: Headers -->
  <rect x="40" y="188" width="340" height="48" rx="8" fill="#f8fafc" stroke="#fca5a5"/>
  <text class="mono-sm" x="52" y="208">Authorization: <tspan fill="#dc2626" font-weight="700">Bearer eyJ...</tspan></text>
  <text class="t-sub" x="52" y="224">Metadatos, tokens o cliente</text>

  <!-- Segmento 4: Body JSON -->
  <rect x="40" y="248" width="340" height="58" rx="8" fill="#f8fafc" stroke="#86efac"/>
  <text class="mono-sm" x="52" y="268">{ <tspan fill="#16a34a" font-weight="700">"nombre": "Monitor", "precio": 350.0</tspan> }</text>
  <text class="t-sub" x="52" y="286">Payload serializado en JSON</text>

  <!-- Conectores y Flechas -->
  <line x1="380" y1="92" x2="480" y2="92" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="380" y1="152" x2="480" y2="152" stroke="#d97706" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="380" y1="212" x2="480" y2="212" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="380" y1="277" x2="480" y2="277" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- Columna Derecha: Anotaciones Spring Boot y ResponseEntity -->
  <rect x="485" y="20" width="410" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="485" y="20" width="410" height="36" rx="12" fill="#f0fdf4"/>
  <rect x="485" y="40" width="410" height="16" fill="#f0fdf4"/>
  <text class="t-title" x="690" y="42" text-anchor="middle" fill="#14532d">Anotaciones del Controlador REST</text>

  <!-- Anotación 1: @PathVariable -->
  <rect x="500" y="68" width="380" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="mono-ann" x="515" y="88" fill="#1d4ed8">@PathVariable("id") Long id</text>
  <text class="t-sub" x="515" y="104">Inyecta variable del path directamente en Java</text>

  <!-- Anotación 2: @RequestParam -->
  <rect x="500" y="128" width="380" height="48" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text class="mono-ann" x="515" y="148" fill="#b45309">@RequestParam(defaultValue="20") int limite</text>
  <text class="t-sub" x="515" y="164">Parámetros de consulta con default o requeridos</text>

  <!-- Anotación 3: @RequestHeader -->
  <rect x="500" y="188" width="380" height="48" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text class="mono-ann" x="515" y="208" fill="#b91c1c">@RequestHeader("Authorization") String token</text>
  <text class="t-sub" x="515" y="224">Lectura de cabeceras de seguridad y cliente</text>

  <!-- Anotación 4: @RequestBody -->
  <rect x="500" y="248" width="380" height="58" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text class="mono-ann" x="515" y="268" fill="#15803d">@RequestBody ProductoCreateDTO dto</text>
  <text class="t-sub" x="515" y="286">Jackson deserializa JSON ➔ Objeto Java tipado</text>
</svg>
