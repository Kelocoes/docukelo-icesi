<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%">
  <defs>
    <filter id="box-shadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .v-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
    .v-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #64748b; }
    .pill-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 800; fill: #ffffff; }
    .desc-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
    .banner-text { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; font-weight: 800; }
  </style>

  <!-- Background Canvas -->
  <rect x="5" y="5" width="930" height="510" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Main Title -->
  <text x="470" y="36" class="v-title" text-anchor="middle">Jerarquía de Variables en Postman: Ámbitos Anidados</text>
  <text x="470" y="56" class="v-subtitle" text-anchor="middle">Las variables se resuelven de adentro hacia afuera: el ámbito más interno y específico tiene máxima prioridad</text>

  <!-- Nested Boxes Container -->
  <g transform="translate(20, 70)" filter="url(#box-shadow)">
    <!-- 1. Global Scope (Outermost) -->
    <rect x="0" y="0" width="900" height="430" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect x="15" y="15" width="185" height="26" rx="5" fill="#334155"/>
    <text x="107" y="32" class="pill-text" text-anchor="middle">1. Ámbito Global (Global)</text>
    <text x="215" y="33" class="desc-text" fill="#475569">Disponible en todo el workspace. Menor precedencia (se sobrescribe por niveles internos).</text>

    <!-- 2. Collection Scope -->
    <rect x="20" y="55" width="860" height="360" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="35" y="70" width="200" height="26" rx="5" fill="#1e40af"/>
    <text x="135" y="87" class="pill-text" text-anchor="middle">2. Colección (Collection)</text>
    <text x="250" y="88" class="desc-text" fill="#1e3a8a">Compartido exclusivamente por las peticiones de esta colección de Spring Boot.</text>

    <!-- 3. Environment Scope -->
    <rect x="40" y="110" width="820" height="290" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="55" y="125" width="200" height="26" rx="5" fill="#15803d"/>
    <text x="155" y="142" class="pill-text" text-anchor="middle">3. Entorno (Environment)</text>
    <text x="270" y="143" class="desc-text" fill="#14532d">Servidor activo (Dev localhost:8080 vs Prod). Ideal para base_url y jwt_token.</text>

    <!-- 4. Data Scope -->
    <rect x="60" y="165" width="780" height="220" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <rect x="75" y="180" width="180" height="26" rx="5" fill="#b45309"/>
    <text x="165" y="197" class="pill-text" text-anchor="middle">4. Datos (Data Scope)</text>
    <text x="270" y="198" class="desc-text" fill="#713f12">Inyectado fila por fila desde archivos CSV o JSON durante ejecuciones en el Runner.</text>

    <!-- 5. Local Scope (Innermost) -->
    <rect x="80" y="220" width="740" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="95" y="235" width="180" height="28" rx="5" fill="#b91c1c"/>
    <text x="185" y="253" class="pill-text" text-anchor="middle">5. Local (Local Scope)</text>
    <text x="290" y="254" class="desc-text" fill="#7f1d1d">Variables temporales de script (pm.variables.set). Solo existen en la petición actual.</text>

    <!-- Max Priority Banner -->
    <rect x="95" y="280" width="710" height="50" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="450" y="302" class="banner-text" fill="#991b1b" text-anchor="middle">PRIORIDAD MÁXIMA DE RESOLUCIÓN:</text>
    <text x="450" y="320" class="banner-text" fill="#b91c1c" text-anchor="middle">Local &gt; Data &gt; Environment &gt; Collection &gt; Global</text>
  </g>
</svg>
