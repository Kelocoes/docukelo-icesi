<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="100%" style="max-width:900px; display:block; margin:0 auto;">
  <defs>
    <style>
      .name  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .small { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .row   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; fill: #64748b; }
    </style>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="900" height="390" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Fila 1: Login -->
  <text class="row" x="170" y="52">Login</text>

  <rect x="30" y="70" width="100" height="60" rx="10" fill="#1e293b"/>
  <text x="80" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Cliente</text>

  <rect x="170" y="70" width="200" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text class="name" x="270" y="106" text-anchor="middle">AuthController</text>

  <rect x="430" y="70" width="150" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text class="name" x="505" y="106" text-anchor="middle">AuthService</text>

  <line x1="130" y1="100" x2="168" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#a-gray)"/>
  <line x1="370" y1="100" x2="428" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#a-gray)"/>
  <line x1="580" y1="100" x2="638" y2="100" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/>
  <text class="small" x="609" y="90" text-anchor="middle">genera</text>

  <!-- JwtService compartido -->
  <rect x="640" y="70" width="220" height="190" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text class="name" x="750" y="158" text-anchor="middle">JwtService</text>
  <text class="small" x="750" y="180" text-anchor="middle">Crea y revisa tokens</text>

  <!-- Fila 2: Peticiones protegidas -->
  <text class="row" x="170" y="182">Peticiones protegidas</text>

  <rect x="30" y="200" width="100" height="60" rx="10" fill="#1e293b"/>
  <text x="80" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Cliente</text>

  <rect x="170" y="200" width="200" height="60" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text class="name" x="270" y="236" text-anchor="middle">JwtAuthenticationFilter</text>

  <line x1="130" y1="230" x2="168" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#a-gray)"/>
  <line x1="370" y1="230" x2="638" y2="230" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/>
  <text class="small" x="504" y="220" text-anchor="middle">valida</text>

  <!-- Configuración -->
  <rect x="170" y="315" width="200" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text class="name" x="270" y="345" text-anchor="middle">WebSecurityConfig</text>
  <line x1="270" y1="315" x2="270" y2="262" stroke="#2563eb" stroke-width="2" marker-end="url(#a-gray)"/>
  <text class="small" x="282" y="293">registra</text>
</svg>
