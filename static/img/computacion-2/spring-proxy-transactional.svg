<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <!-- Sombra suave para cajas -->
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Marcadores de flecha -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <style>
    .actor-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; text-anchor: middle; }
    .actor-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 10px; fill: #64748b; text-anchor: middle; }
    .msg-label { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11px; fill: #1e293b; }
    .code-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #0369a1; }
    .num-circle { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 10px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; }
  </style>

  <!-- Fondo General -->
  <rect x="0" y="0" width="880" height="500" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- LÍNEAS DE VIDA (Lifelines) -->
  <!-- 1. Web Controller (x = 90) -->
  <line x1="90" y1="80" x2="90" y2="465" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4" />
  <!-- 2. Transactional Proxy (x = 270) -->
  <line x1="270" y1="80" x2="270" y2="465" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5,4" />
  <!-- 3. TransactionManager (x = 465) -->
  <line x1="465" y1="80" x2="465" y2="465" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4" />
  <!-- 4. Target Service (x = 650) -->
  <line x1="650" y1="80" x2="650" y2="465" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4" />
  <!-- 5. JDBC / Database (x = 800) -->
  <line x1="800" y1="80" x2="800" y2="465" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4" />

  <!-- ENCABEZADOS DE PARTICIPANTES -->
  <!-- 1. Web Controller -->
  <rect x="25" y="20" width="130" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#box-shadow)" />
  <text x="90" y="42" class="actor-title">Web Controller</text>
  <text x="90" y="58" class="actor-sub">TransferController</text>

  <!-- 2. Spring Proxy (Destacado) -->
  <rect x="195" y="20" width="150" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#box-shadow)" />
  <text x="270" y="42" class="actor-title" fill="#1d4ed8">Spring AOP Proxy</text>
  <text x="270" y="58" class="actor-sub" fill="#2563eb">@Transactional Interceptor</text>

  <!-- 3. PlatformTransactionManager -->
  <rect x="385" y="20" width="160" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#box-shadow)" />
  <text x="465" y="42" class="actor-title">TransactionManager</text>
  <text x="465" y="58" class="actor-sub">JpaTransactionManager</text>

  <!-- 4. Target Service -->
  <rect x="585" y="20" width="130" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#box-shadow)" />
  <text x="650" y="42" class="actor-title">Target Service</text>
  <text x="650" y="58" class="actor-sub">BankService Bean real</text>

  <!-- 5. DB / JDBC -->
  <rect x="745" y="20" width="110" height="50" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#box-shadow)" />
  <text x="800" y="42" class="actor-title" fill="#15803d">Database</text>
  <text x="800" y="58" class="actor-sub">Postgres / MySQL</text>

  <!-- MENSAJES Y PASOS DEL FLUJO -->

  <!-- Paso 1: Controller -> Proxy -->
  <circle cx="90" cy="105" r="9" fill="#2563eb" />
  <text x="90" y="105" class="num-circle">1</text>
  <line x1="99" y1="105" x2="260" y2="105" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="110" y="98" class="msg-label">transferMoney(1, 2, 500)</text>

  <!-- Paso 2: Proxy -> TM (Abre Tx) -->
  <circle cx="270" cy="135" r="9" fill="#2563eb" />
  <text x="270" y="135" class="num-circle">2</text>
  <line x1="279" y1="135" x2="455" y2="135" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="290" y="128" class="code-tag">getTransaction(status)</text>

  <!-- Paso 3: TM -> DB (Deshabilita autocommit) -->
  <circle cx="465" cy="165" r="9" fill="#64748b" />
  <text x="465" y="165" class="num-circle">3</text>
  <line x1="474" y1="165" x2="790" y2="165" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)" />
  <text x="510" y="158" class="code-tag" fill="#475569">SET autocommit = 0; BEGIN;</text>

  <!-- Paso 4: Proxy -> Target Bean (Ejecución real) -->
  <circle cx="270" cy="195" r="9" fill="#2563eb" />
  <text x="270" y="195" class="num-circle">4</text>
  <line x1="279" y1="195" x2="640" y2="195" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="320" y="188" class="msg-label">Invoca método real en Target Bean</text>

  <!-- Paso 5: Target -> DB (Queries DML) -->
  <circle cx="650" cy="225" r="9" fill="#64748b" />
  <text x="650" y="225" class="num-circle">5</text>
  <line x1="659" y1="225" x2="790" y2="225" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-slate)" />
  <text x="670" y="218" class="code-tag" fill="#475569">UPDATE accounts (débito/crédito)</text>

  <!-- CONDICIONAL ALT: CAMINO EXITOSO VS FALLO -->
  <g transform="translate(185, 255)">
    <!-- Marco Camino Exitoso -->
    <rect x="0" y="0" width="650" height="95" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <rect x="0" y="0" width="180" height="22" rx="8" fill="#dcfce7" />
    <text x="12" y="15" class="box-title" fill="#15803d">CASO A: MÉTODO EXITOSO</text>

    <!-- Target a Proxy retorno -->
    <line x1="465" y1="40" x2="95" y2="40" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-green)" />
    <text x="230" y="34" class="msg-label" fill="#15803d">Retorna sin excepciones</text>

    <!-- Proxy a TM commit -->
    <line x1="95" y1="65" x2="270" y2="65" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)" />
    <text x="120" y="60" class="code-tag" fill="#15803d">commit(status)</text>

    <!-- TM a DB COMMIT -->
    <line x1="280" y1="75" x2="605" y2="75" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)" />
    <text x="380" y="70" class="code-tag" fill="#15803d">COMMIT TRANSACTION;</text>
  </g>

  <!-- Marco Camino Falla con Rollback -->
  <g transform="translate(185, 365)">
    <rect x="0" y="0" width="650" height="95" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
    <rect x="0" y="0" width="230" height="22" rx="8" fill="#fee2e2" />
    <text x="12" y="15" class="box-title" fill="#b91c1c">CASO B: LANZA EXCEPCIÓN (@rollbackFor)</text>

    <!-- Target lanza excepción a Proxy -->
    <line x1="465" y1="40" x2="95" y2="40" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-red)" />
    <text x="170" y="34" class="code-tag" fill="#b91c1c">throw new InsufficientFundsException()</text>

    <!-- Proxy intercepta y ordena rollback -->
    <line x1="95" y1="65" x2="270" y2="65" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
    <text x="120" y="60" class="code-tag" fill="#b91c1c">rollback(status)</text>

    <!-- TM a DB ROLLBACK -->
    <line x1="280" y1="75" x2="605" y2="75" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)" />
    <text x="375" y="70" class="code-tag" fill="#b91c1c">ROLLBACK TRANSACTION;</text>
  </g>
</svg>
