<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="100%" height="100%">
  <defs>
    <filter id="tx-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="tx-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="tx-arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <style>
    .tx-title-main { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; fill: #0f172a; }
    .tx-badge-green { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #166534; }
    .tx-badge-red { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #991b1b; }
    .tx-step-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #1e293b; }
    .tx-body { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 11.5px; fill: #475569; }
    .tx-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
  </style>

  <!-- Contenedor general -->
  <rect x="0" y="0" width="820" height="340" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- LADO IZQUIERDO: Camino Exitoso (COMMIT) -->
  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="370" height="290" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#tx-shadow)" />
    
    <!-- Encabezado -->
    <rect x="0" y="0" width="370" height="42" rx="12" fill="#dcfce7" />
    <rect x="0" y="24" width="370" height="18" fill="#dcfce7" />
    <text x="16" y="26" class="tx-title-main" fill="#14532d">Flujo Exitoso: COMMIT</text>
    <rect x="250" y="10" width="105" height="22" rx="11" fill="#bbf7d0" />
    <text x="268" y="25" class="tx-badge-green">ATOMICIDAD</text>

    <!-- Paso 1 -->
    <rect x="18" y="55" width="334" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" />
    <text x="30" y="74" class="tx-step-title" fill="#166534">1. Inicio de Transacción</text>
    <text x="30" y="92" class="tx-body">Interceptores de Spring abren conexión y quitan autocommit.</text>

    <!-- Paso 2 -->
    <rect x="18" y="112" width="334" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="30" y="131" class="tx-step-title">2. Operaciones DML múltiples</text>
    <text x="30" y="149" class="tx-code" fill="#2563eb">debito() -&gt; credito() -&gt; auditoria()</text>

    <!-- Paso 3 -->
    <rect x="18" y="170" width="334" height="52" rx="8" fill="#ecfdf5" stroke="#6ee7b7" />
    <text x="30" y="189" class="tx-step-title" fill="#047857">3. Método finaliza sin excepciones</text>
    <text x="30" y="209" class="tx-body">Se confirma el bloque atómico con la base de datos.</text>

    <!-- Resultado Commit -->
    <rect x="18" y="232" width="334" height="44" rx="8" fill="#15803d" />
    <text x="110" y="259" class="tx-step-title" fill="#ffffff">COMMIT CONFIRMADO</text>
  </g>

  <!-- LADO DERECHO: Excepción y ROLLBACK -->
  <g transform="translate(425, 25)">
    <rect x="0" y="0" width="370" height="290" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#tx-shadow)" />
    
    <!-- Encabezado -->
    <rect x="0" y="0" width="370" height="42" rx="12" fill="#fee2e2" />
    <rect x="0" y="24" width="370" height="18" fill="#fee2e2" />
    <text x="16" y="26" class="tx-title-main" fill="#991b1b">Falla: ROLLBACK AUTOMÁTICO</text>
    <rect x="250" y="10" width="105" height="22" rx="11" fill="#fecaca" />
    <text x="260" y="25" class="tx-badge-red">CONSISTENCIA</text>

    <!-- Paso 1 -->
    <rect x="18" y="55" width="334" height="48" rx="8" fill="#fef2f2" stroke="#fca5a5" />
    <text x="30" y="74" class="tx-step-title" fill="#991b1b">1. Inicio de Transacción</text>
    <text x="30" y="92" class="tx-body">Mismo contexto transaccional en el proxy de Spring.</text>

    <!-- Paso 2 -->
    <rect x="18" y="112" width="334" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="30" y="131" class="tx-step-title">2. Se ejecuta débito con éxito</text>
    <text x="30" y="149" class="tx-body">Saldo restado en la sesión pendiente de confirmación.</text>

    <!-- Paso 3: Error -->
    <rect x="18" y="170" width="334" height="52" rx="8" fill="#fff1f2" stroke="#f87171" />
    <text x="30" y="189" class="tx-step-title" fill="#b91c1c">3. Lanzamiento de Excepción</text>
    <text x="30" y="209" class="tx-code" fill="#b91c1c">throw new InsufficientFundsException()</text>

    <!-- Resultado Rollback -->
    <rect x="18" y="232" width="334" height="44" rx="8" fill="#b91c1c" />
    <text x="95" y="259" class="tx-step-title" fill="#ffffff">ROLLBACK REVIERTE CAMBIOS</text>
  </g>
</svg>
