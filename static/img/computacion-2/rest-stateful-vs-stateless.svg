<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" style="max-width:900px; display:block; margin:0 auto;">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .name  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .small { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .cap   { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; }
    </style>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="900" height="340" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Panel izquierdo: Stateful -->
  <rect x="20" y="20" width="420" height="300" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="title" x="230" y="52" text-anchor="middle">Stateful</text>

  <rect x="45" y="140" width="110" height="70" rx="10" fill="#1e293b"/>
  <text x="100" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Cliente</text>

  <rect x="290" y="95" width="125" height="160" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="name" x="352" y="125" text-anchor="middle">Servidor</text>
  <rect x="305" y="150" width="95" height="75" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-dasharray="5 4"/>
  <text class="small" x="352" y="184" text-anchor="middle">Sesión</text>
  <text class="small" x="352" y="202" text-anchor="middle">en memoria</text>

  <line x1="155" y1="175" x2="288" y2="175" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/>
  <text class="small" x="222" y="165" text-anchor="middle">ID de sesión</text>

  <text class="cap" x="230" y="292" text-anchor="middle" fill="#b91c1c">El servidor recuerda al cliente</text>

  <!-- Panel derecho: Stateless -->
  <rect x="460" y="20" width="420" height="300" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="title" x="670" y="52" text-anchor="middle">Stateless</text>

  <rect x="485" y="140" width="110" height="70" rx="10" fill="#1e293b"/>
  <text x="540" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Cliente</text>

  <rect x="740" y="80" width="115" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text class="name" x="797" y="116" text-anchor="middle">Servidor 1</text>
  <rect x="740" y="210" width="115" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text class="name" x="797" y="246" text-anchor="middle">Servidor 2</text>

  <line x1="595" y1="165" x2="738" y2="112" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
  <line x1="595" y1="185" x2="738" y2="238" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
  <text class="small" x="640" y="180" text-anchor="middle">Token</text>

  <text class="cap" x="670" y="292" text-anchor="middle" fill="#1d4ed8">Cada petición trae todo lo necesario</text>
</svg>
