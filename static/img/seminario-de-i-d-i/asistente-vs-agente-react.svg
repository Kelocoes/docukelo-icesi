<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <defs>
    <style>
      :root {
        --canvas: #f8fafc;
        --card: #ffffff;
        --card-border: #e2e8f0;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --accent-blue: #2563eb;
        --accent-purple: #7c3aed;
        --accent-green: #059669;
        --accent-red: #dc2626;
        --surface-tint: #f1f5f9;
        --terminal-bg: #0f172a;
        --terminal-text: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #111827;
          --card: #1f2937;
          --card-border: #374151;
          --text-primary: #f9fafb;
          --text-secondary: #9ca3af;
          --accent-blue: #3b82f6;
          --accent-purple: #a855f7;
          --accent-green: #10b981;
          --accent-red: #ef4444;
          --surface-tint: #1e293b;
          --terminal-bg: #030712;
          --terminal-text: #f3f4f6;
        }
      }
      .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>

    <filter id="subtle-shadow" x="-4%" y="-4%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="440" rx="16" fill="var(--canvas)" stroke="var(--card-border)" stroke-width="1.5"/>

  <!-- LEFT: CHATBOT PASIVO -->
  <g transform="translate(30, 24)">
    <rect width="395" height="392" rx="12" fill="var(--card)" stroke="var(--card-border)" stroke-width="1.5" filter="url(#subtle-shadow)"/>
    
    <!-- Title Badge -->
    <rect x="20" y="18" width="135" height="24" rx="6" fill="var(--surface-tint)"/>
    <text x="87" y="34" class="font-sans" font-size="11" font-weight="700" fill="var(--text-secondary)" text-anchor="middle">CHATBOT TRADICIONAL</text>
    <text x="20" y="66" class="font-sans" font-size="16" font-weight="700" fill="var(--text-primary)">Aislamiento y Copia Manual</text>

    <!-- Visual Metaphor: User Window -->
    <g transform="translate(24, 86)">
      <rect width="140" height="110" rx="8" fill="var(--surface-tint)" stroke="var(--card-border)"/>
      <rect x="10" y="10" width="30" height="6" rx="3" fill="var(--text-secondary)" opacity="0.4"/>
      <!-- Code lines -->
      <rect x="10" y="24" width="70" height="5" rx="2" fill="var(--accent-blue)" opacity="0.8"/>
      <rect x="10" y="34" width="110" height="4" rx="2" fill="var(--text-secondary)" opacity="0.3"/>
      <rect x="10" y="42" width="90" height="4" rx="2" fill="var(--text-secondary)" opacity="0.3"/>
      <rect x="10" y="50" width="80" height="4" rx="2" fill="var(--text-secondary)" opacity="0.3"/>
      
      <rect x="10" y="72" width="120" height="26" rx="4" fill="var(--card)" stroke="var(--card-border)"/>
      <text x="70" y="89" class="font-sans" font-size="10.5" font-weight="600" fill="var(--text-primary)" text-anchor="middle">IDE / Tu Proyecto</text>
    </g>

    <!-- Air Gap / Firewall Barrier with Vector Padlock (NO EMOJIS) -->
    <g transform="translate(182, 86)">
      <line x1="16" y1="0" x2="16" y2="110" stroke="var(--accent-red)" stroke-width="2" stroke-dasharray="5 4"/>
      
      <!-- Vector Lock Icon -->
      <g transform="translate(4, 38)">
        <rect width="24" height="20" y="10" rx="3" fill="var(--card)" stroke="var(--accent-red)" stroke-width="1.5"/>
        <path d="M 6 10 L 6 6 C 6 2.5 18 2.5 18 6 L 18 10" fill="none" stroke="var(--accent-red)" stroke-width="1.8"/>
        <circle cx="12" cy="19" r="1.5" fill="var(--accent-red)"/>
      </g>
      <text x="16" y="126" class="font-sans" font-size="9.5" font-weight="700" fill="var(--accent-red)" text-anchor="middle">AIR GAP</text>
    </g>

    <!-- Cloud LLM -->
    <g transform="translate(230, 86)">
      <rect width="140" height="110" rx="8" fill="var(--surface-tint)" stroke="var(--card-border)"/>
      <!-- Cloud shape -->
      <path d="M 40 45 C 30 45 25 36 32 28 C 30 18 45 14 55 20 C 62 14 78 16 80 26 C 88 28 88 42 78 45 Z" fill="var(--card)" stroke="var(--text-secondary)" stroke-width="1.2"/>
      <circle cx="50" cy="32" r="2.5" fill="var(--accent-purple)"/>
      <circle cx="60" cy="32" r="2.5" fill="var(--accent-purple)"/>
      
      <rect x="10" y="72" width="120" height="26" rx="4" fill="var(--card)" stroke="var(--card-border)"/>
      <text x="70" y="89" class="font-sans" font-size="10.5" font-weight="600" fill="var(--accent-purple)" text-anchor="middle">LLM Aislado (Web)</text>
    </g>

    <!-- Manual Flow with explicit polygon arrows (NO MARKER BUG) -->
    <g transform="translate(24, 226)">
      <rect width="346" height="135" rx="8" fill="var(--surface-tint)" stroke="var(--card-border)"/>
      <text x="16" y="24" class="font-sans" font-size="11" font-weight="700" fill="var(--text-secondary)">SOBRECARGA COGNITIVA:</text>
      
      <g transform="translate(16, 38)">
        <rect width="90" height="32" rx="5" fill="var(--card)" stroke="var(--card-border)"/>
        <text x="45" y="20" class="font-sans" font-size="10" font-weight="600" fill="var(--text-primary)" text-anchor="middle">1. Prompt web</text>

        <!-- Direct Arrow 1 -> 2 -->
        <line x1="94" y1="16" x2="114" y2="16" stroke="var(--accent-blue)" stroke-width="1.5"/>
        <polygon points="114,13 120,16 114,19" fill="#2563eb"/>

        <rect x="122" y="0" width="94" height="32" rx="5" fill="var(--card)" stroke="var(--card-border)"/>
        <text x="169" y="20" class="font-sans" font-size="10" font-weight="600" fill="var(--text-primary)" text-anchor="middle">2. Copiar código</text>

        <!-- Direct Arrow 2 -> 3 -->
        <line x1="220" y1="16" x2="240" y2="16" stroke="var(--accent-blue)" stroke-width="1.5"/>
        <polygon points="240,13 246,16 240,19" fill="#2563eb"/>

        <rect x="248" y="0" width="82" height="32" rx="5" fill="#fef2f2" stroke="var(--accent-red)"/>
        <text x="289" y="20" class="font-sans" font-size="10" font-weight="700" fill="var(--accent-red)" text-anchor="middle">3. Error linter</text>
      </g>

      <rect x="16" y="88" width="314" height="32" rx="6" fill="var(--card)" stroke="var(--card-border)"/>
      <circle cx="32" cy="104" r="4" fill="var(--accent-red)"/>
      <text x="46" y="108" class="font-sans" font-size="10.5" fill="var(--text-secondary)">Cero verificación: no corre compiladores ni tests</text>
    </g>
  </g>

  <!-- RIGHT: AGENTE EN CONSOLA (REACT MOTOR) -->
  <g transform="translate(455, 24)">
    <rect width="395" height="392" rx="12" fill="var(--card)" stroke="var(--accent-purple)" stroke-width="2" filter="url(#subtle-shadow)"/>
    
    <!-- Title Badge -->
    <rect x="20" y="18" width="130" height="24" rx="6" fill="rgba(124, 58, 237, 0.1)"/>
    <text x="85" y="34" class="font-sans" font-size="11" font-weight="700" fill="var(--accent-purple)" text-anchor="middle">AGENTE EN CONSOLA</text>
    <text x="20" y="66" class="font-sans" font-size="16" font-weight="700" fill="var(--text-primary)">Bucle ReAct y Ejecución en Vivo</text>

    <!-- Turbine / Flywheel Cycle with Direct Polygon Arrows -->
    <g transform="translate(30, 88)">
      <!-- Station 1: PERCEIVE -->
      <rect x="0" y="0" width="155" height="48" rx="8" fill="var(--surface-tint)" stroke="var(--accent-blue)" stroke-width="1.5"/>
      <text x="14" y="20" class="font-sans" font-size="10" font-weight="700" fill="var(--accent-blue)">1. PERCEIVE</text>
      <text x="14" y="36" class="font-mono" font-size="9.5" fill="var(--text-secondary)">Lee AGENTS.md y AST</text>

      <!-- Arrow 1 -> 2 -->
      <line x1="160" y1="24" x2="173" y2="24" stroke="var(--accent-purple)" stroke-width="1.8"/>
      <polygon points="173,20 179,24 173,28" fill="#7c3aed"/>

      <!-- Station 2: PLAN -->
      <rect x="180" y="0" width="155" height="48" rx="8" fill="var(--surface-tint)" stroke="var(--accent-purple)" stroke-width="1.5"/>
      <text x="194" y="20" class="font-sans" font-size="10" font-weight="700" fill="var(--accent-purple)">2. REASON / PLAN</text>
      <text x="194" y="36" class="font-mono" font-size="9.5" fill="var(--text-secondary)">Estrategia sin Scaffold</text>

      <!-- Arrow 2 -> 3 -->
      <line x1="257" y1="52" x2="257" y2="63" stroke="var(--accent-purple)" stroke-width="1.8"/>
      <polygon points="253,63 257,69 261,63" fill="#7c3aed"/>

      <!-- Station 3: ACT -->
      <rect x="180" y="70" width="155" height="48" rx="8" fill="var(--surface-tint)" stroke="var(--accent-purple)" stroke-width="1.5"/>
      <text x="194" y="90" class="font-sans" font-size="10" font-weight="700" fill="var(--accent-purple)">3. ACT (Tools)</text>
      <text x="194" y="106" class="font-mono" font-size="9.5" fill="var(--text-secondary)">diff en lib/pages/</text>

      <!-- Arrow 3 -> 4 -->
      <line x1="175" y1="94" x2="162" y2="94" stroke="var(--accent-green)" stroke-width="1.8"/>
      <polygon points="162,90 156,94 162,98" fill="#059669"/>

      <!-- Station 4: VERIFY -->
      <rect x="0" y="70" width="155" height="48" rx="8" fill="var(--surface-tint)" stroke="var(--accent-green)" stroke-width="1.5"/>
      <text x="14" y="90" class="font-sans" font-size="10" font-weight="700" fill="var(--accent-green)">4. VERIFY</text>
      <text x="14" y="106" class="font-mono" font-size="9.5" fill="var(--text-secondary)">flutter analyze</text>

      <!-- Loop Arrow: 4 back up to 1 -->
      <line x1="77" y1="66" x2="77" y2="55" stroke="var(--accent-green)" stroke-width="1.8"/>
      <polygon points="73,55 77,49 81,55" fill="#059669"/>
      
      <rect x="62" y="52" width="30" height="15" rx="3" fill="var(--card)" stroke="var(--accent-green)"/>
      <text x="77" y="63" class="font-mono" font-size="8.5" font-weight="700" fill="var(--accent-green)" text-anchor="middle">LOOP</text>
    </g>

    <!-- Operating Terminal Visual -->
    <g transform="translate(24, 226)">
      <rect width="346" height="135" rx="8" fill="var(--terminal-bg)"/>
      
      <circle cx="16" cy="16" r="3.5" fill="#ef4444"/>
      <circle cx="26" cy="16" r="3.5" fill="#f59e0b"/>
      <circle cx="36" cy="16" r="3.5" fill="#10b981"/>
      <text x="52" y="19" class="font-mono" font-size="9" fill="var(--text-secondary)">agy / opencode runtime</text>

      <text x="16" y="44" class="font-mono" font-size="10.5" fill="#38bdf8">$ agy &gt; flutter analyze</text>
      <text x="16" y="64" class="font-mono" font-size="10" fill="#4ade80">[OK] 0 errors - StatelessWidget verificado</text>
      <text x="16" y="84" class="font-mono" font-size="10" fill="var(--terminal-text)">Auto-patch: RenderFlex resuelto con SingleChildScrollView</text>

      <rect x="14" y="98" width="318" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="173" y="114" class="font-sans" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Bucle Cerrado: Cero intervencion manual en sintaxis</text>
    </g>
  </g>
</svg>
