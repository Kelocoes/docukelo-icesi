<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background container -->
  <rect width="800" height="360" rx="16" fill="#f8fafc"/>

  <!-- Panel Izquierdo: Imperativo -->
  <g transform="translate(30, 25)">
    <rect width="350" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect width="350" height="48" rx="12" fill="#f1f5f9"/>
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 48 L 0 48 Z" fill="#f1f5f9"/>
    <circle cx="28" cy="24" r="10" fill="#ef4444" opacity="0.15"/>
    <text x="28" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">1</text>
    <text x="48" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Enfoque Imperativo (JavaFX)</text>
    <text x="48" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Mutación manual paso a paso</text>

    <!-- Step 1: Evento -->
    <rect x="25" y="70" width="300" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="40" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">1. Evento de usuario (Click)</text>

    <!-- Arrow -->
    <line x1="175" y1="114" x2="175" y2="136" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- Step 2: Código del programador -->
    <rect x="25" y="142" width="300" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="40" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">2. Buscar nodo y mutar:</text>
    <text x="40" y="186" font-family="monospace" font-size="12" fill="#2563eb">label.setText("Contador: 1");</text>

    <!-- Arrow -->
    <line x1="175" y1="202" x2="175" y2="224" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- Step 3: Mutación en pantalla -->
    <rect x="25" y="230" width="300" height="54" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="40" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">3. Interfaz modificada directamente</text>
    <text x="40" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7f1d1d">Riesgo de desincronización con el estado</text>
  </g>

  <!-- Panel Derecho: Declarativo -->
  <g transform="translate(420, 25)">
    <rect width="350" height="310" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 48 L 0 48 Z" fill="#f0fdf4"/>
    <circle cx="28" cy="24" r="10" fill="#16a34a" opacity="0.15"/>
    <text x="28" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">2</text>
    <text x="48" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#14532d">Enfoque Declarativo (Flutter)</text>
    <text x="48" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#16a34a">UI = f(estado)</text>

    <!-- Step 1: Modificación de estado -->
    <rect x="25" y="70" width="300" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="40" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#334155">1. Cambia el estado (Datos):</text>
    <text x="40" y="110" font-family="monospace" font-size="12" fill="#0f766e">setState(() => _contador++);</text>

    <!-- Arrow -->
    <line x1="175" y1="120" x2="175" y2="144" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Step 2: Framework reconstruye -->
    <rect x="25" y="150" width="300" height="50" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="40" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#166534">2. Flutter ejecuta Widget build():</text>
    <text x="40" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#15803d">Calcula el nuevo árbol de widgets</text>

    <!-- Arrow -->
    <line x1="175" y1="200" x2="175" y2="224" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Step 3: Renderizado Automático -->
    <rect x="25" y="230" width="300" height="54" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
    <text x="40" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#14532d">3. Pantalla redibujada automáticamente</text>
    <text x="40" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#15803d">Garantía total de sincronía UI-Estado</text>
  </g>
</svg>
