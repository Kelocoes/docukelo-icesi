<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="440" rx="16" fill="#f8fafc"/>

  <!-- Left: Correct Pattern (Screen con Scaffold + Page interna) -->
  <g transform="translate(30, 25)">
    <rect width="375" height="390" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
    
    <!-- Header -->
    <path d="M 0 14 Q 0 0 14 0 L 361 0 Q 375 0 375 14 L 375 48 L 0 48 Z" fill="#ecfdf5"/>
    <circle cx="26" cy="24" r="10" fill="#10b981"/>
    <path d="M 21 24 L 25 28 L 32 20" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#065f46">Regla de Oro: Arquitectura Limpia</text>

    <!-- Outer Scaffold Box (Screen) -->
    <g transform="translate(20, 60)">
      <rect width="335" height="275" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
      <rect x="10" y="-10" width="160" height="20" rx="4" fill="#475569"/>
      <text x="90" y="4" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Screen (Un solo Scaffold)</text>

      <!-- AppBar -->
      <rect x="15" y="20" width="305" height="38" rx="6" fill="#6750a4"/>
      <text x="30" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">AppBar (Marco Global &amp; TabBar)</text>

      <!-- Body / Page Area -->
      <g transform="translate(15, 66)">
        <rect width="305" height="150" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
        <rect x="8" y="-9" width="135" height="18" rx="4" fill="#4f46e5"/>
        <text x="75.5" y="3.5" font-family="monospace" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">body: Page (Sin Scaffold)</text>

        <!-- Page Internal Content -->
        <rect x="15" y="18" width="275" height="28" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
        <text x="25" y="36" font-family="monospace" font-size="11" fill="#3730a3">SafeArea &gt; Column</text>

        <rect x="15" y="52" width="275" height="38" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
        <text x="25" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4338ca">Widgets Propios (Cards, Badges)</text>

        <rect x="15" y="96" width="275" height="40" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
        <text x="25" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4338ca">Expanded / Scrollable View</text>
      </g>

      <!-- Bottom Bar -->
      <rect x="15" y="224" width="305" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="167.5" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">BottomNavigationBar / FAB</text>
    </g>

    <!-- Footer Tag -->
    <rect x="20" y="348" width="335" height="28" rx="6" fill="#d1fae5"/>
    <text x="187.5" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#065f46" text-anchor="middle">1 Pantalla = 1 Scaffold • Cero conflictos</text>
  </g>

  <!-- Right: Anti-pattern (Scaffolds anidados) -->
  <g transform="translate(435, 25)">
    <rect width="375" height="390" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)"/>
    
    <!-- Header -->
    <path d="M 0 14 Q 0 0 14 0 L 361 0 Q 375 0 375 14 L 375 48 L 0 48 Z" fill="#fef2f2"/>
    <circle cx="26" cy="24" r="10" fill="#ef4444"/>
    <path d="M 20 20 L 32 28 M 32 20 L 20 28" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="46" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Antipatrón: Scaffolds Anidados</text>

    <!-- Outer Scaffold -->
    <g transform="translate(20, 60)">
      <rect width="335" height="275" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
      <rect x="10" y="-10" width="140" height="20" rx="4" fill="#dc2626"/>
      <text x="80" y="4" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Scaffold Externo</text>

      <rect x="15" y="16" width="305" height="30" rx="4" fill="#6750a4"/>
      <text x="25" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ffffff">AppBar Exterior</text>

      <!-- Inner Nested Scaffold -->
      <g transform="translate(15, 54)">
        <rect width="305" height="195" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
        <rect x="10" y="-9" width="165" height="18" rx="4" fill="#ef4444"/>
        <text x="92.5" y="3.5" font-family="monospace" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Page &gt; Scaffold (¡ERROR!)</text>

        <!-- Nested AppBar conflict -->
        <rect x="15" y="16" width="275" height="30" rx="4" fill="#f87171"/>
        <text x="25" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">Doble AppBar (Desperdicio de espacio)</text>

        <!-- Conflict warnings -->
        <g transform="translate(15, 54)">
          <rect width="275" height="36" rx="4" fill="#ffffff" stroke="#fca5a5"/>
          <circle cx="16" cy="18" r="6" fill="#ef4444"/>
          <text x="30" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">Bug de Teclado:</text>
          <text x="30" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#7f1d1d">Doble resizeToAvoidBottomInset tapa inputs</text>
        </g>

        <g transform="translate(15, 96)">
          <rect width="275" height="36" rx="4" fill="#ffffff" stroke="#fca5a5"/>
          <circle cx="16" cy="18" r="6" fill="#ef4444"/>
          <text x="30" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">Conflicto con SnackBar:</text>
          <text x="30" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#7f1d1d">Se oculta tras la barra o rompe el contexto</text>
        </g>
      </g>
    </g>

    <!-- Footer Tag -->
    <rect x="20" y="348" width="335" height="28" rx="6" fill="#fee2e2"/>
    <text x="187.5" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">Nunca devuelvas un Scaffold dentro de una Page</text>
  </g>
</svg>
