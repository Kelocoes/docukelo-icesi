<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="100%" height="100%">
  <defs>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="430" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Catálogo Visual: Widgets Básicos de Interfaz en Flutter</text>
  <text x="40" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Componentes primitivos esenciales para presentar texto, multimedia y permitir interacción</text>

  <!-- Card 1: Text & TextStyle -->
  <g transform="translate(40, 80)">
    <rect width="230" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#box-shadow)"/>
    <rect width="230" height="40" rx="12" fill="#f1f5f9"/>
    <path d="M 0 12 Q 0 0 12 0 L 218 0 Q 230 0 230 12 L 230 40 L 0 40 Z" fill="#f1f5f9"/>
    <text x="16" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">1. Text &amp; TextStyle</text>

    <!-- Visual Sample -->
    <rect x="18" y="55" width="194" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="28" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">DocuKelo Icesi</text>
    <text x="28" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" fill="#2563eb">Desarrollo Frontend</text>
    <text x="28" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Texto estilizado con tipografía y color</text>

    <!-- Code Sample -->
    <rect x="18" y="160" width="194" height="110" rx="8" fill="#0f172a"/>
    <text x="28" y="182" font-family="monospace" font-size="10.5" fill="#38bdf8">Text(</text>
    <text x="36" y="200" font-family="monospace" font-size="10" fill="#a7f3d0">'DocuKelo Icesi',</text>
    <text x="36" y="218" font-family="monospace" font-size="10" fill="#e2e8f0">style: TextStyle(</text>
    <text x="44" y="234" font-family="monospace" font-size="10" fill="#cbd5e1">fontSize: 18,</text>
    <text x="44" y="250" font-family="monospace" font-size="10" fill="#cbd5e1">fontWeight: bold,</text>
    <text x="28" y="264" font-family="monospace" font-size="10.5" fill="#38bdf8">))</text>

    <text x="18" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748b">Propiedades: color, maxLines, overflow</text>
  </g>

  <!-- Card 2: Image (Asset & Network) -->
  <g transform="translate(305, 80)">
    <rect width="230" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#box-shadow)"/>
    <rect width="230" height="40" rx="12" fill="#f1f5f9"/>
    <path d="M 0 12 Q 0 0 12 0 L 218 0 Q 230 0 230 12 L 230 40 L 0 40 Z" fill="#f1f5f9"/>
    <text x="16" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">2. Image (Asset / Network)</text>

    <!-- Visual Sample -->
    <rect x="18" y="55" width="194" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="30" y="66" width="68" height="68" rx="6" fill="#3b82f6" opacity="0.15"/>
    <circle cx="50" cy="88" r="8" fill="#3b82f6"/>
    <path d="M 36 126 L 56 102 L 72 118 L 88 96 L 94 126 Z" fill="#2563eb" opacity="0.7"/>
    
    <text x="108" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Asset</text>
    <text x="108" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Empaquetada local</text>
    <text x="108" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Network</text>
    <text x="108" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Descarga vía URL</text>

    <!-- Code Sample -->
    <rect x="18" y="160" width="194" height="110" rx="8" fill="#0f172a"/>
    <text x="28" y="180" font-family="monospace" font-size="10" fill="#94a3b8">// Local (pubspec.yaml):</text>
    <text x="28" y="196" font-family="monospace" font-size="10" fill="#38bdf8">Image.asset(</text>
    <text x="36" y="210" font-family="monospace" font-size="9.5" fill="#a7f3d0">'assets/logo.png')</text>
    <text x="28" y="230" font-family="monospace" font-size="10" fill="#94a3b8">// En la nube / API:</text>
    <text x="28" y="246" font-family="monospace" font-size="10" fill="#38bdf8">Image.network(</text>
    <text x="36" y="260" font-family="monospace" font-size="9.5" fill="#a7f3d0">'https://.../pic.jpg')</text>

    <text x="18" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748b">Ajuste con BoxFit: cover, contain, fitWidth</text>
  </g>

  <!-- Card 3: Botones (Elevated, Outlined, Text) -->
  <g transform="translate(570, 80)">
    <rect width="230" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#box-shadow)"/>
    <rect width="230" height="40" rx="12" fill="#f1f5f9"/>
    <path d="M 0 12 Q 0 0 12 0 L 218 0 Q 230 0 230 12 L 230 40 L 0 40 Z" fill="#f1f5f9"/>
    <text x="16" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e293b">3. Botones Material 3</text>

    <!-- Visual Sample -->
    <rect x="18" y="55" width="194" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    
    <!-- Elevated -->
    <rect x="26" y="62" width="86" height="24" rx="12" fill="#2563eb"/>
    <text x="69" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Elevated</text>

    <!-- Outlined -->
    <rect x="120" y="62" width="84" height="24" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="162" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="middle">Outlined</text>

    <!-- TextButton -->
    <text x="69" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">TextButton</text>

    <!-- IconButton -->
    <circle cx="162" cy="107" r="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <path d="M 157 107 L 167 107 M 162 102 L 162 112" stroke="#2563eb" stroke-width="2"/>

    <!-- Code Sample -->
    <rect x="18" y="160" width="194" height="110" rx="8" fill="#0f172a"/>
    <text x="28" y="180" font-family="monospace" font-size="10" fill="#38bdf8">ElevatedButton(</text>
    <text x="36" y="196" font-family="monospace" font-size="10" fill="#e2e8f0">onPressed: () {</text>
    <text x="44" y="212" font-family="monospace" font-size="9.5" fill="#64748b">  print('Click!');</text>
    <text x="36" y="228" font-family="monospace" font-size="10" fill="#e2e8f0">},</text>
    <text x="36" y="246" font-family="monospace" font-size="10" fill="#e2e8f0">child: Text(</text>
    <text x="44" y="260" font-family="monospace" font-size="9.5" fill="#a7f3d0">'Confirmar'),</text>
    <text x="28" y="264" font-family="monospace" font-size="10" fill="#38bdf8">)</text>

    <text x="18" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748b">Evento onPressed obligatorio o null (disable)</text>
  </g>
</svg>
