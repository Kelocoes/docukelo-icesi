<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%">
  <defs>
    <filter id="shadow-main" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="840" height="450" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Main Title -->
  <text x="40" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Anatomía del Punto de Entrada: main.dart</text>
  <text x="40" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">De la función main() al árbol de widgets raíz y la pantalla principal</text>

  <!-- Step 1: void main() -->
  <g transform="translate(40, 80)">
    <rect width="760" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-main)"/>
    <rect width="8" height="75" rx="4" fill="#6366f1"/>
    
    <rect x="24" y="16" width="34" height="42" rx="6" fill="#e0e7ff"/>
    <text x="41" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#4338ca" text-anchor="middle">1</text>

    <text x="70" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Punto de Entrada en Dart: void main()</text>
    <text x="70" y="54" font-family="monospace" font-size="12.5" fill="#4338ca">void main() => runApp(const MyApp());</text>

    <text x="480" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">Arranca el motor de Flutter, inicializa</text>
    <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">el pipeline de renderizado y monta el widget raíz.</text>
  </g>

  <!-- Connection Arrow 1 to 2 (Separación amplia de 35px) -->
  <line x1="420" y1="155" x2="420" y2="188" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 2: MyApp (MaterialApp) -->
  <g transform="translate(40, 195)">
    <rect width="760" height="95" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-main)"/>
    <rect width="8" height="95" rx="4" fill="#3b82f6"/>

    <rect x="24" y="26" width="34" height="42" rx="6" fill="#eff6ff"/>
    <text x="41" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2</text>

    <text x="70" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Widget Raíz: class MyApp extends StatelessWidget</text>
    <text x="70" y="54" font-family="monospace" font-size="11.5" fill="#0369a1">return MaterialApp(title: 'App', theme: ..., home: const HomePage());</text>
    <text x="70" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">Configuración global: Sistema de Diseño (Material 3), temas (colores, fuentes) y ruteador.</text>
  </g>

  <!-- Connection Arrow 2 to 3 (Separación amplia de 35px) -->
  <line x1="420" y1="290" x2="420" y2="323" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 3: HomePage (Scaffold) -->
  <g transform="translate(40, 330)">
    <rect width="760" height="85" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow-main)"/>
    <rect width="8" height="85" rx="4" fill="#10b981"/>

    <rect x="24" y="21" width="34" height="42" rx="6" fill="#f0fdf4"/>
    <text x="41" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#047857" text-anchor="middle">3</text>

    <text x="70" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#047857">Pantalla Principal: HomePage (lib/pages/home_page.dart)</text>
    <text x="70" y="52" font-family="monospace" font-size="11.5" fill="#0f766e">return Scaffold(appBar: AppBar(...), body: ...);</text>
    <text x="70" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">Estructura visual de la pantalla: barra superior, cuerpo con widgets y botones de interacción.</text>
  </g>
</svg>
