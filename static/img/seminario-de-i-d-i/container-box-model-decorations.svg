<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="100%" height="100%">
  <defs>
    <filter id="shadow-boxm" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="430" rx="16" fill="#f8fafc"/>

  <!-- Panel Izquierdo: Modelo de Caja del Container -->
  <g transform="translate(30, 25)">
    <rect width="395" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-boxm)"/>

    <!-- Header -->
    <path d="M 0 14 Q 0 0 14 0 L 381 0 Q 395 0 395 14 L 395 48 L 0 48 Z" fill="#f1f5f9"/>
    <text x="24" y="29" font-family="monospace" font-size="15" font-weight="700" fill="#1e293b">Container() Box Model</text>
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Capas concéntricas de dimensiones y estilo</text>

    <!-- Concentric Nested Boxes -->
    <g transform="translate(24, 64)">
      <!-- Layer 1: Margin -->
      <rect width="347" height="235" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="14" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#b45309">margin: EdgeInsets</text>

      <!-- Layer 2: Border / BoxDecoration -->
      <g transform="translate(18, 28)">
        <rect width="311" height="188" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
        <text x="14" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#6d28d9">decoration: BoxDecoration(border, radius, shadow)</text>

        <!-- Layer 3: Padding -->
        <g transform="translate(16, 28)">
          <rect width="279" height="142" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
          <text x="14" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#047857">padding: EdgeInsets</text>

          <!-- Layer 4: Child Widget Content -->
          <g transform="translate(16, 28)">
            <rect width="247" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
            <text x="123.5" y="44" font-family="monospace" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">child: Widget</text>
            <text x="123.5" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(Text, Column, Row, Image...)</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Footer Note -->
    <g transform="translate(24, 320)">
      <rect width="347" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">
        Si solo necesitas separación interior, usa <tspan font-family="monospace" font-weight="bold" fill="#047857">Padding</tspan> (más liviano).
      </text>
    </g>
  </g>

  <!-- Panel Derecho: La Regla de Oro de BoxDecoration -->
  <g transform="translate(445, 25)">
    <rect width="365" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-boxm)"/>

    <!-- Header -->
    <path d="M 0 14 Q 0 0 14 0 L 351 0 Q 365 0 365 14 L 365 48 L 0 48 Z" fill="#fee2e2"/>
    <text x="24" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#991b1b">¡Peligro!: Regla de BoxDecoration</text>
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#b91c1c">Error de aserción en tiempo de ejecución</text>

    <!-- Error Scenario -->
    <g transform="translate(20, 64)">
      <rect width="325" height="125" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="20" cy="22" r="10" fill="#ef4444"/>
      <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✕</text>
      <text x="38" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Código que detona error fatal</text>

      <rect x="14" y="40" width="297" height="72" rx="6" fill="#1e293b"/>
      <text x="24" y="60" font-family="monospace" font-size="10.5" fill="#f87171">Container(</text>
      <text x="36" y="76" font-family="monospace" font-size="10.5" fill="#f87171">  color: Colors.blue, // &lt;-- ¡ERROR!</text>
      <text x="36" y="92" font-family="monospace" font-size="10.5" fill="#e2e8f0">  decoration: BoxDecoration(...),</text>
      <text x="24" y="104" font-family="monospace" font-size="10.5" fill="#f87171">)</text>
    </g>

    <!-- Correct Scenario -->
    <g transform="translate(20, 205)">
      <rect width="325" height="155" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="20" cy="22" r="10" fill="#10b981"/>
      <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="38" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#166534">Solución correcta (color adentro)</text>

      <rect x="14" y="40" width="297" height="102" rx="6" fill="#1e293b"/>
      <text x="24" y="60" font-family="monospace" font-size="10.5" fill="#a7f3d0">Container(</text>
      <text x="36" y="76" font-family="monospace" font-size="10.5" fill="#a7f3d0">  decoration: BoxDecoration(</text>
      <text x="48" y="94" font-family="monospace" font-size="10.5" fill="#34d399">    color: Colors.blue, // ✓ Correcto</text>
      <text x="48" y="110" font-family="monospace" font-size="10.5" fill="#94a3b8">    borderRadius: BorderRadius.circular(16),</text>
      <text x="36" y="126" font-family="monospace" font-size="10.5" fill="#a7f3d0">  ),</text>
      <text x="24" y="136" font-family="monospace" font-size="10.5" fill="#a7f3d0">)</text>
    </g>
  </g>
</svg>
