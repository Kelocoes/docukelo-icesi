<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas (Ensures full contrast in light and dark mode) -->
  <rect width="800" height="240" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Pill -->
  <g transform="translate(250, 18)">
    <rect width="300" height="38" rx="19" fill="#1e293b"/>
    <text x="150" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
      Evolución de Enfoques Frontend
    </text>
  </g>

  <!-- Connecting Line -->
  <line x1="100" y1="80" x2="700" y2="80" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Card 1: Nativo Separado -->
  <g transform="translate(30, 70)">
    <rect width="170" height="145" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" filter="url(#card-shadow)"/>
    <circle cx="85" cy="30" r="16" fill="#fee2e2"/>
    <text x="85" y="35" font-family="system-ui, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">📱 📱</text>
    <text x="85" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">1. Nativo Puro</text>
    <text x="85" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Kotlin + Swift</text>
    <rect x="20" y="102" width="130" height="28" rx="6" fill="#fef2f2"/>
    <text x="85" y="120" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#b91c1c" text-anchor="middle">2 bases de código</text>
  </g>

  <!-- Card 2: Híbrido WebView -->
  <g transform="translate(220, 70)">
    <rect width="170" height="145" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#card-shadow)"/>
    <circle cx="85" cy="30" r="16" fill="#fef3c7"/>
    <text x="85" y="35" font-family="system-ui, sans-serif" font-size="14" fill="#d97706" text-anchor="middle">🌐</text>
    <text x="85" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">2. Híbrido WebView</text>
    <text x="85" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Ionic / Capacitor</text>
    <rect x="20" y="102" width="130" height="28" rx="6" fill="#fffbeb"/>
    <text x="85" y="120" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#b45309" text-anchor="middle">Web en app nativa</text>
  </g>

  <!-- Card 3: Puente Interpretado -->
  <g transform="translate(410, 70)">
    <rect width="170" height="145" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#card-shadow)"/>
    <circle cx="85" cy="30" r="16" fill="#dbeafe"/>
    <text x="85" y="35" font-family="system-ui, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">⚛️</text>
    <text x="85" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">3. Puente JS (Bridge)</text>
    <text x="85" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">React Native</text>
    <rect x="20" y="102" width="130" height="28" rx="6" fill="#eff6ff"/>
    <text x="85" y="120" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">Widgets nativos vía JS</text>
  </g>

  <!-- Card 4: Motor Propio -->
  <g transform="translate(600, 70)">
    <rect width="170" height="145" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/>
    <circle cx="85" cy="30" r="16" fill="#dcfce7"/>
    <text x="85" y="35" font-family="system-ui, sans-serif" font-size="14" fill="#16a34a" text-anchor="middle">🎨</text>
    <text x="85" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">4. Motor Propio</text>
    <text x="85" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Flutter (Impeller)</text>
    <rect x="20" y="102" width="130" height="28" rx="6" fill="#f0fdf4"/>
    <text x="85" y="120" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">Píxeles directos a GPU</text>
  </g>
</svg>
