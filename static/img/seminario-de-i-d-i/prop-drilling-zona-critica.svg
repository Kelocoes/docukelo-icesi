<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .tag   { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #1e293b; }
      .sub   { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; }
    </style>
    <filter id="shadow-clean" x="-5%" y="-5%" width="110%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="880" height="260" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title & Tag -->
  <g transform="translate(32, 22)">
    <rect x="0" y="0" width="220" height="20" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="110" y="14" class="tag" fill="#dc2626" text-anchor="middle">ZONA CRITICA: PROP DRILLING DOLOROSO</text>
    <text x="0" y="42" class="title">Widgets Pasamanos: Transportan datos ajenos y multiplican el acoplamiento</text>
  </g>

  <!-- Connectors -->
  <line x1="195" y1="145" x2="255" y2="145" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <line x1="420" y1="145" x2="480" y2="145" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <line x1="645" y1="145" x2="705" y2="145" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>

  <!-- NODE 1: Source (Root) -->
  <g transform="translate(35, 95)" filter="url(#shadow-clean)">
    <rect width="160" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="34" class="label" fill="#1e3a8a" text-anchor="middle">RootScreen</text>
    <rect x="15" y="46" width="130" height="20" rx="4" fill="#dbeafe"/>
    <text x="80" y="60" class="mono" fill="#1d4ed8" text-anchor="middle">userRole = 'admin'</text>
    <text x="80" y="82" class="sub" text-anchor="middle">Posee el dato</text>
  </g>

  <!-- NODE 2: Intermediary 1 (Pasamanos) -->
  <g transform="translate(260, 95)" filter="url(#shadow-clean)">
    <rect width="160" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="80" y="34" class="label" fill="#475569" text-anchor="middle">DashboardShell</text>
    <rect x="15" y="46" width="130" height="20" rx="4" fill="#fee2e2"/>
    <text x="80" y="60" class="mono" fill="#b91c1c" text-anchor="middle">Solo reenvia userRole</text>
    <text x="80" y="82" class="sub" fill="#dc2626" text-anchor="middle">No usa el dato</text>
  </g>

  <!-- NODE 3: Intermediary 2 (Pasamanos) -->
  <g transform="translate(485, 95)" filter="url(#shadow-clean)">
    <rect width="160" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="80" y="34" class="label" fill="#475569" text-anchor="middle">SectionTabBody</text>
    <rect x="15" y="46" width="130" height="20" rx="4" fill="#fee2e2"/>
    <text x="80" y="60" class="mono" fill="#b91c1c" text-anchor="middle">Solo reenvia userRole</text>
    <text x="80" y="82" class="sub" fill="#dc2626" text-anchor="middle">Constructor inflado</text>
  </g>

  <!-- NODE 4: Target Consumer -->
  <g transform="translate(710, 95)" filter="url(#shadow-clean)">
    <rect width="140" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="70" y="34" class="label" fill="#991b1b" text-anchor="middle">RoleBadge</text>
    <rect x="12" y="46" width="116" height="20" rx="4" fill="#fee2e2"/>
    <text x="70" y="60" class="mono" fill="#b91c1c" text-anchor="middle">¡Lo necesita!</text>
    <text x="70" y="82" class="sub" text-anchor="middle">Consumidor real</text>
  </g>

  <!-- Bottom Insight Badge -->
  <g transform="translate(35, 215)">
    <text x="0" y="16" class="sub" fill="#b91c1c" font-weight="600">⚠ Friccion arquitectonica: Modificar 1 parametro obliga a cambiar 3 constructores intermedios. Senal para migrar a Riverpod o Provider.</text>
  </g>
</svg>
