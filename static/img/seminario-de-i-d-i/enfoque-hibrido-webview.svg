<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" width="100%" height="100%">
  <defs>
    <filter id="shadow-web" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="740" height="230" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Main Container -->
  <g transform="translate(60, 25)">
    <!-- Native App Wrapper Shell -->
    <rect width="620" height="135" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow-web)"/>
    <rect width="620" height="30" rx="12" fill="#fef3c7"/>
    <text x="310" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">
      Contenedor Nativo de la Aplicación (iOS / Android)
    </text>

    <!-- Inside: WebView Container -->
    <rect x="25" y="45" width="360" height="75" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="205" y="68" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Navegador Interno (WebView)</text>
    <rect x="45" y="78" width="320" height="28" rx="5" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="205" y="96" font-family="monospace" font-size="11" fill="#2563eb" text-anchor="middle">HTML5 + CSS3 + JavaScript / SPA</text>

    <!-- Bridge -->
    <g transform="translate(395, 55)">
      <rect width="70" height="55" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="2 2"/>
      <text x="35" y="24" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">Puente</text>
      <text x="35" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Plugins</text>
      <text x="35" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">⇄</text>
    </g>

    <!-- Hardware / Native APIs -->
    <rect x="475" y="45" width="120" height="75" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="535" y="68" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">APIs Nativas</text>
    <text x="535" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Cámara, GPS</text>
    <text x="535" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Almacenamiento</text>
  </g>

  <!-- Bottom Note -->
  <g transform="translate(130, 178)">
    <rect width="480" height="36" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="240" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">
      Ventaja: Desarrollo web estándar. Limitación: Rendimiento y fluidez en animaciones
    </text>
  </g>
</svg>
