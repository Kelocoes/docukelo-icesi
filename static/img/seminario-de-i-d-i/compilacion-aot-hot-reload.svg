<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <filter id="shadow-exec" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="16" fill="#f8fafc"/>

  <!-- Panel Izquierdo: JVM -->
  <g transform="translate(30, 25)">
    <rect width="350" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-exec)"/>
    
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 48 L 0 48 Z" fill="#f1f5f9"/>
    <text x="24" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Modelo de Ejecución en Java (JVM)</text>
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Capa intermedia de bytecode</text>

    <!-- Pipeline Flow -->
    <g transform="translate(25, 65)">
      <!-- Stage 1 -->
      <rect x="0" y="0" width="300" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="150" y="26" font-family="monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Código Fuente (.java)</text>

      <line x1="150" y1="42" x2="150" y2="60" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-flow)"/>

      <!-- Stage 2 -->
      <rect x="0" y="62" width="300" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
      <text x="150" y="88" font-family="monospace" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Bytecode (.class / javac)</text>

      <line x1="150" y1="104" x2="150" y2="122" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-flow)"/>

      <!-- Stage 3 -->
      <rect x="0" y="124" width="300" height="48" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
      <text x="150" y="146" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Java Virtual Machine (JVM)</text>
      <text x="150" y="162" font-family="system-ui, sans-serif" font-size="11" fill="#b45309" text-anchor="middle">Intérprete + Compilador JIT en Runtime</text>

      <line x1="150" y1="172" x2="150" y2="190" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-flow)"/>

      <!-- Stage 4 -->
      <rect x="0" y="192" width="300" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="150" y="216" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Sistema Operativo / Hardware</text>
    </g>
  </g>

  <!-- Panel Derecho: Flutter Dual Engine -->
  <g transform="translate(420, 25)">
    <rect width="350" height="310" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow-exec)"/>
    
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 48 L 0 48 Z" fill="#f0fdf4"/>
    <text x="24" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#14532d">Modelo Dual de Flutter (Dart)</text>
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#16a34a">AOT en Release + JIT con Hot Reload en Debug</text>

    <!-- Content Split -->
    <g transform="translate(20, 62)">
      <!-- Box 1: Release / AOT -->
      <rect x="0" y="0" width="310" height="100" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">Producción: Compilación AOT</text>
      <text x="16" y="44" font-family="monospace" font-size="11" fill="#14532d">Dart → Código Máquina Nativo (ARM/x86)</text>
      <rect x="16" y="56" width="278" height="32" rx="6" fill="#dcfce7"/>
      <text x="155" y="77" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Dibujo directo a GPU (Impeller) a 60/120 fps</text>

      <!-- Box 2: Debug / Hot Reload -->
      <rect x="0" y="112" width="310" height="118" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
      <text x="16" y="136" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">Desarrollo: Stateful Hot Reload (JIT)</text>
      <text x="16" y="156" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">Inyección incremental de código en &lt; 1 segundo</text>
      <rect x="16" y="168" width="278" height="48" rx="6" fill="#fef3c7"/>
      <text x="155" y="188" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Preserva el estado de la UI (formularios/tabs)</text>
      <text x="155" y="204" font-family="system-ui, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">Iteración ultrarrápida sin reiniciar la aplicación</text>
    </g>
  </g>
</svg>
