<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .sub   { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .tag   { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .card-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #1e293b; }
      .meta  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; }
    </style>
    <filter id="shadow-clean" x="-5%" y="-5%" width="110%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Canvas (880x440) -->
  <rect width="880" height="440" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(35, 26)">
    <rect x="0" y="0" width="150" height="20" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="75" y="14" class="tag" fill="#059669" text-anchor="middle">PARADIGMAS</text>
    <text x="0" y="44" class="title">API vs. Skill vs. Protocolo MCP</text>
    <text x="0" y="62" class="sub">Comparativa técnica para conectar software, conocimiento procedimental y herramientas vivas</text>
  </g>

  <!-- 3 COLUMNS COMPARISON -->

  <!-- COL 1: API TRADICIONAL -->
  <g transform="translate(35, 110)">
    <rect width="250" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-clean)"/>
    <rect x="16" y="16" width="80" height="20" rx="5" fill="#f1f5f9"/>
    <text x="56" y="30" class="tag" fill="#64748b" text-anchor="middle">ESTÁTICO</text>
    
    <text x="16" y="58" class="card-title">1. API Tradicional</text>
    <text x="16" y="75" class="meta" fill="#64748b">REST / GraphQL</text>

    <!-- Visual Metaphor: Rigid Point-to-Point Pipe -->
    <g transform="translate(25, 95)">
      <!-- App Node -->
      <rect x="0" y="20" width="50" height="42" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="25" y="45" class="meta" fill="#475569" text-anchor="middle">App</text>

      <!-- Rigid Pipe -->
      <rect x="50" y="35" width="100" height="12" fill="#cbd5e1"/>
      <circle cx="100" cy="41" r="8" fill="#94a3b8"/>
      <line x1="97" y1="41" x2="103" y2="41" stroke="#ffffff" stroke-width="2"/>

      <!-- Server Node -->
      <rect x="150" y="20" width="50" height="42" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="175" y="45" class="meta" fill="#475569" text-anchor="middle">API</text>
    </g>

    <!-- Tech Chips -->
    <rect x="16" y="195" width="218" height="26" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="125" y="212" class="meta" fill="#64748b" text-anchor="middle">HTTP POST /users</text>
    
    <rect x="16" y="235" width="218" height="44" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="125" y="254" class="label" fill="#991b1b" text-anchor="middle">Sin Introspección</text>
    <text x="125" y="269" class="sub" fill="#b91c1c" text-anchor="middle">El LLM no conoce rutas</text>
  </g>

  <!-- COL 2: SKILL DE AGENTE -->
  <g transform="translate(315, 110)">
    <rect width="250" height="290" rx="12" fill="#ffffff" stroke="#865cf0" stroke-width="1.8" filter="url(#shadow-clean)"/>
    <rect x="16" y="16" width="80" height="20" rx="5" fill="#faf5ff"/>
    <text x="56" y="30" class="tag" fill="#7c3aed" text-anchor="middle">MEMORIA</text>
    
    <text x="16" y="58" class="card-title">2. Skill Agéntica</text>
    <text x="16" y="75" class="meta" fill="#7c3aed">SKILL.md • Prompts</text>

    <!-- Visual Metaphor: Injected Rules Capsule -->
    <g transform="translate(35, 95)">
      <rect x="0" y="5" width="180" height="74" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
      
      <!-- Inside capsule -->
      <rect x="15" y="18" width="150" height="46" rx="6" fill="#865cf0"/>
      <circle cx="36" cy="41" r="10" fill="#a78bfa"/>
      <path d="M 32 41 L 40 41 M 36 37 L 36 45" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <text x="56" y="37" class="meta" fill="#ffffff">REGLAS</text>
      <text x="56" y="52" class="sub" fill="#ede9fe" font-size="10px">Heurísticas</text>
    </g>

    <!-- Tech Chips -->
    <rect x="16" y="195" width="218" height="26" rx="5" fill="#faf5ff" stroke="#ddd6fe"/>
    <text x="125" y="212" class="meta" fill="#581c87" text-anchor="middle">/skill flutter-helper</text>
    
    <rect x="16" y="235" width="218" height="44" rx="6" fill="#faf5ff" stroke="#ddd6fe"/>
    <text x="125" y="254" class="label" fill="#4c1d95" text-anchor="middle">Manual de Razonamiento</text>
    <text x="125" y="269" class="sub" fill="#6d28d9" text-anchor="middle">Enseña al agente cómo actuar</text>
  </g>

  <!-- COL 3: SERVIDOR MCP -->
  <g transform="translate(595, 110)">
    <rect width="250" height="290" rx="12" fill="#ffffff" stroke="#4cb979" stroke-width="2" filter="url(#shadow-clean)"/>
    <rect x="16" y="16" width="100" height="20" rx="5" fill="#ecfdf5"/>
    <text x="66" y="30" class="tag" fill="#047857" text-anchor="middle">HERRAMIENTAS</text>
    
    <text x="16" y="58" class="card-title">3. Servidor MCP</text>
    <text x="16" y="75" class="meta" fill="#047857">JSON-RPC • tools/call</text>

    <!-- Visual Metaphor: Socket Hub with Plugs -->
    <g transform="translate(30, 95)">
      <!-- Hub -->
      <circle cx="95" cy="40" r="22" fill="#4cb979"/>
      <circle cx="95" cy="40" r="10" fill="#ffffff"/>
      <circle cx="95" cy="40" r="4" fill="#047857"/>

      <!-- Plugs -->
      <line x1="95" y1="18" x2="95" y2="-2" stroke="#4cb979" stroke-width="2.5"/>
      <rect x="75" y="-14" width="40" height="16" rx="3" fill="#0f172a"/>
      <text x="95" y="-3" class="meta" fill="#4ade80" font-size="9px" text-anchor="middle">DB</text>

      <line x1="75" y1="52" x2="45" y2="72" stroke="#4cb979" stroke-width="2.5"/>
      <rect x="25" y="68" width="40" height="16" rx="3" fill="#0f172a"/>
      <text x="45" y="79" class="meta" fill="#38bdf8" font-size="9px" text-anchor="middle">GIT</text>

      <line x1="115" y1="52" x2="145" y2="72" stroke="#4cb979" stroke-width="2.5"/>
      <rect x="125" y="68" width="40" height="16" rx="3" fill="#0f172a"/>
      <text x="145" y="79" class="meta" fill="#facc15" font-size="9px" text-anchor="middle">WEB</text>
    </g>

    <!-- Tech Chips -->
    <rect x="16" y="195" width="218" height="26" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="125" y="212" class="meta" fill="#065f46" text-anchor="middle">tools/list + tools/call</text>
    
    <rect x="16" y="235" width="218" height="44" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="125" y="254" class="label" fill="#065f46" text-anchor="middle">Enchufe Interactivo</text>
    <text x="125" y="269" class="sub" fill="#047857" text-anchor="middle">Ejecuta acciones en el mundo</text>
  </g>
</svg>
