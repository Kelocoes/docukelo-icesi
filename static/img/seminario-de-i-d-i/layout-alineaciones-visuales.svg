<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="100%" height="100%">
  <defs>
    <filter id="shadow-card" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="860" height="520" rx="16" fill="#f8fafc"/>

  <!-- ==================== SECCIÓN 1: MainAxisAlignment ==================== -->
  <g transform="translate(24, 20)">
    <rect width="812" height="260" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-card)"/>
    <path d="M 0 12 Q 0 0 12 0 L 800 0 Q 812 0 812 12 L 812 36 L 0 36 Z" fill="#f3ebf7"/>
    <text x="20" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#4f378a">MainAxisAlignment (Distribución en el Eje Principal)</text>

    <!-- Fila 1: start, center, end -->
    <!-- start -->
    <g transform="translate(20, 50)">
      <rect width="240" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="12" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#6750a4">.start</text>
      <rect x="12" y="34" width="34" height="38" rx="6" fill="#6750a4"/>
      <rect x="52" y="34" width="34" height="38" rx="6" fill="#6750a4"/>
      <rect x="92" y="34" width="34" height="38" rx="6" fill="#6750a4"/>
    </g>

    <!-- center -->
    <g transform="translate(286, 50)">
      <rect width="240" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="12" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#6750a4">.center</text>
      <rect x="63" y="34" width="34" height="38" rx="6" fill="#6750a4"/>
      <rect x="103" y="34" width="34" height="38" rx="6" fill="#6750a4"/>
      <rect x="143" y="34" width="34" height="38" rx="6" fill="#6750a4"/>
    </g>

    <!-- end -->
    <g transform="translate(552, 50)">
      <rect width="240" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="12" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#6750a4">.end</text>
      <rect x="114" y="34" width="34" height="38" rx="6" fill="#6750a4"/>
      <rect x="154" y="34" width="34" height="38" rx="6" fill="#6750a4"/>
      <rect x="194" y="34" width="34" height="38" rx="6" fill="#6750a4"/>
    </g>

    <!-- Fila 2: spaceBetween, spaceAround, spaceEvenly -->
    <!-- spaceBetween -->
    <g transform="translate(20, 150)">
      <rect width="240" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="12" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#6750a4">.spaceBetween</text>
      <rect x="12" y="36" width="34" height="38" rx="6" fill="#6750a4"/>
      <rect x="103" y="36" width="34" height="38" rx="6" fill="#6750a4"/>
      <rect x="194" y="36" width="34" height="38" rx="6" fill="#6750a4"/>
      <line x1="46" y1="55" x2="103" y2="55" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2"/>
      <line x1="137" y1="55" x2="194" y2="55" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2"/>
    </g>

    <!-- spaceAround -->
    <g transform="translate(286, 150)">
      <rect width="240" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="12" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#6750a4">.spaceAround</text>
      <rect x="24" y="36" width="34" height="38" rx="6" fill="#6750a4"/>
      <rect x="103" y="36" width="34" height="38" rx="6" fill="#6750a4"/>
      <rect x="182" y="36" width="34" height="38" rx="6" fill="#6750a4"/>
      <line x1="58" y1="55" x2="103" y2="55" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2"/>
      <line x1="137" y1="55" x2="182" y2="55" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2"/>
    </g>

    <!-- spaceEvenly -->
    <g transform="translate(552, 150)">
      <rect width="240" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="12" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#6750a4">.spaceEvenly</text>
      <rect x="30" y="36" width="34" height="38" rx="6" fill="#6750a4"/>
      <rect x="103" y="36" width="34" height="38" rx="6" fill="#6750a4"/>
      <rect x="176" y="36" width="34" height="38" rx="6" fill="#6750a4"/>
      <line x1="0" y1="55" x2="30" y2="55" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2"/>
      <line x1="64" y1="55" x2="103" y2="55" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2"/>
      <line x1="137" y1="55" x2="176" y2="55" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2"/>
      <line x1="210" y1="55" x2="240" y2="55" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2"/>
    </g>
  </g>

  <!-- ==================== SECCIÓN 2: CrossAxisAlignment & mainAxisSize ==================== -->
  <g transform="translate(24, 300)">
    <rect width="812" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-card)"/>
    <path d="M 0 12 Q 0 0 12 0 L 800 0 Q 812 0 812 12 L 812 36 L 0 36 Z" fill="#e0f2fe"/>
    <text x="20" y="24" font-family="monospace" font-size="14" font-weight="700" fill="#0369a1">CrossAxisAlignment (Alineación Transversal) &amp; mainAxisSize</text>

    <!-- cross.start -->
    <g transform="translate(20, 50)">
      <rect width="180" height="130" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="12" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#0284c7">.start</text>
      <g transform="translate(15, 32)">
        <rect x="0" y="0" width="36" height="75" rx="6" fill="#0284c7"/>
        <rect x="44" y="0" width="36" height="45" rx="6" fill="#0284c7"/>
        <rect x="88" y="0" width="36" height="60" rx="6" fill="#0284c7"/>
      </g>
    </g>

    <!-- cross.center -->
    <g transform="translate(216, 50)">
      <rect width="180" height="130" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="12" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#0284c7">.center</text>
      <g transform="translate(15, 32)">
        <rect x="0" y="5" width="36" height="75" rx="6" fill="#0284c7"/>
        <rect x="44" y="20" width="36" height="45" rx="6" fill="#0284c7"/>
        <rect x="88" y="12" width="36" height="60" rx="6" fill="#0284c7"/>
      </g>
    </g>

    <!-- cross.end -->
    <g transform="translate(412, 50)">
      <rect width="180" height="130" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="12" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#0284c7">.end</text>
      <g transform="translate(15, 32)">
        <rect x="0" y="10" width="36" height="75" rx="6" fill="#0284c7"/>
        <rect x="44" y="40" width="36" height="45" rx="6" fill="#0284c7"/>
        <rect x="88" y="25" width="36" height="60" rx="6" fill="#0284c7"/>
      </g>
    </g>

    <!-- cross.stretch / mainAxisSize -->
    <g transform="translate(608, 50)">
      <rect width="184" height="130" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="12" y="22" font-family="monospace" font-size="11" font-weight="bold" fill="#0284c7">.stretch</text>
      <g transform="translate(15, 32)">
        <rect x="0" y="0" width="38" height="85" rx="6" fill="#0284c7"/>
        <rect x="48" y="0" width="38" height="85" rx="6" fill="#0284c7"/>
        <rect x="96" y="0" width="38" height="85" rx="6" fill="#0284c7"/>
      </g>
      <text x="92" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Ocupa todo el alto transversal</text>
    </g>
  </g>
</svg>
