<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <filter id="shadow-comp" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-inherit" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 5, 0 10" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="16" fill="#f8fafc"/>

  <!-- Panel Izquierdo: Herencia (Java POO) -->
  <g transform="translate(30, 25)">
    <rect width="350" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-comp)"/>
    
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 48 L 0 48 Z" fill="#f1f5f9"/>
    <text x="24" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Herencia Clásica en POO (Java)</text>
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Jerarquía vertical rígida (Es-Un)</text>

    <!-- Inheritance Tree -->
    <g transform="translate(45, 65)">
      <!-- Level 1 -->
      <rect x="50" y="0" width="160" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="130" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Object / Node</text>

      <line x1="130" y1="32" x2="130" y2="52" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Level 2 -->
      <rect x="50" y="52" width="160" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="130" y="73" font-family="monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Control</text>

      <line x1="130" y1="84" x2="130" y2="104" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Level 3 -->
      <rect x="50" y="104" width="160" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="130" y="125" font-family="monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">ButtonBase / Button</text>

      <line x1="130" y1="136" x2="130" y2="156" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Level 4 -->
      <rect x="25" y="156" width="210" height="40" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="130" y="181" font-family="monospace" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">MiBotonConIcono (Extends)</text>
    </g>

    <!-- Footer Note -->
    <rect x="20" y="265" width="310" height="32" rx="6" fill="#f8fafc"/>
    <text x="175" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Alto acoplamiento y herencia profunda</text>
  </g>

  <!-- Panel Derecho: Composición (Flutter) -->
  <g transform="translate(420, 25)">
    <rect width="350" height="310" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow-comp)"/>
    
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 338 0 Q 350 0 350 12 L 350 48 L 0 48 Z" fill="#f0fdf4"/>
    <text x="24" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#14532d">Composición de Widgets (Flutter)</text>
    <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#16a34a">Encapsulamiento modular (Tiene-Un)</text>

    <!-- Composition Visual Nested Boxes -->
    <g transform="translate(25, 65)">
      <!-- Outer Box: ElevatedButton -->
      <rect x="0" y="0" width="300" height="185" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="14" y="24" font-family="monospace" font-size="12" font-weight="bold" fill="#1e40af">ElevatedButton(</text>

      <!-- Middle Box: Row -->
      <rect x="20" y="38" width="260" height="115" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
      <text x="34" y="60" font-family="monospace" font-size="12" font-weight="bold" fill="#166534">child: Row(children: [</text>

      <!-- Inner Item 1: Icon -->
      <rect x="35" y="76" width="105" height="58" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
      <circle cx="87" cy="98" r="10" fill="#dcfce7"/>
      <text x="87" y="103" font-family="system-ui, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">★</text>
      <text x="87" y="124" font-family="monospace" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">Icon(..)</text>

      <!-- Inner Item 2: Text -->
      <rect x="155" y="76" width="110" height="58" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
      <text x="210" y="101" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">"Guardar"</text>
      <text x="210" y="124" font-family="monospace" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">Text(..)</text>

      <text x="20" y="174" font-family="monospace" font-size="12" font-weight="bold" fill="#1e40af">))</text>
    </g>

    <!-- Footer Note -->
    <rect x="20" y="265" width="310" height="32" rx="6" fill="#f0fdf4"/>
    <text x="175" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#15803d" text-anchor="middle">Máxima flexibilidad, legibilidad y reusabilidad</text>
  </g>
</svg>
