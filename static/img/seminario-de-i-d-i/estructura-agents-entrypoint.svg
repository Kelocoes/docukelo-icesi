<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <defs>
    <style>
      :root {
        --canvas: #f8fafc;
        --card: #ffffff;
        --card-border: #e2e8f0;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --accent-blue: #2563eb;
        --accent-purple: #7c3aed;
        --accent-green: #059669;
        --surface-tint: #f1f5f9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #111827;
          --card: #1f2937;
          --card-border: #374151;
          --text-primary: #f9fafb;
          --text-secondary: #9ca3af;
          --accent-blue: #3b82f6;
          --accent-purple: #a855f7;
          --accent-green: #10b981;
          --surface-tint: #1e293b;
        }
      }
      .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>

    <filter id="subtle-shadow" x="-4%" y="-4%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="880" height="440" rx="16" fill="var(--canvas)" stroke="var(--card-border)" stroke-width="1.5"/>

  <!-- LEFT: HUB & SPOKE ENTRYPOINT -->
  <g transform="translate(30, 24)">
    <rect width="450" height="392" rx="12" fill="var(--card)" stroke="var(--card-border)" stroke-width="1.5" filter="url(#subtle-shadow)"/>
    
    <!-- Title -->
    <rect x="20" y="18" width="160" height="24" rx="6" fill="var(--surface-tint)"/>
    <text x="100" y="34" class="font-sans" font-size="11" font-weight="700" fill="var(--accent-blue)" text-anchor="middle">ARQUITECTURA MODULAR</text>
    <text x="20" y="66" class="font-sans" font-size="16" font-weight="700" fill="var(--text-primary)">AGENTS.md como Entrypoint</text>

    <!-- Central Hub -->
    <g transform="translate(20, 86)">
      <rect width="410" height="60" rx="8" fill="var(--surface-tint)" stroke="var(--accent-blue)" stroke-width="1.8"/>
      
      <!-- Vector Document Icon (NO EMOJIS) -->
      <g transform="translate(14, 14)">
        <rect width="32" height="32" rx="5" fill="var(--accent-blue)"/>
        <line x1="8" y1="10" x2="24" y2="10" stroke="#ffffff" stroke-width="2"/>
        <line x1="8" y1="16" x2="20" y2="16" stroke="#ffffff" stroke-width="2"/>
        <line x1="8" y1="22" x2="16" y2="22" stroke="#ffffff" stroke-width="2"/>
      </g>
      
      <text x="56" y="30" class="font-mono" font-size="12" font-weight="700" fill="var(--text-primary)">AGENTS.md (Raiz del Proyecto)</text>
      <text x="56" y="46" class="font-sans" font-size="10.5" fill="var(--text-secondary)">Comandos de construccion + Indice de punteros a .agents/</text>
    </g>

    <!-- Connectors with Direct Polygon Arrowheads -->
    <line x1="90" y1="146" x2="90" y2="175" stroke="var(--accent-blue)" stroke-width="2"/>
    <polygon points="86,174 90,181 94,174" fill="#2563eb"/>

    <line x1="225" y1="146" x2="225" y2="175" stroke="var(--accent-blue)" stroke-width="2"/>
    <polygon points="221,174 225,181 229,174" fill="#2563eb"/>

    <line x1="360" y1="146" x2="360" y2="175" stroke="var(--accent-blue)" stroke-width="2"/>
    <polygon points="356,174 360,181 364,174" fill="#2563eb"/>

    <!-- Satellites inside .agents/ -->
    <g transform="translate(20, 184)">
      <!-- Satellite 1: memory -->
      <g transform="translate(0, 0)">
        <rect width="130" height="175" rx="8" fill="var(--surface-tint)" stroke="var(--card-border)"/>
        <rect x="10" y="10" width="110" height="24" rx="4" fill="rgba(124, 58, 237, 0.1)"/>
        <text x="65" y="26" class="font-mono" font-size="10" font-weight="700" fill="var(--accent-purple)" text-anchor="middle">.agents/memory/</text>
        <text x="12" y="54" class="font-sans" font-size="10.5" font-weight="700" fill="var(--text-primary)">Memoria:</text>
        <text x="12" y="74" class="font-mono" font-size="9.5" fill="var(--text-secondary)">- arquitectura.md</text>
        <text x="12" y="90" class="font-mono" font-size="9.5" fill="var(--text-secondary)">- tokens-ui.md</text>
        <rect x="10" y="132" width="110" height="30" rx="4" fill="var(--card)" stroke="var(--card-border)"/>
        <text x="65" y="151" class="font-sans" font-size="9.5" fill="var(--text-secondary)" text-anchor="middle">Reglas duras</text>
      </g>

      <!-- Satellite 2: conventions -->
      <g transform="translate(140, 0)">
        <rect width="130" height="175" rx="8" fill="var(--surface-tint)" stroke="var(--card-border)"/>
        <rect x="10" y="10" width="110" height="24" rx="4" fill="rgba(5, 150, 105, 0.1)"/>
        <text x="65" y="26" class="font-mono" font-size="10" font-weight="700" fill="var(--accent-green)" text-anchor="middle">conventions/</text>
        <text x="12" y="54" class="font-sans" font-size="10.5" font-weight="700" fill="var(--text-primary)">Estandares:</text>
        <text x="12" y="74" class="font-mono" font-size="9.5" fill="var(--text-secondary)">- estilo-dart.md</text>
        <text x="12" y="90" class="font-mono" font-size="9.5" fill="var(--text-secondary)">- git-rules.md</text>
        <rect x="10" y="132" width="110" height="30" rx="4" fill="var(--card)" stroke="var(--card-border)"/>
        <text x="65" y="151" class="font-sans" font-size="9.5" fill="var(--text-secondary)" text-anchor="middle">Linters y Estilo</text>
      </g>

      <!-- Satellite 3: workflows -->
      <g transform="translate(280, 0)">
        <rect width="130" height="175" rx="8" fill="var(--surface-tint)" stroke="var(--card-border)"/>
        <rect x="10" y="10" width="110" height="24" rx="4" fill="rgba(37, 99, 235, 0.1)"/>
        <text x="65" y="26" class="font-mono" font-size="10" font-weight="700" fill="var(--accent-blue)" text-anchor="middle">workflows/</text>
        <text x="12" y="54" class="font-sans" font-size="10.5" font-weight="700" fill="var(--text-primary)">Procesos:</text>
        <text x="12" y="74" class="font-mono" font-size="9.5" fill="var(--text-secondary)">- checklist-ui.md</text>
        <text x="12" y="90" class="font-mono" font-size="9.5" fill="var(--text-secondary)">- pre-entrega.md</text>
        <rect x="10" y="132" width="110" height="30" rx="4" fill="var(--card)" stroke="var(--card-border)"/>
        <text x="65" y="151" class="font-sans" font-size="9.5" fill="var(--text-secondary)" text-anchor="middle">Criterios exito</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: FLYWHEEL DOCUMENTO VIVO -->
  <g transform="translate(505, 24)">
    <rect width="345" height="392" rx="12" fill="var(--card)" stroke="var(--card-border)" stroke-width="1.5" filter="url(#subtle-shadow)"/>
    
    <!-- Title -->
    <rect x="20" y="18" width="130" height="24" rx="6" fill="var(--surface-tint)"/>
    <text x="85" y="34" class="font-sans" font-size="11" font-weight="700" fill="var(--accent-green)" text-anchor="middle">DOCUMENTO VIVO</text>
    <text x="20" y="66" class="font-sans" font-size="16" font-weight="700" fill="var(--text-primary)">El Ciclo de Aprendizaje</text>

    <!-- Flywheel Steps with Polygon Arrowheads -->
    <g transform="translate(20, 96)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect width="305" height="58" rx="8" fill="var(--surface-tint)" stroke="var(--card-border)"/>
        <circle cx="24" cy="29" r="12" fill="#ef4444"/>
        <text x="24" y="33" class="font-sans" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
        <text x="46" y="24" class="font-sans" font-size="11.5" font-weight="700" fill="var(--text-primary)">Error Recurrente Detectado</text>
        <text x="46" y="42" class="font-mono" font-size="9.5" fill="var(--text-secondary)">Ej: El agente usa colores hex quemados</text>
      </g>

      <line x1="152" y1="58" x2="152" y2="72" stroke="var(--accent-green)" stroke-width="1.8"/>
      <polygon points="148,71 152,77 156,71" fill="#059669"/>

      <!-- Step 2 -->
      <g transform="translate(0, 78)">
        <rect width="305" height="58" rx="8" fill="var(--surface-tint)" stroke="var(--card-border)"/>
        <circle cx="24" cy="29" r="12" fill="#f59e0b"/>
        <text x="24" y="33" class="font-sans" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
        <text x="46" y="24" class="font-sans" font-size="11.5" font-weight="700" fill="var(--text-primary)">Regla Explicita en AGENTS.md</text>
        <text x="46" y="42" class="font-mono" font-size="9.5" fill="var(--accent-blue)">+ Usar Theme.of(context).colorScheme</text>
      </g>

      <line x1="152" y1="136" x2="152" y2="150" stroke="var(--accent-green)" stroke-width="1.8"/>
      <polygon points="148,149 152,155 156,149" fill="#059669"/>

      <!-- Step 3 -->
      <g transform="translate(0, 156)">
        <rect width="305" height="58" rx="8" fill="var(--surface-tint)" stroke="var(--accent-green)" stroke-width="1.4"/>
        <circle cx="24" cy="29" r="12" fill="#10b981"/>
        <text x="24" y="33" class="font-sans" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
        <text x="46" y="24" class="font-sans" font-size="11.5" font-weight="700" fill="var(--accent-green)">Alineacion Definitiva</text>
        <text x="46" y="42" class="font-mono" font-size="9.5" fill="var(--text-secondary)">El agente no vuelve a fallar en ese punto</text>
      </g>
    </g>

    <!-- Bottom summary -->
    <g transform="translate(20, 335)">
      <rect width="305" height="36" rx="6" fill="rgba(16, 185, 129, 0.1)"/>
      <text x="152" y="23" class="font-sans" font-size="10.5" font-weight="600" fill="var(--accent-green)" text-anchor="middle">No corrijas a mano 3 veces; actualiza el contrato.</text>
    </g>
  </g>
</svg>
