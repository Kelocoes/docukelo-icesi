<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .sub   { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .tag   { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1e293b; }
      .meta  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; }
    </style>
    <filter id="shadow-clean" x="-5%" y="-5%" width="110%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#865cf0"/>
    </marker>
  </defs>

  <!-- Canvas (880x440) -->
  <rect width="880" height="440" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(35, 26)">
    <rect x="0" y="0" width="165" height="20" rx="5" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="82.5" y="14" class="tag" fill="#b45309" text-anchor="middle">HUMAN-IN-THE-LEAD</text>
    <text x="0" y="44" class="title">Bucle de Auditoría y Refinamiento del Contrato</text>
    <text x="0" y="62" class="sub">Decisión estratégica: corregir la pantalla puntual o enseñar la regla al agente permanentemente</text>
  </g>

  <!-- STAGE 1: DIFF DEL AGENTE -->
  <g transform="translate(35, 110)">
    <rect width="190" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-clean)"/>
    <rect x="14" y="16" width="162" height="26" rx="6" fill="#f1f5f9"/>
    <text x="95" y="33" class="label" text-anchor="middle">1. DIFF DEL AGENTE</text>

    <!-- Terminal Mockup -->
    <g transform="translate(18, 58)">
      <rect width="154" height="110" rx="6" fill="#0f172a"/>
      <circle cx="14" cy="14" r="3" fill="#ef4444"/>
      <circle cx="23" cy="14" r="3" fill="#f59e0b"/>
      <circle cx="32" cy="14" r="3" fill="#10b981"/>

      <!-- Abstract Diff Bars -->
      <rect x="12" y="32" width="130" height="10" rx="2" fill="#ef4444" opacity="0.8"/>
      <rect x="12" y="48" width="130" height="10" rx="2" fill="#22c55e" opacity="0.8"/>
      <rect x="12" y="64" width="90" height="10" rx="2" fill="#38bdf8" opacity="0.6"/>
      <rect x="12" y="80" width="110" height="10" rx="2" fill="#94a3b8" opacity="0.4"/>
    </g>

    <!-- Tech Chip -->
    <rect x="18" y="195" width="154" height="26" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="95" y="212" class="meta" fill="#1d4ed8" text-anchor="middle">flutter analyze</text>

    <text x="95" y="246" class="label" text-anchor="middle">Inspección Humana</text>
    <text x="95" y="264" class="sub" text-anchor="middle">Verificación de diff</text>
  </g>

  <!-- Arrow to Fork -->
  <path d="M 230 250 L 265 250" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/>

  <!-- STAGE 2: DECISIÓN BIFURCADA (CENTER) -->
  <g transform="translate(275, 110)">
    
    <!-- Path A: Error Puntual (Top) -->
    <g transform="translate(0, 0)">
      <rect width="320" height="135" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadow-clean)"/>
      <rect x="14" y="14" width="120" height="20" rx="4" fill="#fef3c7"/>
      <text x="74" y="28" class="tag" fill="#b45309" text-anchor="middle">ERROR PUNTUAL</text>

      <g transform="translate(16, 44)">
        <rect width="38" height="42" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
        <circle cx="27" cy="30" r="5" fill="#f59e0b"/>
        <line x1="8" y1="12" x2="30" y2="12" stroke="#94a3b8" stroke-width="1.5"/>
        <line x1="8" y1="20" x2="22" y2="20" stroke="#94a3b8" stroke-width="1.5"/>

        <text x="50" y="20" class="label">Ajuste Manual en Código</text>
        <text x="50" y="36" class="sub">Typo menor o padding específico</text>
        <text x="50" y="54" class="meta" fill="#b45309">No modifica AGENTS.md</text>
      </g>
    </g>

    <!-- Path B: Patrón Sistémico (Bottom) -->
    <g transform="translate(0, 155)">
      <rect width="320" height="135" rx="10" fill="#ffffff" stroke="#865cf0" stroke-width="2" filter="url(#shadow-clean)"/>
      <rect x="14" y="14" width="150" height="20" rx="4" fill="#faf5ff"/>
      <text x="89" y="28" class="tag" fill="#7c3aed" text-anchor="middle">PATRÓN SISTÉMICO</text>

      <g transform="translate(16, 44)">
        <rect width="38" height="42" rx="5" fill="#ede9fe" stroke="#865cf0"/>
        <path d="M 12 16 L 26 16 M 12 24 L 22 24" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
        <circle cx="19" cy="33" r="3.5" fill="#7c3aed"/>

        <text x="50" y="20" class="label" fill="#4c1d95">Actualizar Contrato</text>
        <text x="50" y="36" class="sub" fill="#7c3aed">Regla en .agents/memory/</text>
        <text x="50" y="54" class="meta" fill="#6d28d9">Previene reincidencia futura</text>
      </g>
    </g>
  </g>

  <!-- Arrow to Stage 3 -->
  <path d="M 600 295 L 635 295" stroke="#865cf0" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- STAGE 3: CONTRATO VIVO EN GIT -->
  <g transform="translate(645, 110)">
    <rect width="200" height="290" rx="12" fill="#ffffff" stroke="#4cb979" stroke-width="2" filter="url(#shadow-clean)"/>
    <rect x="14" y="16" width="172" height="26" rx="6" fill="#ecfdf5"/>
    <text x="100" y="33" class="label" fill="#065f46" text-anchor="middle">3. CONTRATO VIVO</text>

    <!-- Visual Shield Graphic -->
    <g transform="translate(50, 68)">
      <circle cx="50" cy="45" r="38" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
      <circle cx="50" cy="45" r="24" fill="#4cb979"/>
      <path d="M 42 45 L 48 51 L 60 38" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Tech Chip: git commit -->
    <rect x="16" y="175" width="168" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="100" y="192" class="meta" fill="#0f172a" text-anchor="middle">git commit rules</text>

    <text x="100" y="232" class="label" fill="#065f46" text-anchor="middle">Regla Permanente</text>
    <text x="100" y="250" class="sub" text-anchor="middle">El equipo hereda</text>
    <text x="100" y="264" class="sub" text-anchor="middle">la memoria en Git</text>
  </g>
</svg>
