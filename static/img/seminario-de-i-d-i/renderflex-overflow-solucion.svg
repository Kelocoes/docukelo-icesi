<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="100%" height="100%">
  <defs>
    <filter id="shadow-scroll" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <pattern id="hazard-stripes" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#facc15" stroke-width="10"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="#000000" stroke-width="10"/>
    </pattern>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 5, 0 10" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="840" height="430" rx="16" fill="#f8fafc"/>

  <!-- Left: The RenderFlex Overflow Problem -->
  <g transform="translate(30, 25)">
    <rect width="375" height="380" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow-scroll)"/>

    <!-- Header -->
    <path d="M 0 14 Q 0 0 14 0 L 361 0 Q 375 0 375 14 L 375 48 L 0 48 Z" fill="#fef2f2"/>
    <text x="24" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#991b1b">El Problema: RenderFlex Overflow</text>
    <text x="24" y="42" font-family="monospace" font-size="11" fill="#dc2626">Column() sin capacidad de desplazamiento</text>

    <!-- Simulated Phone Viewport -->
    <g transform="translate(24, 60)">
      <rect width="327" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Stack of cards exceeding screen -->
      <g transform="translate(15, 12)">
        <rect width="297" height="50" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
        <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5b21b6">Tarjeta de Usuario #1</text>

        <rect y="58" width="297" height="50" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
        <text x="20" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5b21b6">Tarjeta de Usuario #2</text>

        <rect y="116" width="297" height="50" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
        <text x="20" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5b21b6">Tarjeta de Usuario #3</text>

        <rect y="174" width="297" height="50" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
        <text x="20" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5b21b6">Banner Informativo</text>
      </g>

      <!-- Yellow & Black Hazard Stripe Overlay -->
      <g transform="translate(0, 230)">
        <rect width="327" height="30" fill="url(#hazard-stripes)"/>
        <rect x="25" y="4" width="277" height="22" rx="4" fill="#000000" opacity="0.85"/>
        <text x="163.5" y="19" font-family="monospace" font-size="10.5" font-weight="bold" fill="#facc15" text-anchor="middle">
          A RenderFlex overflowed by 148 pixels
        </text>
      </g>
    </g>

    <!-- Bottom Tag -->
    <rect x="24" y="335" width="327" height="30" rx="6" fill="#fee2e2"/>
    <text x="187.5" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">
      La columna rígida no calcula scroll por defecto
    </text>
  </g>

  <!-- Right: The Solution with SingleChildScrollView -->
  <g transform="translate(435, 25)">
    <rect width="375" height="380" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="1.8" filter="url(#shadow-scroll)"/>

    <!-- Header -->
    <path d="M 0 14 Q 0 0 14 0 L 361 0 Q 375 0 375 14 L 375 48 L 0 48 Z" fill="#ecfdf5"/>
    <text x="24" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#065f46">La Solución: SingleChildScrollView</text>
    <text x="24" y="42" font-family="monospace" font-size="11" fill="#059669">SingleChildScrollView(child: Column(...))</text>

    <!-- Simulated Phone Viewport with Scroll Indicator -->
    <g transform="translate(24, 60)">
      <rect width="327" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Scrollable content -->
      <g transform="translate(15, 12)">
        <rect width="280" height="46" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#047857">Tarjeta de Usuario #1</text>

        <rect y="54" width="280" height="46" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="16" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#047857">Tarjeta de Usuario #2</text>

        <rect y="108" width="280" height="46" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="16" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#047857">Tarjeta de Usuario #3</text>

        <rect y="162" width="280" height="46" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="16" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#047857">Banner Informativo</text>

        <rect y="216" width="280" height="34" rx="17" fill="#6750a4"/>
        <text x="140" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Botón de Acción</text>
      </g>

      <!-- Scrollbar Track & Thumb -->
      <rect x="312" y="12" width="6" height="236" rx="3" fill="#e2e8f0"/>
      <rect x="312" y="20" width="6" height="65" rx="3" fill="#10b981"/>

      <!-- Gesture Motion Indicator -->
      <g transform="translate(140, 195)">
        <circle cx="20" cy="20" r="16" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow-scroll)"/>
        <line x1="20" y1="12" x2="20" y2="28" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-down)"/>
      </g>
    </g>

    <!-- Bottom Tag -->
    <rect x="24" y="335" width="327" height="30" rx="6" fill="#d1fae5"/>
    <text x="187.5" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#065f46" text-anchor="middle">
      Scroll vertical suave y adaptabilidad a cualquier celular
    </text>
  </g>
</svg>
