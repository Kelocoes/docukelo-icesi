<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF9" />
      <stop offset="100%" stop-color="#F4EFF7" />
    </linearGradient>
    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6750A4" />
      <stop offset="100%" stop-color="#5B4397" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect x="5" y="5" width="790" height="210" rx="16" fill="url(#bgGradient)" stroke="#E6E0E9" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Left Column: Content & Details -->
  <g transform="translate(40, 32)">
    <!-- Header Tag -->
    <rect x="0" y="0" width="175" height="24" rx="6" fill="#E8DEF8" />
    <text x="87" y="16" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#4F378A" text-anchor="middle" letter-spacing="0.5">CATÁLOGO DE COMPONENTES</text>

    <!-- Main Title -->
    <text x="0" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#1C1B1F">Biblioteca de Widgets Flutter</text>

    <!-- Description Lines -->
    <text x="0" y="78" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#49454F">Explora en tiempo real la anatomía, esquemas de color y comportamiento</text>
    <text x="0" y="98" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#49454F">de la colección completa de componentes de Material Design 3 en Flutter Web.</text>

    <!-- URL Display Pill -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="370" height="32" rx="8" fill="#FFFFFF" stroke="#CAC4D0" stroke-width="1" />
      <!-- Link Vector Icon -->
      <path d="M14 11 A4 4 0 0 0 10 15 L10 17 A4 4 0 0 0 14 21 L16 21 A4 4 0 0 0 20 17" fill="none" stroke="#6750A4" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M18 13 A4 4 0 0 0 22 9 L22 7 A4 4 0 0 0 18 3 L16 3 A4 4 0 0 0 12 7" fill="none" stroke="#6750A4" stroke-width="1.5" stroke-linecap="round" transform="translate(0, 8)"/>
      <line x1="13" y1="16" x2="19" y2="16" stroke="#6750A4" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Green active status dot -->
      <circle cx="16" cy="16" r="3.5" fill="#10B981" />
      <text x="32" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#6750A4">https://kelocoes.github.io/widgets-flutter-material</text>
    </g>
  </g>

  <!-- Right Column: Visual Widgets Preview Mockup -->
  <g transform="translate(490, 24)">
    <!-- Outer Card Shell -->
    <rect x="0" y="0" width="270" height="172" rx="14" fill="#FFFFFF" stroke="#E6E0E9" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- Mini Header inside Preview -->
    <rect x="16" y="16" width="90" height="22" rx="11" fill="#E8DEF8" />
    <text x="61" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4F378A" text-anchor="middle">Material 3</text>

    <!-- Mini Switch Preview -->
    <rect x="204" y="17" width="50" height="20" rx="10" fill="#6750A4" />
    <circle cx="242" cy="27" r="7" fill="#FFFFFF" />

    <!-- Preview Content Elements -->
    <text x="16" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Componentes UI</text>
    <rect x="16" y="72" width="160" height="6" rx="3" fill="#79747E" fill-opacity="0.3" />
    <rect x="16" y="84" width="110" height="6" rx="3" fill="#79747E" fill-opacity="0.2" />

    <!-- Mini Action Button inside Preview -->
    <g transform="translate(16, 108)">
      <rect x="0" y="0" width="110" height="34" rx="17" fill="url(#btnGradient)" />
      <!-- Play / Arrow icon -->
      <polygon points="18,12 18,22 26,17" fill="#FFFFFF" />
      <text x="64" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Explorar</text>
    </g>

    <!-- Mini Outlined Chip / Secondary element -->
    <g transform="translate(136, 108)">
      <rect x="0" y="0" width="118" height="34" rx="17" fill="#F4EFF7" stroke="#CAC4D0" stroke-width="1" />
      <text x="59" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle">Ver Código</text>
    </g>

    <!-- Bottom subtle bar -->
    <rect x="16" y="156" width="238" height="3" rx="1.5" fill="#E8DEF8" />
  </g>
</svg>
