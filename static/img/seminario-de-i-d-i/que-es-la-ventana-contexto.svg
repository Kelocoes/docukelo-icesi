<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 800; fill: #1e293b; }
      .subtitle { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #64748b; }
      .box-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .box-desc { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #475569; }
      .badge { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 800; }
    </style>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="920" height="440" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="40" y="44" class="title">La Ventana de Contexto: La Memoria a Corto Plazo del LLM</text>
  <text x="40" y="68" class="subtitle">El búfer de tokens finito que se reensambla en cada turno para alimentar la función matemática del modelo</text>

  <!-- Universo Repositorio (Fuera de Contexto) -->
  <g transform="translate(40, 100)" filter="url(#shadow3)">
    <rect width="210" height="235" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="38" rx="12" fill="#F1F5F9"/>
    <rect x="0" y="26" width="210" height="12" fill="#F1F5F9"/>
    <text x="14" y="25" class="box-title" fill="#475569">Tu Repositorio</text>

    <text x="14" y="64" class="box-desc">• Millones de líneas de código</text>
    <text x="14" y="86" class="box-desc">• Cientos de archivos en lib/</text>
    <text x="14" y="108" class="box-desc">• Historiales de git pasados</text>
    <text x="14" y="130" class="box-desc">• Dependencias de Flutter</text>

    <rect x="14" y="152" width="182" height="66" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="22" y="174" class="badge" fill="#C2410C">NO CABE TODO A LA VEZ</text>
    <text x="22" y="194" class="box-desc" font-size="11.5px" fill="#9A3412">El LLM no puede "leer"</text>
    <text x="22" y="208" class="box-desc" font-size="11.5px" fill="#9A3412">todo el disco en memoria.</text>
  </g>

  <!-- Flecha de Selección y Carga -->
  <path d="M 255 210 L 305 210" fill="none" stroke="#5454E9" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="280" y="198" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="10.5px" font-weight="700" fill="#5454E9">Carga</text>

  <!-- Ventana de Contexto (El Búfer) -->
  <g transform="translate(315, 95)" filter="url(#shadow3)">
    <rect width="310" height="245" rx="12" fill="#FFFFFF" stroke="#5454E9" stroke-width="2.5"/>
    <rect x="0" y="0" width="310" height="42" rx="12" fill="#EEF2FF"/>
    <rect x="0" y="30" width="310" height="12" fill="#EEF2FF"/>
    <text x="16" y="28" class="box-title" fill="#5454E9">Ventana de Contexto (Tokens)</text>

    <!-- Capas internas apiladas -->
    <rect x="16" y="56" width="278" height="28" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="26" y="75" font-family="Plus Jakarta Sans" font-size="12px" font-weight="700" fill="#7C3AED">1. System Prompt del CLI</text>

    <rect x="16" y="90" width="278" height="28" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="26" y="109" font-family="Plus Jakarta Sans" font-size="12px" font-weight="700" fill="#2563EB">2. Contrato AGENTS.md (Reglas)</text>

    <rect x="16" y="124" width="278" height="28" rx="6" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="26" y="143" font-family="Plus Jakarta Sans" font-size="12px" font-weight="700" fill="#15803D">3. Historial de Turnos Recientes</text>

    <rect x="16" y="158" width="278" height="28" rx="6" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="26" y="177" font-family="Plus Jakarta Sans" font-size="12px" font-weight="700" fill="#B45309">4. Herramientas y Estado Actual</text>

    <rect x="16" y="192" width="278" height="34" rx="6" fill="#EEF2FF" stroke="#5454E9" stroke-width="1.8"/>
    <text x="26" y="213" font-family="Plus Jakarta Sans" font-size="12.5px" font-weight="800" fill="#5454E9">5. Prompt Actual del Usuario →</text>
  </g>

  <!-- Flecha a Inferencia -->
  <path d="M 630 210 L 680 210" fill="none" stroke="#4CB979" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="655" y="198" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="10.5px" font-weight="700" fill="#059669">Inferencia</text>

  <!-- LLM Stateless -->
  <g transform="translate(690, 100)" filter="url(#shadow3)">
    <rect width="190" height="235" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="38" rx="12" fill="#F0FDF4"/>
    <rect x="0" y="26" width="190" height="12" fill="#F0FDF4"/>
    <text x="14" y="25" class="box-title" fill="#047857">Función LLM f(x)</text>

    <text x="14" y="64" class="box-desc" font-weight="700">Sin Estado (Stateless)</text>
    <text x="14" y="86" class="box-desc">• Evalúa los tokens del búfer</text>
    <text x="14" y="108" class="box-desc">• Devuelve la respuesta</text>
    <text x="14" y="130" class="box-desc">• Olvida todo al terminar</text>

    <rect x="14" y="152" width="162" height="66" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="20" y="174" class="badge" fill="#047857">RESPUESTA PRECISA</text>
    <text x="20" y="194" class="box-desc" font-size="11px" fill="#065F46">Depende 100% de lo</text>
    <text x="20" y="208" class="box-desc" font-size="11px" fill="#065F46">que esté en el búfer.</text>
  </g>

  <!-- Barra de síntesis inferior -->
  <rect x="40" y="355" width="840" height="55" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="56" y="386" font-family="Plus Jakarta Sans" font-size="13px" fill="#334155">
    <tspan font-weight="800" fill="#5454E9">Regla de Oro:</tspan> La ventana de contexto es la <tspan font-weight="700">única realidad del modelo</tspan>. Lo que no esté ensamblado en sus tokens en ese milisegundo, no existe.
  </text>
</svg>