<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" width="100%" height="100%">
  <defs>
    <filter id="shadow-flutter" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-flutter" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="740" height="230" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 3 Continuous Stages -->
  <g transform="translate(40, 25)">
    <!-- Stage 1: Framework Dart -->
    <g transform="translate(0, 0)">
      <rect width="200" height="135" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow-flutter)"/>
      <rect width="200" height="30" rx="10" fill="#eff6ff"/>
      <text x="100" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Framework Dart</text>
      
      <rect x="15" y="44" width="170" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="100" y="65" font-family="monospace" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Widgets / Material</text>
      
      <text x="100" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Árbol de Widgets,</text>
      <text x="100" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Animaciones y Gestos</text>
    </g>

    <line x1="202" y1="67" x2="228" y2="67" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-flutter)"/>

    <!-- Stage 2: Flutter Engine C++ -->
    <g transform="translate(230, 0)">
      <rect width="200" height="135" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow-flutter)"/>
      <rect width="200" height="30" rx="10" fill="#f0fdf4"/>
      <text x="100" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">2. Engine (Impeller / Skia)</text>
      
      <rect x="15" y="44" width="170" height="34" rx="6" fill="#dcfce7" stroke="#86efac"/>
      <text x="100" y="65" font-family="monospace" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Motor Gráfico 2D C++</text>
      
      <text x="100" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Compila shaders y</text>
      <text x="100" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">calcula píxeles a renderizar</text>
    </g>

    <line x1="432" y1="67" x2="458" y2="67" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-flutter)"/>

    <!-- Stage 3: Direct Screen GPU -->
    <g transform="translate(460, 0)">
      <rect width="200" height="135" rx="10" fill="#ffffff" stroke="#4ade80" stroke-width="1.5" filter="url(#shadow-flutter)"/>
      <rect width="200" height="30" rx="10" fill="#dcfce7"/>
      <text x="100" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">3. Lienzo GPU Directo</text>
      
      <rect x="15" y="44" width="170" height="34" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="100" y="65" font-family="monospace" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">Vulkan / Metal / OpenGL</text>
      
      <text x="100" y="102" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">Dibujo directo a 60/120 fps</text>
      <text x="100" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Sin tocar widgets del SO</text>
    </g>
  </g>

  <!-- Bottom Note -->
  <g transform="translate(130, 178)">
    <rect width="480" height="36" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="240" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">
      Control total pixel-perfect: renderizado determinista, fluido y consistente en cualquier pantalla
    </text>
  </g>
</svg>
