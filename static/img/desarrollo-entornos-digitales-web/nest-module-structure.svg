<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="100%" height="100%">
  <defs>
    <!-- Sombra suave para las tarjetas -->
    <filter id="mod-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- Marcadores de flechas -->
    <marker id="arrow-blue-mod" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green-mod" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple-mod" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333ea"/>
    </marker>
  </defs>

  <style>
    .mod-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 16px; fill: #0f172a; }
    .mod-subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; }
    .prop-tag { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.5px; }
    .prop-class { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; }
    .prop-desc { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 11px; fill: #475569; }
    .flow-label { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11.5px; }
  </style>

  <!-- CONTENEDOR PRINCIPAL: LÍMITE DEL MÓDULO -->
  <rect x="15" y="15" width="810" height="395" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#mod-shadow)"/>
  
  <!-- Encabezado del Módulo -->
  <rect x="15" y="15" width="810" height="42" rx="16" fill="#f8fafc"/>
  <rect x="15" y="42" width="810" height="15" fill="#f8fafc"/>
  <text x="35" y="42" class="mod-title">@Module({ ... }) — Estructura y Metadatos de un Módulo en NestJS</text>
  <text x="560" y="42" class="mod-subtitle">Frontera de Encapsulación de Componentes</text>

  <!-- ========================================== -->
  <!-- 1. IMPORTS (ENTRADA DESDE OTROS MÓDULOS)   -->
  <!-- ========================================== -->
  <g transform="translate(35, 80)">
    <rect x="0" y="0" width="165" height="305" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" filter="url(#mod-shadow)"/>
    <rect x="0" y="0" width="165" height="32" rx="12" fill="#dbeafe"/>
    <rect x="0" y="22" width="165" height="10" fill="#dbeafe"/>
    <text x="82" y="22" class="prop-tag" fill="#1e3a8a" text-anchor="middle">imports: [ ]</text>
    
    <text x="82" y="55" class="prop-class" fill="#1d4ed8" text-anchor="middle">Módulos Externos</text>
    <line x1="15" y1="70" x2="150" y2="70" stroke="#bfdbfe" stroke-width="1"/>
    
    <text x="82" y="95" class="prop-desc" text-anchor="middle">Trae providers que</text>
    <text x="82" y="112" class="prop-desc" text-anchor="middle">fueron exportados por</text>
    <text x="82" y="129" class="prop-desc" text-anchor="middle">otros módulos.</text>
    
    <rect x="15" y="150" width="135" height="55" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="82" y="172" class="prop-class" font-size="11.5px" fill="#1e3a8a" text-anchor="middle">TypeOrmModule</text>
    <text x="82" y="190" class="prop-desc" font-size="10px" text-anchor="middle">.forFeature([User])</text>

    <rect x="15" y="220" width="135" height="55" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="82" y="242" class="prop-class" font-size="11.5px" fill="#1e3a8a" text-anchor="middle">CommonModule</text>
    <text x="82" y="260" class="prop-desc" font-size="10px" text-anchor="middle">Utilidades globales</text>
  </g>

  <!-- Flecha Imports -> Núcleo -->
  <path d="M 205 230 L 245 230" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue-mod)"/>
  <text x="225" y="218" class="flow-label" fill="#1e3a8a" text-anchor="middle">Aporta</text>

  <!-- ========================================== -->
  <!-- 2 & 3. NÚCLEO INTERNO: CONTROLLERS & PROVIDERS -->
  <!-- ========================================== -->
  <rect x="255" y="80" width="345" height="305" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="427" y="105" class="prop-tag" fill="#334155" text-anchor="middle">ÁMBITO INTERNO DEL MÓDULO</text>
  <line x1="275" y1="115" x2="580" y2="115" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Sub-caja Controllers -->
  <g transform="translate(275, 130)">
    <rect x="0" y="0" width="145" height="235" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.8" filter="url(#mod-shadow)"/>
    <rect x="0" y="0" width="145" height="30" rx="10" fill="#fef08a"/>
    <rect x="0" y="20" width="145" height="10" fill="#fef08a"/>
    <text x="72" y="21" class="prop-tag" fill="#713f12" text-anchor="middle">controllers: [ ]</text>
    
    <text x="72" y="55" class="prop-class" fill="#854d0e" text-anchor="middle">UsersController</text>
    <line x1="12" y1="70" x2="133" y2="70" stroke="#fde047" stroke-width="1"/>
    
    <text x="72" y="95" class="prop-desc" text-anchor="middle">Rutas HTTP</text>
    <text x="72" y="112" class="prop-desc" text-anchor="middle">Escucha peticiones</text>
    <text x="72" y="130" class="prop-desc" text-anchor="middle">GET, POST, etc.</text>
    <text x="72" y="165" class="prop-desc" text-anchor="middle">Recibe Providers</text>
    <text x="72" y="182" class="prop-desc" text-anchor="middle">por su constructor</text>
  </g>

  <!-- Flecha Interna: Providers -> Controllers -->
  <path d="M 445 245 L 425 245" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green-mod)"/>
  <text x="435" y="235" class="flow-label" fill="#15803d" text-anchor="middle">DI</text>

  <!-- Sub-caja Providers -->
  <g transform="translate(445, 130)">
    <rect x="0" y="0" width="140" height="235" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8" filter="url(#mod-shadow)"/>
    <rect x="0" y="0" width="140" height="30" rx="10" fill="#dcfce7"/>
    <rect x="0" y="20" width="140" height="10" fill="#dcfce7"/>
    <text x="70" y="21" class="prop-tag" fill="#14532d" text-anchor="middle">providers: [ ]</text>
    
    <text x="70" y="55" class="prop-class" fill="#15803d" text-anchor="middle">UsersService</text>
    <line x1="12" y1="70" x2="128" y2="70" stroke="#bbf7d0" stroke-width="1"/>
    
    <text x="70" y="95" class="prop-desc" text-anchor="middle">Servicios y lógica</text>
    <text x="70" y="112" class="prop-desc" text-anchor="middle">de negocio.</text>
    <text x="70" y="140" class="prop-desc" text-anchor="middle">Por defecto son</text>
    <text x="70" y="157" class="prop-desc" font-weight="700" fill="#dc2626" text-anchor="middle">PRIVADOS</text>
    <text x="70" y="174" class="prop-desc" text-anchor="middle">al módulo.</text>
  </g>

  <!-- Flecha Providers -> Exports -->
  <path d="M 605 245 L 640 245" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple-mod)"/>
  <text x="622" y="233" class="flow-label" fill="#7e22ce" text-anchor="middle">Publica</text>

  <!-- ========================================== -->
  <!-- 4. EXPORTS (SALIDA AL EXTERIOR)            -->
  <!-- ========================================== -->
  <g transform="translate(645, 80)">
    <rect x="0" y="0" width="160" height="305" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.8" filter="url(#mod-shadow)"/>
    <rect x="0" y="0" width="160" height="32" rx="12" fill="#f3e8ff"/>
    <rect x="0" y="22" width="160" height="10" fill="#f3e8ff"/>
    <text x="80" y="22" class="prop-tag" fill="#581c87" text-anchor="middle">exports: [ ]</text>
    
    <text x="80" y="55" class="prop-class" fill="#7e22ce" text-anchor="middle">API Pública</text>
    <line x1="15" y1="70" x2="145" y2="70" stroke="#e9d5ff" stroke-width="1"/>
    
    <text x="80" y="95" class="prop-desc" text-anchor="middle">Permite que otros</text>
    <text x="80" y="112" class="prop-desc" text-anchor="middle">módulos usen estos</text>
    <text x="80" y="129" class="prop-desc" text-anchor="middle">providers específicos.</text>
    
    <rect x="12" y="165" width="135" height="60" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
    <text x="80" y="190" class="prop-class" font-size="11.5px" fill="#6b21a8" text-anchor="middle">UsersService</text>
    <text x="80" y="208" class="prop-desc" font-size="10px" font-weight="600" fill="#16a34a" text-anchor="middle">Visible externamente</text>
  </g>
</svg>
