<svg id="multiStageVisual" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" style="max-width:960px;display:block;margin:0 auto" role="img" aria-labelledby="multiVis-ttl multiVis-dsc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
  <title id="multiVis-ttl">Construcción Multietapa en Docker</title>
  <desc id="multiVis-dsc">Proceso gráfico de filtrado y compilación en Docker que transforma un entorno pesado de 1.2 GB en un contenedor ligero de producción de 140 MB.</desc>
  <defs>
    <style>
      #multiStageVisual .title { fill: #161A26; font-size: 22px; font-weight: 700; }
      #multiStageVisual .sub { fill: #79809A; font-size: 13.5px; }
      #multiStageVisual .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #multiStageVisual .gear { fill: #94A3B8; }
    </style>
    <marker id="pipeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L2.4,5 Z" fill="#4453C9"/>
    </marker>
    <marker id="pipeArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L2.4,5 Z" fill="#16A34A"/>
    </marker>
    <filter id="visLift" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="#FBFBFD"/>

  <!-- Encabezado -->
  <text class="title" x="48" y="50">El Embudo de Optimización Multi-Stage</text>
  <text class="sub" x="48" y="74">Cómo Docker filtra y descarta herramientas de compilación para dejar un contenedor mínimo en la nube</text>

  <!-- ========================================== -->
  <!-- ETAPA 1: CONTENEDOR PESADO (DEPS)         -->
  <!-- ========================================== -->
  <g transform="translate(50, 115)" filter="url(#visLift)">
    <rect width="230" height="310" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Chip numerado -->
    <circle cx="32" cy="30" r="12" fill="#4453C9"/>
    <text x="32" y="30" dy="0.35em" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
    <text class="mono" x="52" y="35" font-size="13" font-weight="700" fill="#4453C9">deps</text>

    <!-- Caja pesada estilizada -->
    <g transform="translate(30, 60)">
      <rect width="170" height="150" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
      <!-- Paquetes dentro -->
      <rect x="15" y="15" width="140" height="26" rx="4" fill="#E2E8F0"/>
      <text class="mono" x="25" y="32" font-size="10.5" fill="#334155">npm ci (todo)</text>
      <rect x="15" y="48" width="140" height="26" rx="4" fill="#CBD5E1"/>
      <text class="mono" x="25" y="65" font-size="10" fill="#475569">typescript + jest</text>
      <rect x="15" y="81" width="140" height="26" rx="4" fill="#CBD5E1"/>
      <text class="mono" x="25" y="98" font-size="10" fill="#475569">@types/* + linters</text>
      <rect x="15" y="114" width="140" height="26" rx="4" fill="#94A3B8"/>
      <text class="mono" x="25" y="131" font-size="10" fill="#FFFFFF">node_modules (all)</text>
    </g>

    <!-- Peso de la etapa -->
    <rect x="30" y="235" width="170" height="45" rx="8" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="115" y="254" text-anchor="middle" font-size="11" font-weight="600" fill="#991B1B">PESO COMPLETO</text>
    <text class="mono" x="115" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">~1.2 GB</text>
  </g>

  <!-- Flecha deps -> builder -->
  <path d="M 280, 250 H 335" fill="none" stroke="#4453C9" stroke-width="2.5" marker-end="url(#pipeArrow)"/>

  <!-- ========================================== -->
  <!-- ETAPA 2: MÁQUINA DE COMPILACIÓN (BUILDER)  -->
  <!-- ========================================== -->
  <g transform="translate(350, 115)" filter="url(#visLift)">
    <rect width="250" height="310" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Chip numerado -->
    <circle cx="32" cy="30" r="12" fill="#7439B8"/>
    <text x="32" y="30" dy="0.35em" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
    <text class="mono" x="52" y="35" font-size="13" font-weight="700" fill="#7439B8">builder</text>

    <!-- MÁQUINA / HORNO DE COMPILACIÓN -->
    <g transform="translate(25, 60)">
      <rect width="200" height="150" rx="10" fill="#1E2330" stroke="#0F131D" stroke-width="2"/>
      
      <!-- Engranaje / Símbolo de build -->
      <g transform="translate(100, 50)">
        <circle cx="0" cy="0" r="22" fill="#3B82F6" stroke="#60A5FA" stroke-width="2"/>
        <circle cx="0" cy="0" r="8" fill="#1E2330"/>
        <!-- Dientes de engranaje -->
        <rect x="-3" y="-27" width="6" height="8" rx="1" fill="#60A5FA"/>
        <rect x="-3" y="19" width="6" height="8" rx="1" fill="#60A5FA"/>
        <rect x="-27" y="-3" width="8" height="6" rx="1" fill="#60A5FA"/>
        <rect x="19" y="-3" width="8" height="6" rx="1" fill="#60A5FA"/>
      </g>

      <text class="mono" x="100" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#93C5FD">npm run build</text>
      
      <!-- Entrada y Salida -->
      <text class="mono" x="20" y="125" font-size="10" fill="#F87171">src/ (*.ts)</text>
      <text class="mono" x="95" y="125" font-size="12" fill="#94A3B8">→</text>
      <text class="mono" x="120" y="125" font-size="10" font-weight="700" fill="#4ADE80">dist/ (*.js)</text>
    </g>

    <!-- PAPELERA / DESCARTE DE COMPILADOR -->
    <g transform="translate(25, 230)">
      <rect width="200" height="60" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>
      <path d="M20,28 L30,28 M25,28 V45 M22,33 H28" fill="none" stroke="#64748B" stroke-width="1.5"/>
      <text x="40" y="28" font-size="10.5" font-weight="700" fill="#64748B">DESCARTADO:</text>
      <text class="mono" x="40" y="44" font-size="10" fill="#94A3B8">tsc, tests, código .ts</text>
    </g>
  </g>

  <!-- Flecha builder -> runner -->
  <path d="M 600, 250 H 655" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#pipeArrowGreen)"/>

  <!-- ========================================== -->
  <!-- ETAPA 3: CONTENEDOR FINAL LIGERO (RUNNER)  -->
  <!-- ========================================== -->
  <g transform="translate(670, 115)" filter="url(#visLift)">
    <rect width="240" height="310" rx="14" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>

    <!-- Chip numerado -->
    <circle cx="32" cy="30" r="12" fill="#16A34A"/>
    <text x="32" y="30" dy="0.35em" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
    <text class="mono" x="52" y="35" font-size="13" font-weight="700" fill="#16A34A">runner (Nube)</text>

    <!-- CÁPSULA ULTRA COMPACTA -->
    <g transform="translate(25, 60)">
      <rect width="190" height="150" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
      
      <!-- Contenido exacto -->
      <rect x="15" y="18" width="160" height="30" rx="4" fill="#DCFCE7"/>
      <circle cx="28" cy="33" r="4" fill="#16A34A"/>
      <text class="mono" x="38" y="38" font-size="11" font-weight="700" fill="#14532D">dist/main.js</text>

      <rect x="15" y="56" width="160" height="30" rx="4" fill="#DCFCE7"/>
      <circle cx="28" cy="71" r="4" fill="#16A34A"/>
      <text class="mono" x="38" y="76" font-size="11" font-weight="700" fill="#14532D">node_modules (prod)</text>

      <rect x="15" y="96" width="160" height="36" rx="4" fill="#1E2330"/>
      <text class="mono" x="25" y="118" font-size="10.5" fill="#86EFAC">node dist/main</text>
    </g>

    <!-- Peso Ligero -->
    <rect x="25" y="235" width="190" height="45" rx="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="120" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#14532D">TAMAÑO FINAL PRODUCTIVO</text>
    <text class="mono" x="120" y="272" text-anchor="middle" font-size="14" font-weight="800" fill="#15803D">~140 MB (-88%)</text>
  </g>
</svg>
