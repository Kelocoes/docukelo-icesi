<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="twGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="daisyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5454e9"/>
      <stop offset="100%" stop-color="#865cf0"/>
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadowLight" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="820" height="320" rx="16" fill="url(#bgLight)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header Section -->
  <text x="410" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">
    Arquitectura de Capas: De las Utilidades a los Componentes
  </text>
  <text x="410" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">
    Analogía culinaria: los ingredientes atómicos se transforman en platos preparados para la interfaz
  </text>

  <!-- Step 1: Tailwind CSS (Ingredientes) -->
  <g transform="translate(40, 95)" filter="url(#shadowLight)">
    <rect width="210" height="185" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="210" height="6" rx="3" fill="url(#twGrad)"/>
    
    <!-- Badge -->
    <rect x="16" y="20" width="105" height="22" rx="11" fill="#e0f2fe"/>
    <text x="68" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0284c7">INGREDIENTES</text>

    <!-- Title -->
    <text x="16" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Tailwind CSS v4</text>
    <text x="16" y="84" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Clases atómicas utilitarias</text>

    <!-- Code pill samples -->
    <g transform="translate(16, 102)">
      <rect width="80" height="24" rx="6" fill="#f1f5f9"/>
      <text x="40" y="16" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#334155">flex</text>

      <rect x="88" width="90" height="24" rx="6" fill="#f1f5f9"/>
      <text x="133" y="16" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#334155">p-4</text>
    </g>
    <g transform="translate(16, 134)">
      <rect width="86" height="24" rx="6" fill="#f1f5f9"/>
      <text x="43" y="16" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#334155">rounded-xl</text>

      <rect x="94" width="84" height="24" rx="6" fill="#f1f5f9"/>
      <text x="136" y="16" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#334155">bg-blue-600</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(262, 180)">
    <circle cx="16" cy="0" r="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadowLight)"/>
    <path d="M12 -5 L19 0 L12 5" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 2: daisyUI 5 (Platos preparados) -->
  <g transform="translate(305, 95)" filter="url(#shadowLight)">
    <rect width="210" height="185" rx="12" fill="#ffffff" stroke="#5454e9" stroke-width="2"/>
    <rect width="210" height="6" rx="3" fill="url(#daisyGrad)"/>
    
    <!-- Badge -->
    <rect x="16" y="20" width="125" height="22" rx="11" fill="#ede9fe"/>
    <text x="78" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6d28d9">PLATOS PREPARADOS</text>

    <!-- Title -->
    <text x="16" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">daisyUI 5</text>
    <text x="16" y="84" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Componentes semánticos CSS</text>

    <!-- Component pill samples -->
    <g transform="translate(16, 102)">
      <rect width="84" height="24" rx="6" fill="#ede9fe"/>
      <text x="42" y="16" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#5454e9">.btn</text>

      <rect x="92" width="86" height="24" rx="6" fill="#ede9fe"/>
      <text x="135" y="16" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#5454e9">.card</text>
    </g>
    <g transform="translate(16, 134)">
      <rect width="84" height="24" rx="6" fill="#ede9fe"/>
      <text x="42" y="16" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#5454e9">.navbar</text>

      <rect x="92" width="86" height="24" rx="6" fill="#ede9fe"/>
      <text x="135" y="16" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#5454e9">.fieldset</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(527, 180)">
    <circle cx="16" cy="0" r="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadowLight)"/>
    <path d="M12 -5 L19 0 L12 5" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 3: Next.js App (El Banquete) -->
  <g transform="translate(570, 95)" filter="url(#shadowLight)">
    <rect width="210" height="185" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="210" height="6" rx="3" fill="url(#appGrad)"/>
    
    <!-- Badge -->
    <rect x="16" y="20" width="105" height="22" rx="11" fill="#d1fae5"/>
    <text x="68" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">EXPERIENCIA</text>

    <!-- Title -->
    <text x="16" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">App Next.js</text>
    <text x="16" y="84" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">UI limpia y temas dinámicos</text>

    <!-- Value propositions -->
    <g transform="translate(16, 104)">
      <circle cx="6" cy="6" r="4" fill="#10b981"/>
      <text x="16" y="9" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Marcado JSX compacto</text>
    </g>
    <g transform="translate(16, 128)">
      <circle cx="6" cy="6" r="4" fill="#10b981"/>
      <text x="16" y="9" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Temas con data-theme</text>
    </g>
    <g transform="translate(16, 152)">
      <circle cx="6" cy="6" r="4" fill="#10b981"/>
      <text x="16" y="9" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Sobreescritura ágil</text>
    </g>
  </g>
</svg>
